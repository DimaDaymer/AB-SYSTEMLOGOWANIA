<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
        }

        #navbar-container {
            width: 100%;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            gap: 20px;
        }

        h1 {
            color: #f0f0f0;
            margin-bottom: 20px;
        }

        .list-header {
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .list-controls {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        #sort-by {
            padding: 8px;
            border-radius: 4px;
            background-color: #333;
            color: #f0f0f0;
            border: 1px solid #555;
        }

        /* Обновленные стили для карточек альбомов */
        .album-list-container {
            width: 100%;
        }

        /* Контейнер для SortableJS */
        .album-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .album-card {
            display: flex;
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            position: relative;
            transition: background-color 0.2s;
        }

        .album-card:hover {
            background-color: #333333;
        }

        /* Стили для ручки перетаскивания (drag handle) */
        .drag-handle {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 15px; /* Переместил влево */
            font-size: 1.5em;
            cursor: grab; /* Изменяем курсор для D&D */
            color: #00ffcc;
            z-index: 10;
            padding: 5px;
            line-height: 1;
            opacity: 0.6;
            transition: opacity 0.2s;
            /* Сдвигаем все содержимое карточки вправо, чтобы освободить место для ручки */
            margin-right: 15px;
        }

        /* Убедимся, что ручка видна, когда сортировка ручная */
        .sortable-list .album-card:hover .drag-handle {
            opacity: 1;
        }

        /* Стили для SortableJS */
        .sortable-ghost {
            opacity: 0.4 !important;
            background-color: #555555 !important;
            border: 1px dashed #00ffcc !important;
        }

        .album-card a {
            display: flex;
            width: 100%;
            text-decoration: none;
            color: inherit;
            /* Устанавливаем отступ слева, чтобы избежать перекрытия с ручкой */
            padding-left: 30px;
        }

        /* Когда ручная сортировка не активна, убираем padding */
        .album-list:not(.sortable-list) .album-card a {
            padding-left: 0;
        }

        .album-card img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .album-details {
            margin-left: 15px;
            flex-grow: 1;
        }

        .album-details h2 {
            margin: 0 0 5px 0;
            font-size: 1.2em;
            color: #00ffcc;
        }

        .album-details p {
            margin: 2px 0;
            font-size: 0.9em;
            color: #b0b0b0;
        }

        .rating-info {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .score {
            font-weight: bold;
            color: #f5c518;
        }

        .album-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .action-button {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            background-color: #444;
            color: #f0f0f0;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s ease;
        }

        .action-button:hover {
            background-color: #555;
        }

    </style>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

<div class="content-wrapper">
    <div class="list-header">
        <h1>Название Списка</h1>
        <p>Автор списка • Дата создания</p>
    </div>
    <div class="list-controls">
        <label for="sort-by">Сортировать по:</label>
        <select id="sort-by">
            <option value="sort_order_asc">Вручную (Перетаскивание)</option>
            <option value="added_desc">По дате добавления (Новые сначала)</option>
            <option value="added_asc">По дате добавления (Старые сначала)</option>
            <option value="title_asc">По названию (А-Я)</option>
            <option value="title_desc">По названию (Я-А)</option>
            <option value="rating_desc">По рейтингу (Сначала выше)</option>
        </select>
    </div>

    <div class="album-list-container">
    </div>
</div>

<script src="/js/lists1.js"></script>

</body>
</html>
