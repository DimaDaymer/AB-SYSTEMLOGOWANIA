<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filter Sidebar</title>
    <style>
        .filter-section {
            margin-bottom: 20px;
        }
        .filter-options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }
        .filter-option-button {
            padding: 6px 10px;
            background: #333;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }
        .filter-option-button:hover {
            background: #444;
        }
        .filter-option-button.active {
            background: #555;
            font-weight: bold;
        }
        .subgenre-panel {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #222;
            border-radius: 4px;
        }
        .subgenre-toggle {
            color: #1a73e8;
            cursor: pointer;
            margin-top: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="filter-header">Add filters</div>
<div class="filter-dropdowns">
    <select class="filter-dropdown" id="sort-by-dropdown">
        <option value="rating">Top</option>
        <option value="popularity">Popularity</option>
        <option value="release_date">Release Date</option>
    </select>
    <select class="filter-dropdown" id="order-dropdown">
        <option value="desc">Descending</option>
        <option value="asc">Ascending</option>
    </select>
</div>

<div class="filter-search-container">
    <input type="text" class="filter-search-input" placeholder="Search filters..." id="filter-search-input">
    <span class="filter-search-icon">🔍</span>
</div>

<div class="filter-section">
    <h3>Format</h3>
    <div class="filter-options-grid" id="format-filter-options">
        <div class="filter-option-button" data-filter-type="format" data-filter-value="LP">LP</div>
        <div class="filter-option-button" data-filter-type="format" data-filter-value="EP">EP</div>
        <div class="filter-option-button" data-filter-type="format" data-filter-value="mixtape">Mixtape</div>
        <div class="filter-option-button" data-filter-type="format" data-filter-value="DJ Mix">DJ Mix</div>
        <div class="filter-option-button" data-filter-type="format" data-filter-value="single">Single</div>
        <div class="filter-option-button" data-filter-type="format" data-filter-value="video">Video</div>
        <div class="filter-option-button" data-filter-type="format" data-filter-value="compilation">Compilation</div>
    </div>
</div>

<div class="filter-section">
    <h3>Genres</h3>
    <div class="filter-options-grid" id="genres-filter-options">
        <!-- Основные жанры -->
        <div class="filter-option-button" data-filter-type="genre" data-filter-value="Rock">Rock</div>
        <div class="filter-option-button" data-filter-type="genre" data-filter-value="Electronic">Electronic</div>
        <div class="filter-option-button" data-filter-type="genre" data-filter-value="Hip Hop">Hip Hop</div>
        <div class="filter-option-button" data-filter-type="genre" data-filter-value="Jazz">Jazz</div>
        <div class="filter-option-button" data-filter-type="genre" data-filter-value="Classical">Classical</div>
        <div class="filter-option-button" data-filter-type="genre" data-filter-value="Pop">Pop</div>
        <div class="filter-option-button" data-filter-type="genre" data-filter-value="Metal">Metal</div>
        <div class="filter-option-button" data-filter-type="genre" data-filter-value="Folk">Folk</div>

        <!-- Кнопка для поджанров -->
        <div class="subgenre-toggle" id="show-subgenres">Show all genres (2528) ▶</div>
        <div class="subgenre-panel" id="subgenre-panel">
            <div class="subgenre-categories">
                <div class="subgenre-category">
                    <h4 id="descriptors-count">Descriptors (223)</h4>
                    <div class="filter-options-grid" id="descriptors-options"></div>
                </div>
                <div class="subgenre-category">
                    <h4 id="locations-count">Locations (257)</h4>
                    <div class="filter-options-grid" id="locations-options"></div>
                </div>
                <div class="subgenre-category">
                    <h4 id="languages-count">Languages (286)</h4>
                    <div class="filter-options-grid" id="languages-options"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="filter-section">
    <h3>Timeframe</h3>
    <div class="year-filter-options">
        <div>
            <input type="radio" id="time-all-time" name="timeframe" value="all-time" checked>
            <label for="time-all-time">All-time</label>
        </div>
        <div>
            <input type="radio" id="time-specific-year" name="timeframe" value="specific-year">
            <label for="time-specific-year">Specific year</label>
            <input type="number" id="specific-year-input" placeholder="Ex: 1982">
        </div>
        <div>
            <input type="radio" id="time-year-range" name="timeframe" value="year-range">
            <label for="time-year-range">Year range</label>
            <input type="text" id="year-range-input" placeholder="Ex: 1970-2000">
        </div>
        <div>
            <input type="radio" id="time-decade" name="timeframe" value="decade">
            <label for="time-decade">Decade</label>
            <select id="decade-select">
                <option value="">Select decade</option>
                <option value="1950s">1950s</option>
                <option value="1960s">1960s</option>
                <option value="1970s">1970s</option>
                <option value="1980s">1980s</option>
                <option value="1990s">1990s</option>
                <option value="2000s">2000s</option>
                <option value="2010s">2010s</option>
                <option value="2020s">2020s</option>
            </select>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Инициализация фильтров
        initFilters();

        // Обработчик для поджанров
        document.getElementById('show-subgenres').addEventListener('click', function() {
            const panel = document.getElementById('subgenre-panel');
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
                this.textContent = 'Show all genres (2528) ▶';
            } else {
                panel.style.display = 'block';
                this.textContent = 'Hide genres ▼';
                if (!panel.dataset.loaded) {
                    loadSubgenres();
                    panel.dataset.loaded = true;
                }
            }
        });
    });

    function initFilters() {
        const sortByDropdown = document.getElementById('sort-by-dropdown');
        const orderDropdown = document.getElementById('order-dropdown');
        const formatFilterOptions = document.getElementById('format-filter-options');
        const genresFilterOptions = document.getElementById('genres-filter-options');
        const yearFilterRadios = document.querySelectorAll('input[name="timeframe"]');
        const specificYearInput = document.getElementById('specific-year-input');
        const yearRangeInput = document.getElementById('year-range-input');
        const decadeSelect = document.getElementById('decade-select');

        let currentFilters = {
            sort: sortByDropdown.value,
            order: orderDropdown.value,
            format: [],
            genres: [],
            subgenres: [],
            year: null,
            yearRange: null,
            decade: null,
            timeframe: document.querySelector('input[name="timeframe"]:checked').value,
        };

        // Применение фильтров
        async function applyFilters() {
            const queryParams = new URLSearchParams();

            // Добавляем параметры в URL
            queryParams.append('sort', currentFilters.sort);
            queryParams.append('order', currentFilters.order);

            if (currentFilters.format.length > 0) {
                queryParams.append('format', currentFilters.format.join(','));
            }

            if (currentFilters.genres.length > 0) {
                queryParams.append('genres', currentFilters.genres.join(','));
            }

            if (currentFilters.subgenres.length > 0) {
                queryParams.append('subgenres', currentFilters.subgenres.join(','));
            }

            if (currentFilters.timeframe === 'specific-year' && currentFilters.year) {
                queryParams.append('year', currentFilters.year);
            } else if (currentFilters.timeframe === 'year-range' && currentFilters.yearRange) {
                queryParams.append('yearRange', currentFilters.yearRange);
            } else if (currentFilters.timeframe === 'decade' && currentFilters.decade) {
                queryParams.append('decade', currentFilters.decade);
            }

            // Обновляем URL без перезагрузки страницы
            window.history.pushState(null, null, `?${queryParams.toString()}`);

            // Загружаем альбомы с новыми фильтрами
            await fetchAlbums(queryParams);
        }

        // Загрузка альбомов с сервера
        async function fetchAlbums(params) {
            try {
                const response = await fetch(`/api/albums?${params}`);
                if (!response.ok) throw new Error('Failed to fetch albums');
                const albums = await response.json();
                displayAlbums(albums);
            } catch (error) {
                console.error('Error fetching albums:', error);
            }
        }

        // Отображение альбомов
        function displayAlbums(albums) {
            const container = document.getElementById('albums-container');
            if (!container) return;

            container.innerHTML = '';

            if (albums.length === 0) {
                container.innerHTML = '<p>No albums found matching your criteria.</p>';
                return;
            }

            albums.forEach(album => {
                const albumElement = document.createElement('div');
                albumElement.className = 'album-card';
                albumElement.innerHTML = `
                    <a href="/album/${album.slug}">
                        <img src="${album.cover_url || '/placeholder.png'}" alt="${album.title}">
                        <div class="album-info">
                            <h3>${album.title}</h3>
                            <p>${album.artist}</p>
                            <div class="album-meta">
                                <span>${album.release_date || 'Unknown year'}</span>
                                <span>${album.genres || ''}</span>
                            </div>
                            <div class="album-rating">
                                ${getStarRating(album.average_rating || 0)}
                                <span>${album.likes || 0} likes</span>
                            </div>
                        </div>
                    </a>
                `;
                container.appendChild(albumElement);
            });
        }

        // Вспомогательная функция для отображения рейтинга звездами
        function getStarRating(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            const emptyStars = 5 - fullStars - (hasHalfStar ? 1 : 0);

            return '★'.repeat(fullStars) +
                (hasHalfStar ? '½' : '') +
                '☆'.repeat(emptyStars);
        }

        // Загрузка поджанров
        async function loadSubgenres() {
            try {
                const [descriptors, locations, languages] = await Promise.all([
                    fetch('/api/genres/descriptors').then(res => res.json()),
                    fetch('/api/genres/locations').then(res => res.json()),
                    fetch('/api/genres/languages').then(res => res.json())
                ]);

                populateSubgenres('descriptors-options', descriptors);
                populateSubgenres('locations-options', locations);
                populateSubgenres('languages-options', languages);
            } catch (error) {
                console.error('Error loading subgenres:', error);
            }
        }

        function populateSubgenres(containerId, items) {
            const container = document.getElementById(containerId);
            if (!container) return;

            container.innerHTML = '';

            items.forEach(item => {
                const button = document.createElement('div');
                button.className = 'filter-option-button';
                button.dataset.filterType = 'subgenre';
                button.dataset.filterValue = item.name;
                button.textContent = item.name;
                button.addEventListener('click', toggleSubgenreFilter);
                container.appendChild(button);
            });
        }

        // Обработчики событий для фильтров
        function toggleSubgenreFilter(e) {
            const button = e.target;
            const value = button.dataset.filterValue;

            if (currentFilters.subgenres.includes(value)) {
                currentFilters.subgenres = currentFilters.subgenres.filter(g => g !== value);
                button.classList.remove('active');
            } else {
                currentFilters.subgenres.push(value);
                button.classList.add('active');
            }

            applyFilters();
        }

        // Остальные обработчики событий...
        sortByDropdown.addEventListener('change', (e) => {
            currentFilters.sort = e.target.value;
            applyFilters();
        });

        orderDropdown.addEventListener('change', (e) => {
            currentFilters.order = e.target.value;
            applyFilters();
        });

        formatFilterOptions.addEventListener('click', (e) => {
            const button = e.target.closest('.filter-option-button');
            if (button) {
                const value = button.dataset.filterValue;
                if (currentFilters.format.includes(value)) {
                    currentFilters.format = currentFilters.format.filter(f => f !== value);
                    button.classList.remove('active');
                } else {
                    currentFilters.format.push(value);
                    button.classList.add('active');
                }
                applyFilters();
            }
        });

        genresFilterOptions.addEventListener('click', (e) => {
            const button = e.target.closest('.filter-option-button');
            if (button && button.dataset.filterType === 'genre') {
                const value = button.dataset.filterValue;
                if (currentFilters.genres.includes(value)) {
                    currentFilters.genres = currentFilters.genres.filter(g => g !== value);
                    button.classList.remove('active');
                } else {
                    currentFilters.genres.push(value);
                    button.classList.add('active');
                }
                applyFilters();
            }
        });

        yearFilterRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentFilters.timeframe = e.target.value;
                if (e.target.value !== 'specific-year') specificYearInput.value = '';
                if (e.target.value !== 'year-range') yearRangeInput.value = '';
                if (e.target.value !== 'decade') decadeSelect.value = '';
                currentFilters.year = null;
                currentFilters.yearRange = null;
                currentFilters.decade = null;
                applyFilters();
            });
        });

        specificYearInput.addEventListener('input', (e) => {
            if (e.target.value) {
                document.getElementById('time-specific-year').checked = true;
                currentFilters.timeframe = 'specific-year';
                currentFilters.year = e.target.value;
                currentFilters.yearRange = null;
                currentFilters.decade = null;
                applyFilters();
            }
        });

        yearRangeInput.addEventListener('input', (e) => {
            if (e.target.value) {
                document.getElementById('time-year-range').checked = true;
                currentFilters.timeframe = 'year-range';
                currentFilters.yearRange = e.target.value;
                currentFilters.year = null;
                currentFilters.decade = null;
                applyFilters();
            }
        });

        decadeSelect.addEventListener('change', (e) => {
            if (e.target.value) {
                document.getElementById('time-decade').checked = true;
                currentFilters.timeframe = 'decade';
                currentFilters.decade = e.target.value;
                currentFilters.year = null;
                currentFilters.yearRange = null;
                applyFilters();
            }
        });

        // Загрузка начальных фильтров из URL
        function loadInitialFilters() {
            const params = new URLSearchParams(window.location.search);

            if (params.has('sort')) currentFilters.sort = params.get('sort');
            if (params.has('order')) currentFilters.order = params.get('order');

            if (params.has('format')) {
                currentFilters.format = params.get('format').split(',');
                currentFilters.format.forEach(format => {
                    const button = document.querySelector(`.filter-option-button[data-filter-value="${format}"]`);
                    if (button) button.classList.add('active');
                });
            }

            if (params.has('genres')) {
                currentFilters.genres = params.get('genres').split(',');
                currentFilters.genres.forEach(genre => {
                    const button = document.querySelector(`.filter-option-button[data-filter-value="${genre}"]`);
                    if (button) button.classList.add('active');
                });
            }

            if (params.has('subgenres')) {
                currentFilters.subgenres = params.get('subgenres').split(',');
                // Поджанры будут отмечены при загрузке
            }

            if (params.has('year')) {
                document.getElementById('time-specific-year').checked = true;
                currentFilters.timeframe = 'specific-year';
                currentFilters.year = params.get('year');
                specificYearInput.value = params.get('year');
            }

            if (params.has('yearRange')) {
                document.getElementById('time-year-range').checked = true;
                currentFilters.timeframe = 'year-range';
                currentFilters.yearRange = params.get('yearRange');
                yearRangeInput.value = params.get('yearRange');
            }

            if (params.has('decade')) {
                document.getElementById('time-decade').checked = true;
                currentFilters.timeframe = 'decade';
                currentFilters.decade = params.get('decade');
                decadeSelect.value = params.get('decade');
            }

            // Применяем начальные фильтры
            applyFilters();
        }

        loadInitialFilters();
    }
</script>
</body>
</html>
