<div class="filter-sidebar">
    <div class="filter-header">Add filters</div>
    <div class="filter-dropdowns">
        <select class="filter-dropdown" id="sort-by">
            <option value="release_date">- Default (Date) -</option>
            <option value="rating">Top Score</option>
            <option value="popularity">Popularity</option>
            <option value="title">Title</option>
            <option value="artist">Artist</option>
        </select>
        <select class="filter-dropdown" id="sort-order">
            <option value="desc">Descending</option>
            <option value="asc">Ascending</option>
        </select>
    </div>

    <div class="filter-search-container">
        <input type="text" class="filter-search-input" placeholder="Examples of filters" id="filter-search-input">
        <span class="filter-search-icon">🔍</span>
    </div>

    <div class="filter-section">
        <h3>Format</h3> <div class="filter-options-grid" id="format-options-container">
        <span style="color: #666; font-size: 0.9em;">Loading...</span>
    </div>
    </div>

    <div class="filter-section">
        <h3>Attributes</h3> <div class="filter-options-grid" id="attribute-options-container">
        <span style="color: #666; font-size: 0.9em;">Loading...</span>
    </div>
    </div>

    <div class="filter-section">
        <h3>Genres</h3>
        <p class="metadata"><span id="genres-count">...</span> genres</p>
        <a href="#" id="browse-genres-button" class="filter-link-button">Browse genres ▶</a>
    </div>

    <div class="filter-section">
        <h3>Descriptors</h3>
        <p class="metadata"><span id="description-count">...</span> description</p>
        <a href="#" id="browse-description-button" class="filter-link-button">Browse description ▶</a>
    </div>

    <div class="filter-section">
        <h3>Languages</h3>
        <p class="metadata"><span id="language-count">...</span> language</p>
        <a href="#" id="browse-language-button" class="filter-link-button">Browse language ▶</a>
    </div>

    <div class="filter-section">
        <h3>Locations</h3>
        <p class="metadata">257 locations</p>
        <a href="#" class="filter-link-button">Browse locations ▶</a>
    </div>

    <div class="filter-section">
        <h3>Timeframe</h3>
        <div class="year-filter-options">
            <label><input type="radio" id="time-all-time" name="timeframe" value="all-time" checked> All-time</label>
            <label><input type="radio" id="time-specific-year" name="timeframe" value="specific-year"> Specific year/decade</label>
            <input type="text" id="specific-year-input" placeholder="Ex: 1982, 2010s" class="year-input">
            <label><input type="radio" id="time-year-range" name="timeframe" value="year-range"> Year range</label>
            <input type="text" id="year-range-input" placeholder="Ex: 1970-2000" class="year-input">
        </div>
    </div>
</div>

<script>
    function updateUrl() {
        const params = new URLSearchParams();

        // Sorting & Search
        const sortBy = document.getElementById('sort-by').value;
        if (sortBy && sortBy !== 'release_date') params.set('sort', sortBy); // Если дефолт, то не отправляем
        const sortOrder = document.getElementById('sort-order').value;
        if (sortOrder && sortOrder !== 'desc') params.set('order', sortOrder); // Если дефолт, то не отправляем
        const searchInput = document.getElementById('filter-search-input').value;
        if (searchInput) params.set('search', searchInput);

        // === ОБНОВЛЕНО: Сбор данных с ДВУХ контейнеров ===
        // Форматы
        const selectedFormats = Array.from(document.querySelectorAll('#format-options-container .filter-option-button.active'))
            .map(btn => btn.dataset.filterValue);

        // Атрибуты (Теперь отдельный параметр)
        const selectedAttrs = Array.from(document.querySelectorAll('#attribute-options-container .filter-option-button.active'))
            .map(btn => btn.dataset.filterValue);

        if (selectedFormats.length > 0) params.set('format', selectedFormats.join(','));
        if (selectedAttrs.length > 0) params.set('attributes', selectedAttrs.join(',')); // <-- НОВЫЙ ПАРАМЕТР

        // Genres, Desc, Lang
        if (window.selectedGenresArray && window.selectedGenresArray.length > 0) params.set('genres', window.selectedGenresArray.join(','));
        if (window.selectedDescriptionArray && window.selectedDescriptionArray.length > 0) params.set('description', window.selectedDescriptionArray.join(','));
        if (window.selectedLanguageArray && window.selectedLanguageArray.length > 0) params.set('language', window.selectedLanguageArray.join(','));

        // Years logic (без изменений)
        const activeYearButton = document.querySelector('#year-grid .filter-option-button.active');
        const timeframeRadio = document.querySelector('input[name="timeframe"]:checked');
        const timeframe = timeframeRadio ? timeframeRadio.value : 'all-time';

        if (activeYearButton) {
            if (activeYearButton.dataset.year) params.set('year', activeYearButton.dataset.year);
            else if (activeYearButton.dataset.yearRange) params.set('yearRange', activeYearButton.dataset.yearRange);
        } else {
            if (timeframe === 'specific-year') {
                const val = document.getElementById('specific-year-input').value;
                if (val) val.endsWith('s') ? params.set('yearRange', val) : params.set('year', val);
            } else if (timeframe === 'year-range') {
                const val = document.getElementById('year-range-input').value;
                if (val) params.set('yearRange', val);
            }
        }

        history.pushState(null, '', `/new_releases.html?${params.toString()}`);
        if (window.applyFilters) window.applyFilters();
    }

    // === ФУНКЦИИ ЗАГРУЗКИ И ИНИЦИАЛИЗАЦИИ ===
    async function loadFormatsAndAttributes() {
        const formatContainer = document.getElementById('format-options-container');
        const attrContainer = document.getElementById('attribute-options-container');

        try {
            // Примечание: предполагаем, что этот API возвращает два списка
            const response = await fetch('/api/filters/formats');
            if (response.ok) {
                const data = await response.json(); // Ожидаемый формат: { formats: [...], attributes: [...] }

                // Рендер Форматов
                formatContainer.innerHTML = '';
                data.formats.forEach(item => createButton(item, formatContainer));

                // Рендер Атрибутов
                attrContainer.innerHTML = '';
                data.attributes.forEach(item => createButton(item, attrContainer));

            } else {
                formatContainer.innerHTML = 'Error';
                attrContainer.innerHTML = 'Error';
            }
        } catch (e) {
            console.error(e);
        }
    }

    function createButton(text, container) {
        const btn = document.createElement('div');
        btn.className = 'filter-option-button';
        btn.dataset.filterValue = text;
        btn.textContent = text;
        btn.addEventListener('click', function() {
            this.classList.toggle('active');
            updateUrl();
        });
        container.appendChild(btn);
    }

    // ... helper functions (без изменений) ...
    async function fetchGenreCount() { try { const r = await fetch('/api/filters/genres-count'); if(r.ok) document.getElementById('genres-count').textContent = (await r.json()).count.toLocaleString(); } catch(e){} }
    async function fetchDescriptionCount() { try { const r = await fetch('/api/filters/description-count'); if(r.ok) document.getElementById('description-count').textContent = (await r.json()).count.toLocaleString(); } catch(e){} }
    async function fetchLanguageCount() { try { const r = await fetch('/api/filters/language-count'); if(r.ok) document.getElementById('language-count').textContent = (await r.json()).count.toLocaleString(); } catch(e){} }

    function loadDynamicContent(url, cid) {
        const c = document.getElementById(cid); if(!c) return;
        fetch(url).then(r=>r.text()).then(h=>{
            c.innerHTML=h;
            c.querySelectorAll('script').forEach(s=>{
                const n=document.createElement('script');
                if(s.src)n.src=s.src; else n.textContent=s.textContent;
                document.body.appendChild(n); s.remove();
            });
        });
    }

    function loadGenresList() { loadDynamicContent('/genres_list.html', 'filter-sidebar-container'); }
    function loadDescriptionList() { loadDynamicContent('/description_list.html', 'filter-sidebar-container'); }
    function loadLanguageList() { loadDynamicContent('/language_list.html', 'filter-sidebar-container'); }

    async function initFilters() {
        const params = new URLSearchParams(window.location.search);

        await loadFormatsAndAttributes();

        // Восстановление состояния кнопок
        const formatParam = params.get('format') || '';
        const attributesParam = params.get('attributes') || ''; // <-- НОВЫЙ ПАРАМЕТР

        // Объединяем параметры для подсветки
        const selectedVals = [...formatParam.split(',').map(v => v.trim()), ...attributesParam.split(',').map(v => v.trim())].filter(v => v.length > 0);

        document.querySelectorAll('.filter-option-button').forEach(btn => {
            if (selectedVals.includes(btn.dataset.filterValue)) {
                btn.classList.add('active');
            }
        });

        // Остальная инициализация (sort, search, time)
        document.getElementById('sort-by').value = params.get('sort') || 'release_date';
        document.getElementById('sort-order').value = params.get('order') || 'desc';
        if(document.getElementById('filter-search-input')) document.getElementById('filter-search-input').value = params.get('search') || '';

        // Time init code (без изменений) ...
        const year = params.get('year');
        const yearRange = params.get('yearRange');
        if (year) {
            document.getElementById('time-specific-year').checked = true;
            document.getElementById('specific-year-input').value = year;
        } else if (yearRange) {
            if (yearRange.endsWith('s')) { document.getElementById('time-specific-year').checked = true; document.getElementById('specific-year-input').value = yearRange; }
            else { document.getElementById('time-year-range').checked = true; document.getElementById('year-range-input').value = yearRange; }
        } else {
            document.getElementById('time-all-time').checked = true;
        }

        // Event Listeners
        document.querySelectorAll('.filter-dropdown').forEach(d => d.addEventListener('change', updateUrl));
        const sInput = document.getElementById('filter-search-input');
        if(sInput) sInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') updateUrl(); });
        document.querySelectorAll('input[name="timeframe"]').forEach(r => r.addEventListener('change', updateUrl));

        const yInput = document.getElementById('specific-year-input');
        if(yInput) yInput.addEventListener('keypress', (e)=>{if(e.key==='Enter'){document.getElementById('time-specific-year').checked=true; updateUrl();}});
        const yrInput = document.getElementById('year-range-input');
        if(yrInput) yrInput.addEventListener('keypress', (e)=>{if(e.key==='Enter'){document.getElementById('time-year-range').checked=true; updateUrl();}});

        const gb = document.getElementById('browse-genres-button'); if(gb) gb.addEventListener('click', (e)=>{e.preventDefault(); loadGenresList();});
        const db = document.getElementById('browse-description-button'); if(db) db.addEventListener('click', (e)=>{e.preventDefault(); loadDescriptionList();});
        const lb = document.getElementById('browse-language-button'); if(lb) lb.addEventListener('click', (e)=>{e.preventDefault(); loadLanguageList();});

        fetchGenreCount(); fetchDescriptionCount(); fetchLanguageCount();
    }

    document.addEventListener('DOMContentLoaded', initFilters);
</script>
