<div class="filter-sidebar" id="filter-sidebar-main-content">
    <div class="filter-header">Typ rankingu</div>
    <div class="filter-section entity-toggle-section">
        <div class="entity-type-toggle" id="entity-type-selector">
            <button type="button" class="toggle-btn" data-value="albums">Albumy</button>
            <button type="button" class="toggle-btn" data-value="tracks">Utwory</button>
            <button type="button" class="toggle-btn" data-value="artists">Artyści</button>
        </div>
    </div>

    <div class="filter-header compact-header">Dodaj filtry</div>
    <div class="filter-dropdowns">
        <select class="filter-dropdown" id="sort-by">
            <option value="release_date">- Domyślnie (Data) -</option>
            <option value="rating">Najwyższa ocena</option>
            <option value="popularity">Popularność</option>
            <option value="title">Tytuł</option>
        </select>
        <select class="filter-dropdown" id="sort-order">
            <option value="desc">Malejąco</option>
            <option value="asc">Rosnąco</option>
        </select>
    </div>

    <div class="filter-section" id="section-activity">
        <h3>Moja aktywność</h3>
        <div class="status-filter-options">
            <label><input type="radio" name="user_status" value="all" checked> Pokaż wszystko</label>
            <label><input type="radio" name="user_status" value="listened"> Tylko przesłuchane</label>
            <label><input type="radio" name="user_status" value="not_listened"> Wyklucz przesłuchane</label>
        </div>
        <div class="one-per-artist-wrap">
            <label style="display: flex; align-items: center; cursor: pointer;">
                <input type="checkbox" id="one-per-artist" style="margin-right: 8px;">
                Jeden na artystę <span class="sub-label">(Najwyżej oceniany)</span>
            </label>
        </div>
    </div>

    <div class="filter-search-container">
        <input type="text" class="filter-search-input" placeholder="Szukaj..." id="filter-search-input">
        <span class="filter-search-icon">🔍</span>
        <div id="autocomplete-results" class="autocomplete-results"></div>
    </div>

    <div class="filter-section" id="section-format">
        <h3>Format</h3>
        <div class="tags-container" id="format-options-container">
            <span style="color: #666; font-size: 0.9em;">Ładowanie...</span>
        </div>
    </div>

    <div class="filter-section" id="section-attributes">
        <h3>Atrybuty</h3>
        <div class="tags-container" id="attribute-options-container">
            <span style="color: #666; font-size: 0.9em;">Ładowanie...</span>
        </div>
    </div>

    <div class="filter-section compact-list">
        <h3>Gatunki <span id="genres-selected-text" class="sel-count"></span></h3>
        <p class="metadata"><span id="genres-count">...</span> dostępnych</p>
        <a href="#" id="browse-genres-button" class="filter-link-button">Przeglądaj gatunki ▶</a>
    </div>

    <div class="filter-section compact-list">
        <h3>Opisy <span id="description-selected-text" class="sel-count"></span></h3>
        <p class="metadata"><span id="description-count">...</span> dostępnych</p>
        <a href="#" id="browse-description-button" class="filter-link-button">Przeglądaj opisy ▶</a>
    </div>

    <div class="filter-section compact-list">
        <h3>Języki <span id="language-selected-text" class="sel-count"></span></h3>
        <p class="metadata"><span id="language-count">...</span> dostępnych</p>
        <a href="#" id="browse-language-button" class="filter-link-button">Przeglądaj języki ▶</a>
    </div>

    <div class="filter-section compact-list">
        <h3>Lokalizacja <span id="location-selected-text" class="sel-count"></span></h3>
        <p class="metadata"><span id="location-count">...</span> dostępnych</p>
        <a href="#" id="browse-location-button" class="filter-link-button">Przeglądaj lokalizacje ▶</a>
    </div>

    <div class="filter-section" id="section-timeframe">
        <h3>Ramy czasowe</h3>
        <div class="year-filter-options">
            <label><input type="radio" id="time-all-time" name="timeframe" value="all-time" checked> Cały czas</label>
            <div class="input-row">
                <label><input type="radio" id="time-specific-year" name="timeframe" value="specific-year"> Rok/Dekada</label>
                <input type="text" id="specific-year-input" placeholder="1982, 2010s" class="year-input">
            </div>
            <div class="input-row">
                <label><input type="radio" id="time-year-range" name="timeframe" value="year-range"> Zakres</label>
                <input type="text" id="year-range-input" placeholder="1970-2000" class="year-input">
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Конфигурация встроенных списков (вместо внешних файлов)
    const FILTER_LIST_CONFIGS = {
        genres: {
            title: 'Wszystkie gatunki',
            type: 'genre',
            inc: 'genres',
            exc: 'exclude_genres',
            api: '/api/filters/all-genres'
        },
        description: {
            title: 'Wszystkie opisy',
            type: 'description',
            inc: 'description',
            exc: 'exclude_description',
            api: '/api/filters/all-description'
        },
        language: {
            title: 'Wszystkie języki',
            type: 'language',
            inc: 'language',
            exc: 'exclude_language',
            api: '/api/filters/all-language'
        },
        location: {
            title: 'Wszystkie lokalizacje',
            type: 'location',
            inc: 'location',
            exc: 'exclude_location',
            api: '/api/filters/all-location'
        }
    };

    // Глобальное хранилище оригинального HTML сайдбара
    let originalSidebarHTML = '';

    window.selectedGenresArray = window.selectedGenresArray || [];
    window.excludedGenresArray = window.excludedGenresArray || [];
    window.selectedDescriptionArray = window.selectedDescriptionArray || [];
    window.excludedDescriptionArray = window.excludedDescriptionArray || [];
    window.selectedLanguageArray = window.selectedLanguageArray || [];
    window.excludedLanguageArray = window.excludedLanguageArray || [];
    window.selectedFormatArray = window.selectedFormatArray || [];
    window.excludedFormatArray = window.excludedFormatArray || [];
    window.selectedAttributeArray = window.selectedAttributeArray || [];
    window.excludedAttributeArray = window.excludedAttributeArray || [];
    window.selectedLocationArray = window.selectedLocationArray || [];
    window.excludedLocationArray = window.excludedLocationArray || [];

    function getSelectedEntityType() {
        const activeBtn = document.querySelector('.entity-type-toggle .toggle-btn.active');
        return activeBtn ? activeBtn.dataset.value : 'albums';
    }

    function toggleFiltersByEntityType() {
        const type = getSelectedEntityType();
        const sectionsToToggle = ['section-activity', 'section-format', 'section-attributes', 'section-timeframe'];
        sectionsToToggle.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = (type === 'artists') ? 'none' : 'block';
        });
    }

    function updateSelectedCountsUI() {
        const updateText = (inc, exc, elId) => {
            const el = document.getElementById(elId);
            if (!el) return;
            const count = (inc ? inc.length : 0) + (exc ? exc.length : 0);
            if (count > 0) {
                el.textContent = `(${count})`;
                el.style.display = 'inline';
            } else {
                el.style.display = 'none';
            }
        };
        updateText(window.selectedGenresArray, window.excludedGenresArray, 'genres-selected-text');
        updateText(window.selectedDescriptionArray, window.excludedDescriptionArray, 'description-selected-text');
        updateText(window.selectedLanguageArray, window.excludedLanguageArray, 'language-selected-text');
        updateText(window.selectedLocationArray, window.excludedLocationArray, 'location-selected-text');
    }
    window.updateSelectedCountsUI = updateSelectedCountsUI;

    window.updateUrl = function() {
        const params = new URLSearchParams(window.location.search);
        const type = getSelectedEntityType();
        params.set('type', type);

        const sortBy = document.getElementById('sort-by').value;
        if (sortBy && sortBy !== 'release_date') params.set('sort', sortBy); else params.delete('sort');
        const sortOrder = document.getElementById('sort-order').value;
        if (sortOrder && sortOrder !== 'desc') params.set('order', sortOrder); else params.delete('order');

        const searchInput = document.getElementById('filter-search-input');
        if (searchInput && searchInput.value) params.set('search', searchInput.value); else params.delete('search');

        if (type !== 'artists') {
            const userStatus = document.querySelector('input[name="user_status"]:checked').value;
            if (userStatus && userStatus !== 'all') params.set('status', userStatus); else params.delete('status');
            const onePerArtist = document.getElementById('one-per-artist').checked;
            if (onePerArtist) params.set('one_per_artist', 'true'); else params.delete('one_per_artist');

            const timeframeRadio = document.querySelector('input[name="timeframe"]:checked');
            const timeframe = timeframeRadio ? timeframeRadio.value : 'all-time';
            params.delete('year');
            params.delete('yearRange');

            if (timeframe === 'specific-year') {
                const val = document.getElementById('specific-year-input').value;
                if (val) val.endsWith('s') ? params.set('yearRange', val) : params.set('year', val);
            } else if (timeframe === 'year-range') {
                const val = document.getElementById('year-range-input').value;
                if (val) params.set('yearRange', val);
            }
        }

        const setArr = (key, arr) => { if(arr && arr.length) params.set(key, arr.join(',')); else params.delete(key); };
        if (type !== 'artists') {
            setArr('format', window.selectedFormatArray);
            setArr('exclude_format', window.excludedFormatArray);
            setArr('attributes', window.selectedAttributeArray);
            setArr('exclude_attributes', window.excludedAttributeArray);
        }

        setArr('genres', window.selectedGenresArray);
        setArr('exclude_genres', window.excludedGenresArray);
        setArr('description', window.selectedDescriptionArray);
        setArr('exclude_description', window.excludedDescriptionArray);
        setArr('language', window.selectedLanguageArray);
        setArr('exclude_language', window.excludedLanguageArray);
        setArr('location', window.selectedLocationArray);
        setArr('exclude_location', window.excludedLocationArray);

        window.history.pushState(null, '', `${window.location.pathname}?${params.toString()}`);
        if (window.applyFilters) window.applyFilters();
        updateSelectedCountsUI();
        toggleFiltersByEntityType();
    };

    async function loadFormatsAndAttributes() {
        const formatContainer = document.getElementById('format-options-container');
        const attrContainer = document.getElementById('attribute-options-container');
        if (!formatContainer || !attrContainer) return;
        try {
            const response = await fetch('/api/filters/formats');
            if (response.ok) {
                const data = await response.json();
                formatContainer.innerHTML = ''; attrContainer.innerHTML = '';
                if(data.formats) data.formats.forEach(item => createTagElement(item, formatContainer, 'Format'));
                if(data.attributes) data.attributes.forEach(item => createTagElement(item, attrContainer, 'Attribute'));
            }
        } catch (e) { console.error(e); }
    }

    function createTagElement(item, container, filterType) {
        const selArr = `selected${filterType}Array`;
        const excArr = `excluded${filterType}Array`;
        const wrapper = document.createElement('div');
        wrapper.className = 'tag-item-wrapper';
        wrapper.innerHTML = `<div class="tag-name-label">${item}</div><div class="tag-controls"><div class="control-area control-include" data-action="include">✔</div><div class="control-area control-exclude" data-action="exclude">✖</div></div>`;
        const checkState = () => {
            wrapper.classList.remove('included', 'excluded');
            if (window[selArr].includes(item)) wrapper.classList.add('included');
            else if (window[excArr].includes(item)) wrapper.classList.add('excluded');
        };
        checkState();
        wrapper.addEventListener('click', (e) => {
            const target = e.target.closest('.control-area');
            if (!target) return;
            const action = target.dataset.action;
            window[selArr] = window[selArr].filter(i => i !== item);
            window[excArr] = window[excArr].filter(i => i !== item);
            if (action === 'include' && !wrapper.classList.contains('included')) window[selArr].push(item);
            else if (action === 'exclude' && !wrapper.classList.contains('excluded')) window[excArr].push(item);
            checkState(); window.updateUrl();
        });
        container.appendChild(wrapper);
    }

    // 2. Функция для динамической отрисовки списка вместо загрузки внешнего файла
    function showFullFilterList(configKey) {
        const config = FILTER_LIST_CONFIGS[configKey];
        const container = document.getElementById('filter-sidebar-container');

        // Сохраняем текущее состояние сайдбара, чтобы вернуться назад
        if (!originalSidebarHTML) originalSidebarHTML = container.innerHTML;

        const gridId = `${configKey}-list-grid`;

        container.innerHTML = `
            <div id="${configKey}-list-content">
                <h3>${config.title}</h3>
                <a href="#" id="back-to-filters-btn" style="display: block; margin-bottom: 15px; color: #00ffcc; cursor: pointer;">← Powrót do filtrów</a>
                <div class="tags-container" id="${gridId}">
                    <p>Ładowanie...</p>
                </div>
            </div>
        `;

        // Слушатель для кнопки возврата
        document.getElementById('back-to-filters-btn').addEventListener('click', (e) => {
            e.preventDefault();
            container.innerHTML = originalSidebarHTML;
            originalSidebarHTML = ''; // Сбрасываем кэш
            window.initFilters(); // Переинициализируем основной сайдбар
        });

        // Инициализация логики списка (предполагается, что window.initFilterList определена глобально)
        if (window.initFilterList) {
            window.initFilterList(config.type, config.inc, config.exc, config.api, gridId);
        }
    }

    function setupNavButtons() {
        const buttons = [
            ['browse-genres-button', 'genres'],
            ['browse-description-button', 'description'],
            ['browse-language-button', 'language'],
            ['browse-location-button', 'location']
        ];

        buttons.forEach(([btnId, configKey]) => {
            const el = document.getElementById(btnId);
            if(el) el.addEventListener('click', (e) => {
                e.preventDefault();
                showFullFilterList(configKey);
            });
        });
    }

    async function fetchCounts() {
        const getCount = async (url, id) => {
            try {
                const r = await fetch(url);
                if(r.ok) {
                    const d = await r.json();
                    const el = document.getElementById(id);
                    if(el) el.textContent = d.count.toLocaleString();
                }
            } catch(e){}
        };
        await getCount('/api/filters/genres-count', 'genres-count');
        await getCount('/api/filters/description-count', 'description-count');
        await getCount('/api/filters/language-count', 'language-count');
        await getCount('/api/filters/location-count', 'location-count');
    }

    window.initFilters = async function() {
        const params = new URLSearchParams(window.location.search);
        const parse = (k) => (params.get(k) || '').split(',').filter(x=>x);

        window.selectedGenresArray = parse('genres');
        window.excludedGenresArray = parse('exclude_genres');
        window.selectedDescriptionArray = parse('description');
        window.excludedDescriptionArray = parse('exclude_description');
        window.selectedLanguageArray = parse('language');
        window.excludedLanguageArray = parse('exclude_language');
        window.selectedLocationArray = parse('location');
        window.excludedLocationArray = parse('exclude_location');
        window.selectedFormatArray = parse('format');
        window.excludedFormatArray = parse('exclude_format');
        window.selectedAttributeArray = parse('attributes');
        window.excludedAttributeArray = parse('exclude_attributes');

        updateSelectedCountsUI();
        await loadFormatsAndAttributes();
        await fetchCounts();
        setupNavButtons();

        const sortByEl = document.getElementById('sort-by');
        if(sortByEl) sortByEl.value = params.get('sort') || 'release_date';

        const sortOrderEl = document.getElementById('sort-order');
        if(sortOrderEl) sortOrderEl.value = params.get('order') || 'desc';

        const searchInput = document.getElementById('filter-search-input');
        if(searchInput && params.get('search')) searchInput.value = params.get('search');

        const initialType = params.get('type') || 'albums';
        document.querySelectorAll('.entity-type-toggle .toggle-btn').forEach(btn => {
            if(btn.dataset.value === initialType) btn.classList.add('active');
            btn.addEventListener('click', () => {
                document.querySelectorAll('.entity-type-toggle .toggle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                window.updateUrl();
            });
        });

        toggleFiltersByEntityType();

        const status = params.get('status');
        if(status) { const r = document.querySelector(`input[name="user_status"][value="${status}"]`); if(r) r.checked = true; }
        const onePerArtistEl = document.getElementById('one-per-artist');
        if(onePerArtistEl && params.get('one_per_artist')==='true') onePerArtistEl.checked = true;

        const yr = params.get('yearRange'), y = params.get('year');
        if(yr) {
            if(yr.endsWith('s')) {
                if(document.getElementById('time-specific-year')) document.getElementById('time-specific-year').checked=true;
                if(document.getElementById('specific-year-input')) document.getElementById('specific-year-input').value=yr;
            }
            else {
                if(document.getElementById('time-year-range')) document.getElementById('time-year-range').checked=true;
                if(document.getElementById('year-range-input')) document.getElementById('year-range-input').value=yr;
            }
        } else if(y) {
            if(document.getElementById('time-specific-year')) document.getElementById('time-specific-year').checked=true;
            if(document.getElementById('specific-year-input')) document.getElementById('specific-year-input').value=y;
        }

        document.querySelectorAll('.filter-dropdown').forEach(d => d.addEventListener('change', window.updateUrl));
        document.querySelectorAll('input[name="user_status"], input[name="timeframe"], #one-per-artist').forEach(el => el.addEventListener('change', window.updateUrl));

        ['filter-search-input', 'specific-year-input', 'year-range-input'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.addEventListener('keypress', (e)=>{
                if(e.key==='Enter') {
                    const timeframeId = id.includes('year') ? id.replace('-input','').replace('specific','time-specific').replace('year-range','time-year-range') : null;
                    if(timeframeId && document.getElementById(timeframeId)) document.getElementById(timeframeId).checked=true;
                    window.updateUrl();
                }
            });
        });
    };

    if(document.readyState !== 'loading') window.initFilters();
    else document.addEventListener('DOMContentLoaded', window.initFilters);
</script>
