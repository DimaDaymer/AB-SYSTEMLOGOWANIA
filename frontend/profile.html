<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil użytkownika | Platforma Muzyczna</title>
    <link rel="stylesheet" href="/css/profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/comments.css">
</head>
<body>
<div id="dynamic-background"></div>
<div id="navbar-container"></div>

<div class="container">
    <aside class="left-panel">
        <div id="user-info-component">
            <div class="loading-placeholder">Ładowanie profilu...</div>
        </div>
    </aside>

    <main class="tab-panel">
        <div id="tabs-component">
            <div class="loading-placeholder">Ładowanie zawartości...</div>
        </div>
        <div id="comment-box-component"></div>
    </main>

    <aside class="right-panel">
        <div id="right-panel-component"></div>

        <div class="side-card" id="soulmates-section" style="display: none;">
            <div id="similar-users-container" class="similar-grid-vertical"></div>
        </div>
    </aside>
</div>

<script src="/js/comments-core.js"></script>
<script src="/js/loadnavbar.js"></script>
<script src="/js/list-app-core.js"></script>
<script src="/js/list-app-modal.js"></script>
<script src="/js/similar-loader.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
