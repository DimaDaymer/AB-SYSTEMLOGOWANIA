<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>User Profile | MelodyRater</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
<div id="navbar-container"></div>
<div class="container">
    <div id="user-info-panel-container"></div>
    <div id="tabs-panel-container"></div>
    <div id="right-panel-container"></div>
</div>

<script src="js/profile.js"></script>

<script>
    // Use JavaScript to fetch and insert the modular HTML files
    async function includeHtml(containerId, filePath) {
        const container = document.getElementById(containerId);
        try {
            const res = await fetch(filePath);
            if (!res.ok) throw new Error(`Failed to load ${filePath}`);
            const html = await res.text();
            container.innerHTML = html;

            // Execute scripts within the loaded HTML
            const scripts = container.querySelectorAll('script');
            scripts.forEach(script => {
                const newScript = document.createElement('script');
                newScript.textContent = script.textContent;
                document.body.appendChild(newScript);
            });
        } catch (err) {
            console.error('Error loading component:', err);
            container.innerHTML = `<p style="color: #ff6b6b;">Error loading ${filePath}</p>`;
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        // Load the navbar first, as it's a common component
        fetch('/navbar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navbar-container').innerHTML = html;
                const navbarScripts = document.getElementById('navbar-container').querySelectorAll('script');
                navbarScripts.forEach(script => {
                    const newScript = document.createElement('script');
                    newScript.textContent = script.textContent;
                    document.body.appendChild(newScript);
                });
                if (typeof initNavbar === 'function') {
                    initNavbar();
                }
            })
            .catch(err => console.error('Failed to load navbar: ', err));

        // Load the other components
        await includeHtml('user-info-panel-container', 'user-info-panel.html');
        await includeHtml('tabs-panel-container', 'tabs-panel.html');
        await includeHtml('right-panel-container', 'right-panel.html');
    });
</script>
</body>
</html>
