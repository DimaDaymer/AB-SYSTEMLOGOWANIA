<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Album | MelodyRater</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <style>
        /* ВРЕМЕННЫЕ СТИЛИ ДЛЯ ВНЕШНЕГО ВИДА ФОРМЫ */
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-color: #1f1f1f;
            color: #f0f0f0;
            padding: 40px 20px;
        }
        .form-container {
            width: 100%;
            max-width: 600px;
        }
        .form-card {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #4CAF50;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-control, .form-select {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #333;
            color: #f0f0f0;
            box-sizing: border-box;
        }
        .form-control:focus, .form-select:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }
        .tracklist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        #tracklist-container > div {
            display: grid;
            grid-template-columns: 50px 1fr 100px 30px;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        #tracklist-container input {
            margin: 0;
        }
        .track-delete {
            cursor: pointer;
            color: #ff5555;
            font-weight: bold;
            text-align: center;
        }
        .button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 700;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
<div class="form-container">
    <div class="form-card">
        <h1>Add New Album</h1>
        <form id="addAlbumForm">
            <div class="form-group">
                <label for="title">Title*</label>
                <input type="text" id="title" name="title" class="form-control" required placeholder="Enter album title">
            </div>

            <div class="form-group">
                <label for="artist">Artist*</label>
                <input type="text" id="artist" name="artist" class="form-control" required placeholder="Enter artist names, separated by commas">
            </div>

            <div class="form-group">
                <label for="cover_url">Cover URL</label>
                <input type="text" id="cover_url" name="cover_url" class="form-control" placeholder="Image link">
            </div>

            <div class="form-group">
                <label for="release_date">Release Date</label>
                <input type="date" id="release_date" name="release_date" class="form-control">
            </div>

            <div class="form-group">
                <label for="type">Type</label>
                <select id="type" name="type" class="form-select">
                    <option value="Studio Album">Studio Album</option>
                    <option value="EP">EP</option>
                    <option value="Single">Single</option>
                    <option value="Live Album">Live Album</option>
                    <option value="Compilation">Compilation</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="genres">Genres</label>
                <input type="text" id="genres" name="genres" class="form-control" placeholder="Genre1, Genre2, ...">
            </div>

            <div class="form-group">
                <label for="label">Label</label>
                <input type="text" id="label" name="label" class="form-control" placeholder="Record Label">
            </div>

            <div class="form-group">
                <label for="language">Language</label>
                <input type="text" id="language" name="language" class="form-control" placeholder="English, Russian, ...">
            </div>

            <div class="form-group">
                <label for="description">Description (Keywords)</label>
                <textarea id="description" name="description" class="form-control" placeholder="Keywords (e.g., dark, humorous, lo-fi)"></textarea>
            </div>

            <div class="tracklist-header">
                <h2>Tracklist</h2>
                <button type="button" id="add-track-btn" class="button" style="width: auto; margin-top: 0; padding: 5px 15px;">+ Add Track</button>
            </div>

            <div id="tracklist-container">
            </div>

            <button type="submit" class="button">Add Album</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('addAlbumForm');
        const tracklistContainer = document.getElementById('tracklist-container');
        const addTrackBtn = document.getElementById('add-track-btn');
        let trackCounter = 1;

        function addTrack(number = trackCounter, title = '', duration = '') {
            const trackDiv = document.createElement('div');
            trackDiv.classList.add('track-entry');
            trackDiv.dataset.trackNumber = number;

            trackDiv.innerHTML = `
                <input type="number" class="form-control track-number" value="${number}" min="1" required style="width: 100%;">
                <input type="text" class="form-control track-title" placeholder="Track Title" value="${title}" required>
                <input type="text" class="form-control track-duration" placeholder="00:00" value="${duration}">
                <span class="track-delete" title="Remove track">×</span>
            `;

            tracklistContainer.appendChild(trackDiv);

            trackDiv.querySelector('.track-delete').addEventListener('click', () => {
                trackDiv.remove();
                renumberTracks();
            });

            if (number === trackCounter) {
                trackCounter++;
            }

            trackDiv.querySelector('.track-number').addEventListener('change', renumberTracks);
        }

        function renumberTracks() {
            const tracks = Array.from(tracklistContainer.querySelectorAll('.track-entry'));
            let currentNumber = 1;
            // Сортируем по номеру, который ввел пользователь, затем присваиваем последовательные номера
            tracks.sort((a, b) => {
                return parseInt(a.querySelector('.track-number').value) - parseInt(b.querySelector('.track-number').value);
            }).forEach(trackDiv => {
                // ПЕРЕПРИСВАИВАЕМ ЗНАЧЕНИЕ:
                trackDiv.querySelector('.track-number').value = currentNumber;
                currentNumber++;
            });
            trackCounter = currentNumber;
        }

        addTrackBtn.addEventListener('click', () => addTrack());

        addTrack(1, 'Track 1', '3:00');


        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const title = formData.get('title');
            const artist = formData.get('artist');

            // === КЛИЕНТСКАЯ ВАЛИДАЦИЯ ===
            if (!title || title.trim() === '') {
                alert('Поле "Title" не может быть пустым.');
                return;
            }

            if (!artist || artist.trim() === '') {
                alert('Поле "Artist" не может быть пустым.');
                return;
            }
            // =============================

            // === ПРОВЕРКА АВТОРИЗАЦИИ ===
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Для добавления альбома необходимо авторизоваться.');
                window.location.href = '/login.html';
                return;
            }
            // =============================


            // Сбор данных о треках
            const trackEntries = Array.from(tracklistContainer.querySelectorAll('.track-entry'));
            const tracks = trackEntries.map(entry => ({
                // Отправляем номер, введенный пользователем. Сервер отсортирует по нему.
                number: parseInt(entry.querySelector('.track-number').value),
                title: entry.querySelector('.track-title').value,
                duration: entry.querySelector('.track-duration').value
            }));

            const albumData = {
                title: title,
                // Отправляем строку исполнителей, как и ожидается в albums.js
                artist: artist,
                cover_url: formData.get('cover_url'),
                release_date: formData.get('release_date'),
                type: formData.get('type'),
                genres: formData.get('genres'),
                label: formData.get('label'),
                language: formData.get('language'),
                description: formData.get('description'),
                tracks: tracks // Используем собранный массив треков
            };

            try {
                // Отправка с заголовком Authorization
                const response = await fetch('/api/albums', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(albumData)
                });

                if (response.ok) {
                    const data = await response.json();
                    alert('Альбом успешно добавлен!');
                    window.location.href = `/album.html?slug=${data.slug}`;
                } else if (response.status === 401) {
                    alert('Ошибка авторизации. Пожалуйста, войдите в систему.');
                    // Перенаправление на логин, если токен недействителен
                    window.location.href = '/login.html';
                } else {
                    const errorData = await response.json();
                    alert('Ошибка при добавлении альбома: ' + (errorData.error || errorData.message || 'Неизвестная ошибка'));
                }
            } catch (error) {
                console.error('Fetch error:', error);
                alert('Произошла ошибка при попытке добавить альбом.');
            }
        });
    });
</script>
</body>
</html>
