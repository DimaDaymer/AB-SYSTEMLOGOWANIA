<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Album | MelodyRater</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
<div class="form-container">
    <div class="form-card">
        <h1>Add New Album</h1>
        <form id="addAlbumForm">
            <div class="form-group">
                <label for="title">Title*</label>
                <input type="text" id="title" name="title" class="form-control" required placeholder="Enter album title">
            </div>

            <div class="form-group">
                <label for="artist">Artist*</label>
                <input type="text" id="artist" name="artist" class="form-control" required placeholder="Enter artist names, separated by commas">
            </div>

            <div class="form-group">
                <label for="cover_url">Cover URL</label>
                <input type="text" id="cover_url" name="cover_url" class="form-control" placeholder="Image link">
            </div>

            <div class="form-group">
                <label for="type">Type</label>
                <select id="type" name="type" class="form-control">
                    <option value="Albums">Albums</option>
                    <option value="EP">EP</option>
                    <option value="Mixtape">Mixtape</option>
                    <option value="DJ Mix">DJ Mix</option>
                    <option value="Single">Singles</option>
                    <option value="Video">Video</option>
                    <option value="Compilation">Compilations</option>
                    <option value="Unauthorized">Unauthorized</option>
                    <option value="Song">Songs</option>
                </select>
            </div>

            <div class="form-group">
                <label for="release_date">Release Date</label>
                <input type="date" id="release_date" name="release_date" class="form-control" placeholder="e.g., 2024-10-26 or 2024">
            </div>

            <div class="form-group">
                <label for="genre">Genre (comma separated)</label>
                <input type="text" id="genre" name="genre" class="form-control" placeholder="e.g., Indie Rock, Alternative Rock">
            </div>

            <div class="form-group">
                <label for="label">Label</label>
                <input type="text" id="label" name="label" class="form-control" placeholder="Enter labels, separated by commas">
            </div>

            <div class="form-group">
                <label for="language">Language</label>
                <input type="text" id="language" name="language" class="form-control" placeholder="Ee.g., English, Spanish, separated by commas">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" class="form-control" placeholder="Enter album description, separated by commas">
            </div>


            <h2>Tracks</h2>
            <div id="tracksContainer" class="form-group"></div>

            <button type="button" id="addTrackButton" class="btn add-item-btn">Add Track</button>

            <div style="margin-top: 30px;">
                <button type="submit" class="btn btn-block">Add Album</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const addAlbumForm = document.getElementById('addAlbumForm');
        const tracksContainer = document.getElementById('tracksContainer');
        const addTrackButton = document.getElementById('addTrackButton');
        let trackCount = 0;

        const addTrackInput = (trackNumber = '') => {
            trackCount++;
            const trackDiv = document.createElement('div');
            trackDiv.classList.add('track-item');
            trackDiv.innerHTML = `
            <input type="number" name="track_number" class="form-control track-number" placeholder="No." value="${trackNumber}" min="1" required>
            <input type="text" name="track_title" class="form-control track-title" placeholder="Track Title" required>
            <input type="text" name="track_duration" class="form-control track-duration" placeholder="Duration (e.g., 3:45)" pattern="\\d{1,2}:\\d{2}" title="Формат: M:SS или MM:SS">
            <button type="button" class="remove-track">✕</button>
        `;
            tracksContainer.appendChild(trackDiv);

            trackDiv.querySelector('.remove-track').addEventListener('click', () => {
                tracksContainer.removeChild(trackDiv);
            });
        };

        addTrackButton.addEventListener('click', () => addTrackInput(trackCount + 1));
        addTrackInput(1);
        addAlbumForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            if (!addAlbumForm.title.value || !addAlbumForm.artist.value) {
                alert('Название альбома и исполнитель обязательны для заполнения!');
                return;
            }

            const formData = new FormData(addAlbumForm);

            const trackNumbers = document.querySelectorAll('#tracksContainer input[name="track_number"]');
            const trackTitles = document.querySelectorAll('#tracksContainer input[name="track_title"]');
            const trackDurations = document.querySelectorAll('#tracksContainer input[name="track_duration"]');

            for (let i = 0; i < trackNumbers.length; i++) {
                const trackNumber = parseInt(trackNumbers[i].value);
                if (isNaN(trackNumber)) {
                    alert(`Неверный номер трека в позиции ${i + 1}!`);
                    return;
                }
            }

            // Проверка формата продолжительности
            const durationRegex = /^(?:[0-5]?\d(?::[0-5]?\d)?|60(?::00)?)$/;
            for (let i = 0; i < trackDurations.length; i++) {
                if (trackDurations[i].value && !durationRegex.test(trackDurations[i].value)) {
                    alert(`Неверный формат продолжительности в треке "${trackTitles[i].value}". Используйте формат M:SS или MM:SS.`);
                    return;
                }
            }

            // Client-side slug generation is now handled by the server with the slugify library.
            // const slug = `${formData.get('artist')}-${formData.get('title')}`
            //     .toLowerCase()
            //     .replace(/[^\w\s-]/g, '')
            //     .replace(/\s+/g, '-')
            //     .replace(/-+/g, '-');

            const albumData = {
                title: formData.get('title'),
                artist: formData.get('artist'),
                cover_url: formData.get('cover_url'),
                type: formData.get('type'),
                release_date: formData.get('release_date'),
                genres: formData.get('genre'),
                label: formData.get('label'),
                language: formData.get('language'),
                description: formData.get('description'),
                // REMOVED: slug: slug,
                tracks: []
            };

            for (let i = 0; i < trackTitles.length; i++) {
                albumData.tracks.push({
                    number: parseInt(trackNumbers[i].value),
                    title: trackTitles[i].value,
                    duration: trackDurations[i].value
                });
            }

            try {
                const response = await fetch('/api/albums', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(albumData)
                });

                if (response.ok) {
                    const data = await response.json();
                    alert('Альбом успешно добавлен!');
                    // Используем слаг, возвращенный сервером, для перенаправления
                    window.location.href = `/release/album/${data.slug}`;
                } else {
                    const errorData = await response.json();
                    alert('Ошибка при добавлении альбома: ' + errorData.error);
                }
            } catch (error) {
                console.error('Fetch error:', error);
                alert('Произошла ошибка при попытке добавить альбом.');
            }
        });
    });
</script>
</body>
</html>
