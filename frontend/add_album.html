<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Album</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        form div { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="date"], textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #tracksContainer {
            border: 1px solid #eee;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
        }
        .track-item {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        .track-item input {
            flex: 1;
        }
        .track-item input[name="track_number"] {
            flex: 0 0 50px;
        }
    </style>
</head>
<body>
<h1>Add New Album</h1>

<form id="addAlbumForm">
    <div>
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>
    </div>
    <div>
        <label for="artist">Artist:</label>
        <input type="text" id="artist" name="artist" required>
    </div>
    <div>
        <label for="cover_url">Cover URL:</label>
        <input type="text" id="cover_url" name="cover_url">
    </div>
    <div>
        <label for="type">Type:</label>
        <input type="text" id="type" name="type" placeholder="e.g., LP, EP, Single">
    </div>
    <div>
        <label for="release_date">Release Date:</label>
        <input type="date" id="release_date" name="release_date">
    </div>
    <div>
        <label for="release_year">Release Year (if no specific date):</label>
        <input type="number" id="release_year" name="release_year" min="1900" max="2100">
    </div>
    <div>
        <label for="genre">Genre (comma separated):</label>
        <input type="text" id="genre" name="genre" placeholder="e.g., Indie Rock, Alternative Rock">
    </div>
    <div>
        <label for="label">Label:</label>
        <input type="text" id="label" name="label">
    </div>
    <div>
        <label for="language">Language:</label>
        <input type="text" id="language" name="language">
    </div>

    <h2>Tracks</h2>
    <div id="tracksContainer">
    </div>
    <button type="button" id="addTrackButton">Add Track</button>
    <br><br>

    <button type="submit">Add Album</button>
</form>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const addAlbumForm = document.getElementById('addAlbumForm');
        const tracksContainer = document.getElementById('tracksContainer');
        const addTrackButton = document.getElementById('addTrackButton');
        let trackCount = 0;

        const addTrackInput = (trackNumber = '') => {
            trackCount++;
            const trackDiv = document.createElement('div');
            trackDiv.classList.add('track-item');
            trackDiv.innerHTML = `
                    <input type="number" name="track_number" placeholder="No." value="${trackNumber}" min="1" required>
                    <input type="text" name="track_title" placeholder="Track Title" required>
                    <input type="text" name="track_duration" placeholder="Duration (e.g., 3:45)">
                    <button type="button" class="remove-track-button">X</button>
                `;
            tracksContainer.appendChild(trackDiv);

            trackDiv.querySelector('.remove-track-button').addEventListener('click', () => {
                tracksContainer.removeChild(trackDiv);
            });
        };

        addTrackButton.addEventListener('click', () => addTrackInput(trackCount + 1));

        addAlbumForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            // Валидация обязательных полей
            if (!addAlbumForm.title.value || !addAlbumForm.artist.value) {
                alert('Название альбома и исполнитель обязательны для заполнения!');
                return;
            }

            const formData = new FormData(addAlbumForm);

            // Валидация треков
            const trackNumbers = document.querySelectorAll('#tracksContainer input[name="track_number"]');
            const trackTitles = document.querySelectorAll('#tracksContainer input[name="track_title"]');
            const trackDurations = document.querySelectorAll('#tracksContainer input[name="track_duration"]');

            // Проверяем номера треков
            for (let i = 0; i < trackNumbers.length; i++) {
                const trackNumber = parseInt(trackNumbers[i].value);
                if (isNaN(trackNumber)) {
                    alert(`Неверный номер трека в позиции ${i + 1}!`);
                    return;
                }
            }

            // Generate slug from title and artist
            const slug = `${formData.get('artist')}-${formData.get('title')}`
                .toLowerCase()
                .replace(/[^\w\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-');

            const albumData = {
                title: formData.get('title'),
                artist: formData.get('artist'),
                cover_url: formData.get('cover_url'),
                type: formData.get('type'),
                release_date: formData.get('release_date') || formData.get('release_year'),
                genres: formData.get('genre'),
                label: formData.get('label'),
                language: formData.get('language'),
                slug: slug,
                tracks: []
            };

            for (let i = 0; i < trackTitles.length; i++) {
                albumData.tracks.push({
                    number: parseInt(trackNumbers[i].value),
                    title: trackTitles[i].value,
                    duration: trackDurations[i].value
                });
            }

            try {
                const response = await fetch('/api/albums', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(albumData)
                });

                if (response.ok) {
                    const data = await response.json();
                    alert('Альбом успешно добавлен!');
                    window.location.href = `/release/album/${slug}`;
                } else {
                    const errorData = await response.json();
                    alert('Ошибка при добавлении альбома: ' + errorData.error);
                }
            } catch (error) {
                console.error('Fetch error:', error);
                alert('Произошла ошибка при попытке добавить альбом.');
            }
        });
    });
</script>

</body>
</html>
