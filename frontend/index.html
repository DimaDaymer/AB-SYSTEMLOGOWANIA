<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyRater - Wszechświat</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>

<div id="navbar-placeholder"></div>
<script src="/js/loadnavbar.js"></script>

<div class="container">
    <header class="hero-section">
        <h1 class="hero-title">Melody rater</h1>
        <p class="hero-subtitle">Twoja idealna ścieżka dźwiękowa do życia zaczyna się tutaj.</p>
    </header>

    <section>
        <h2>Polecani artyści</h2>
        <div id="artists-grid" class="results-grid"></div>
        <div id="artists-pagination" class="pagination-container"></div>
    </section>

    <section>
        <h2>Najlepsze albumy</h2>
        <div id="albums-grid" class="results-grid"></div>
        <div id="albums-pagination" class="pagination-container"></div>
    </section>

    <section>
        <h2>Popularne utwory</h2>
        <div id="tracks-list" class="tracks-list"></div>
        <div id="tracks-pagination" class="pagination-container"></div>
    </section>

    <section>
        <h2>Listy społeczności</h2>
        <div id="lists-grid" class="results-grid"></div>
        <div id="lists-pagination" class="pagination-container"></div>
    </section>
</div>

<script>
    const CONFIG = {
        artist: { endpoint: '/api/similar/artists/top', container: 'artists-grid', pag: 'artists-pagination', limit: 5 },
        album: { endpoint: '/api/similar/albums/top', container: 'albums-grid', pag: 'albums-pagination', limit: 5 },
        track: { endpoint: '/api/similar/tracks/top', container: 'tracks-list', pag: 'tracks-pagination', limit: 10 },
        list: { endpoint: '/api/similar/lists/top', container: 'lists-grid', pag: 'lists-pagination', limit: 5 }
    };

    async function loadData(type, page = 1) {
        const conf = CONFIG[type];
        const container = document.getElementById(conf.container);
        const pagContainer = document.getElementById(conf.pag);

        container.innerHTML = '<div class="loading-placeholder">Synchronizacja...</div>';

        try {
            const response = await fetch(`${conf.endpoint}?limit=${conf.limit}&page=${page}`);
            const data = await response.json();

            if (!data.items || data.items.length === 0) {
                container.innerHTML = '<p style="color:#444">Tutaj jest jeszcze pusto.</p>';
                pagContainer.innerHTML = '';
                return;
            }

            container.innerHTML = data.items.map(item => renderItem(type, item)).join('');

            // Użycie centralnego modułu paginacji
            await renderPagination(type, data.meta);

        } catch (err) {
            console.error(err);
            container.innerHTML = '<p style="color:#ef4444">Błąd ładowania danych.</p>';
        }
    }

    function renderItem(type, item) {
        if (type === 'artist') return `
            <a href="/artist.html?slug=${item.slug}" class="result-card round-img">
                <img src="${item.picture_url || '/img/default-artist.png'}">
                <span class="title">${item.name}</span>
                <small class="subtitle">Wykonawca</small>
            </a>`;

        if (type === 'album') return `
            <a href="/release/album/${item.slug}" class="result-card">
                <img src="${item.cover_url || '/img/default-artist.png'}">
                <span class="title">${item.title}</span>
                <small class="subtitle">${item.artist_name || 'Różni wykonawcy'}</small>
            </a>`;

        if (type === 'track') return `
            <a href="/track/${item.slug}" class="track-item">
                <div class="track-left">
                    <img src="${item.cover_url || '/img/default-artist.png'}" class="track-img">
                    <div class="track-info">
                        <span class="track-title">${item.title}</span>
                        <span class="track-artist">${item.artist_name || 'Nieznany'}</span>
                    </div>
                </div>
                <div style="color:#3b82f6; font-weight:bold; font-size:0.8em; text-transform:uppercase; letter-spacing:1px;">Słuchaj</div>
            </a>`;

        if (type === 'list') return `
            <a href="/list.html?slug=${item.slug}" class="result-card">
                <img src="${item.cover_url || '/img/default-artist.png'}">
                <span class="title">${item.name}</span>
                <small class="subtitle">od ${item.username}</small>
            </a>`;
    }

    async function renderPagination(type, meta) {
        const pagContainer = document.getElementById(CONFIG[type].pag);
        const listContainer = document.getElementById(CONFIG[type].container);

        // Znajdź nagłówek sekcji (element h2 bezpośrednio przed kontenerem listy)
        const sectionHeader = listContainer.previousElementSibling;

        try {
            const { renderPagination } = await import('/js/pagination.js');
            renderPagination(
                pagContainer,
                meta,
                (newPage) => loadData(type, newPage),
                {
                    scrollToTop: false,
                    scrollTarget: sectionHeader // Przewiń do nagłówka sekcji
                }
            );
        } catch (e) {
            console.error("Nie udało się załadować modułu paginacji", e);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        Object.keys(CONFIG).forEach(type => loadData(type));
    });
</script>

</body>
</html>
