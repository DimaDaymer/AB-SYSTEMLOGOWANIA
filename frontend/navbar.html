<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Komponent Nawigacji</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-left .site-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .navbar-left .site-logo img {
            height: 35px;
            filter: brightness(0) invert(1);
        }

        .navbar-center {
            display: flex;
            gap: 35px;
        }

        .navbar-center a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 1.05em;
            font-weight: 500;
            padding: 5px 0;
            position: relative;
            transition: color 0.3s ease, transform 0.2s ease;
        }

        .navbar-center a:hover {
            color: white;
            transform: translateY(-2px);
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .navbar-right .icon-button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.5em;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.2s ease;
            padding: 5px;
        }

        .navbar-right .icon-button:hover {
            color: white;
            transform: scale(1.1);
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            border: none;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            outline: none;
            width: 0;
            opacity: 0;
            transition: width 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
            margin-left: 10px;
        }

        .search-input.active {
            width: 200px;
            opacity: 1;
            padding: 8px 15px;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .user-menu {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #3a3a3a;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.4);
            z-index: 1;
            right: 0;
            border-radius: 5px;
            margin-top: 10px;
        }

        .dropdown-content a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            transition: background-color 0.3s ease;
            font-size: 1em;
        }

        .dropdown-content a:hover {
            background-color: #4a4a4a;
            border-radius: 5px;
        }

        .dropdown-content.show {
            display: block;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
                padding: 10px 15px;
            }

            .navbar-center, .navbar-right {
                margin-top: 10px;
                width: 100%;
                justify-content: center;
            }

            .navbar-center {
                flex-wrap: wrap;
                gap: 15px;
            }

            .search-container {
                width: 100%;
                justify-content: center;
            }
            .search-input.active {
                width: calc(100% - 70px);
            }

            .user-menu {
                margin-top: 10px;
            }

            .dropdown-content {
                right: auto;
                left: 0;
                width: 100%;
            }
        }

        #search-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            width: 350px;
            background: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            border: 1px solid #333;
        }

        #search-dropdown.show { display: flex; }

        .suggestion-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            text-decoration: none;
            color: #eee;
            transition: background 0.2s;
            border-bottom: 1px solid #2a2a2a;
        }

        .suggestion-item:hover { background: #2a2a2a; }

        .suggestion-item img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            margin-right: 12px;
            object-fit: cover;
            background-color: #333;
        }

        .suggestion-info { display: flex; flex-direction: column; }
        .suggestion-title { font-weight: 600; font-size: 0.95em; }
        .suggestion-type {
            font-size: 0.7em;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        .highlight { color: #3b82f6; font-weight: bold; }
        .see-all { justify-content: center; background: #161616; color: #3b82f6; }
    </style>

</head>
<nav class="navbar">
    <div class="navbar-left">
        <a href="/" class="site-logo">
            <img src="/img/MelodyRaterLogo.png" alt="MelodyRater" onerror="this.style.display='none'">
        </a>
    </div>

    <div class="navbar-center">
        <a href="/browse.html">Przeglądaj</a>
        <a href="/chart-page.html">Rankingi</a>
        <a href="/global_lists.html">Listy</a>
    </div>

    <div class="navbar-right">
        <div class="search-container">
            <button class="icon-button search-toggle-button">🔍</button>
            <input type="text" class="search-input" id="navbar-search" placeholder="Szukaj artystów, albumów..." autocomplete="off">
            <div class="search-dropdown" id="search-dropdown"></div>
        </div>

        <div class="user-menu">
            <button class="icon-button profile-toggle-button">👤</button>
            <div class="dropdown-content">
                <a href="#" id="nav-profile-link">Profil</a>
                <a href="/edit-profile.html">Ustawienia</a>
                <a href="#" id="logout-button">Wyloguj</a>
            </div>
        </div>
    </div>
</nav>
