<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Album | MelodyRater</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/edit_album.css">
</head>
<body>
<div class="form-container">
    <div class="form-card">
        <h1>Edit Album</h1>
        <div id="message-container" class="message-container"></div>
        <form id="edit-album-form">
            <div class="form-group">
                <label for="album-title">Title*</label>
                <input type="text" id="album-title" name="title" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="album-artist">Artist*</label>
                <input type="text" id="album-artist" name="artist" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="album-cover-url">Cover URL</label>
                <input type="text" id="album-cover-url" name="cover_url" class="form-control">
            </div>

            <div class="form-group">
                <label for="type">Type</label>
                <select id="type" name="type" class="form-control">
                    <option value="Album">Albums</option>
                    <option value="EP">EP</option>
                    <option value="Mixtape">Mixtape</option>
                    <option value="DJ Mix">DJ Mix</option>
                    <option value="Single">Singles</option>
                    <option value="Video">Video</option>
                    <option value="Compilation">Compilations</option>
                    <option value="Unauthorized">Unauthorized</option>
                    <option value="Song">Songs</option>
                </select>
            </div>

            <div class="form-group">
                <label for="release_date">Release Date</label>
                <input type="date" id="release_date" name="release_date" class="form-control" placeholder="e.g., 2024-10-26 or 2024">
            </div>


            <div class="form-group">
                <label for="album-genre">Genre (comma separated)</label>
                <input type="text" id="album-genre" name="genres" class="form-control" placeholder="e.g., Indie Rock, Alternative Rock">
            </div>

            <div class="form-group">
                <label for="album-label">Label</label>
                <input type="text" id="album-label" name="label" class="form-control">
            </div>

            <div class="form-group">
                <label for="album-language">Language</label>
                <input type="text" id="album-language" name="language" class="form-control">
            </div>

            <div class="form-group">
                <label for="album-description">Description</label>
                <input type="text" id="album-description" name="description" class="form-control">
            </div>

            <h2>Tracks</h2>
            <div id="tracks-container" class="form-group"></div>

            <button type="button" id="add-track-btn" class="btn add-item-btn">Add Track</button>

            <div style="margin-top: 30px;">
                <button type="submit" class="btn btn-block">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script src="js/edit_album.js" type="module"></script>
</body>
</html>
