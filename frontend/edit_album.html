<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytuj Album | MelodyRater</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/album_edit.css">
</head>
<body>
<div class="form-container">
    <div class="form-card edit-form-accent">
        <h1>Edytuj Album</h1>
        <div id="cover-preview" style="text-align: center; margin-bottom: 20px;">
            <img id="current-cover" src="" alt="Okładka albumu" style="display: none;">
            <p id="no-cover-text">Brak okładki</p>
        </div>

        <form id="editAlbumForm">
            <input type="hidden" id="album-identifier" name="album-identifier">

            <div class="form-group">
                <label for="title">Tytuł*</label>
                <input type="text" id="title" name="title" class="form-control" required placeholder="Wpisz tytuł albumu">
            </div>

            <div class="form-group">
                <label for="artist">Artysta*</label>
                <input type="text" id="artist" name="artist" class="form-control" required placeholder="Wpisz nazwy artystów, oddzielone przecinkami">
            </div>

            <div class="form-group">
                <label for="cover_url">URL okładki</label>
                <input type="text" id="cover_url" name="cover_url" class="form-control" placeholder="Link do obrazka">
            </div>

            <div class="form-group">
                <label for="release_date">Data wydania</label>
                <input type="date" id="release_date" name="release_date" class="form-control">
            </div>

            <div class="classification-box">
                <label style="color: #FFC107; margin-bottom: 10px;">Klasyfikacja wydania</label>

                <div style="margin-bottom: 15px;">
                    <label for="primary_format" style="font-size: 0.9em; color: #ccc;">Format podstawowy (Wybierz jeden):</label>
                    <select id="primary_format" name="primary_format" class="form-select">
                        <option value="Album">Album studyjny</option>
                        <option value="EP">EP</option>
                        <option value="Single">Singiel</option>
                        <option value="Mixtape">Mixtape</option>
                        <option value="DJ Mix">DJ Mix</option>
                        <option value="Compilation">Kompilacja</option>
                        <option value="Video">Wideo</option>
                    </select>
                </div>

                <div>
                    <label style="font-size: 0.9em; color: #ccc;">Atrybuty (Opcjonalnie):</label>
                    <div class="attr-grid">
                        <label><input type="checkbox" name="attributes" value="Live"> Live</label>
                        <label><input type="checkbox" name="attributes" value="Soundtrack"> Soundtrack</label>
                        <label><input type="checkbox" name="attributes" value="Unauthorized"> Nieoficjalne / Bootleg</label>
                        <label><input type="checkbox" name="attributes" value="Demo"> Demo</label>
                        <label><input type="checkbox" name="attributes" value="Box Set"> Box Set</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="genres">Gatunki</label>
                <input type="text" id="genres" name="genres" class="form-control" placeholder="Gatunek1, Gatunek2, ...">
            </div>

            <div class="form-group">
                <label for="label">Wytwórnia</label>
                <input type="text" id="label" name="label" class="form-control" placeholder="Wytwórnia płytowa">
            </div>

            <div class="form-group">
                <label for="language">Język</label>
                <input type="text" id="language" name="language" class="form-control" placeholder="Angielski, Polski, ...">
            </div>

            <div class="form-group">
                <label for="description">Opis (Słowa kluczowe)</label>
                <textarea id="description" name="description" class="form-control" placeholder="Słowa kluczowe (np. mroczny, humorystyczny, lo-fi)"></textarea>
            </div>
            <div class="tracklist-header">
                <h2>Lista utworów</h2>
                <button type="button" id="add-track-btn" class="button small-btn">+ Dodaj utwór</button>
            </div>

            <div id="tracklist-container">
            </div>

            <button type="submit" class="button">Zapisz zmiany</button>
        </form>
    </div>
</div>

<script>

    async function enforceAdminAccess() {
        const token = localStorage.getItem('token');
        if (!token) {
            alert('Aby edytować album, wymagane jest zalogowanie.');
            window.location.href = '/login.html';
            return false;
        }

        try {
            const res = await fetch('/api/users/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!res.ok) throw new Error('Nie udało się pobrać danych użytkownika');

            const user = await res.json();

            if (user.role !== 'admin') {
                alert('Nie masz uprawnień administratora do dostępu do tej strony.');
                window.location.href = '/';
                return false;
            }
            return true;

        } catch(e) {
            console.error('Błąd weryfikacji administratora:', e);
            alert('Błąd sprawdzania uprawnień. Zaloguj się ponownie.');
            window.location.href = '/login.html';
            return false;
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const hasAccess = await enforceAdminAccess();
        if (!hasAccess) return;

        const form = document.getElementById('editAlbumForm');
        const tracklistContainer = document.getElementById('tracklist-container');
        const addTrackBtn = document.getElementById('add-track-btn');
        const albumIdentifierInput = document.getElementById('album-identifier');
        const currentCoverImg = document.getElementById('current-cover');
        const noCoverText = document.getElementById('no-cover-text');

        let trackCounter = 1;

        function addTrack(number = trackCounter, title = '', duration = '') {
            const trackDiv = document.createElement('div');
            trackDiv.classList.add('track-entry');
            trackDiv.dataset.trackNumber = number;

            trackDiv.innerHTML = `
                <input type="number" class="form-control track-number" value="${number}" min="1" required style="width: 100%;">
                <input type="text" class="form-control track-title" placeholder="Tytuł utworu" value="${title}" required>
                <input type="text" class="form-control track-duration" placeholder="00:00" value="${duration}">
                <span class="track-delete" title="Usuń utwór">×</span>
            `;

            tracklistContainer.appendChild(trackDiv);

            trackDiv.querySelector('.track-delete').addEventListener('click', () => {
                trackDiv.remove();
                renumberTracks();
            });

            if (number >= trackCounter) {
                trackCounter = number + 1;
            }

            trackDiv.querySelector('.track-number').addEventListener('change', renumberTracks);
        }

        function renumberTracks() {
            const tracks = Array.from(tracklistContainer.querySelectorAll('.track-entry'));
            let currentNumber = 1;
            tracks.sort((a, b) => {
                return parseInt(a.querySelector('.track-number').value) - parseInt(b.querySelector('.track-number').value);
            }).forEach(trackDiv => {
                trackDiv.querySelector('.track-number').value = currentNumber;
                currentNumber++;
            });
            trackCounter = currentNumber;
        }

        addTrackBtn.addEventListener('click', () => addTrack());

        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        const cleanStringToArray = (input) => {
            if (!input) return [];
            return input.split(',')
                .map(s => s.trim())
                .filter(s => s.length > 0)
                .map(s => s.replace(/^"|"$/g, '').replace(/^'|'$/g, ''));
        }

        async function loadAlbumData(identifier) {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Aby edytować album, należy się zalogować.');
                window.location.href = '/login.html';
                return;
            }

            try {
                const response = await fetch(`/api/albums/by-slug/${identifier}`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const album = await response.json();

                    albumIdentifierInput.value = album.slug || album.id;
                    document.getElementById('title').value = album.title || '';

                    const artistNamesString = Array.isArray(album.artists)
                        ? album.artists.map(a => a.name).join(', ')
                        : '';
                    document.getElementById('artist').value = artistNamesString;

                    document.getElementById('cover_url').value = album.cover_url || '';
                    document.getElementById('release_date').value = album.release_date ? album.release_date.split('T')[0] : '';
                    document.getElementById('genres').value = Array.isArray(album.genres) ? album.genres.join(', ') : '';
                    document.getElementById('label').value = album.label || '';
                    document.getElementById('language').value = Array.isArray(album.languages) ? album.languages.join(', ') : '';
                    document.getElementById('description').value = Array.isArray(album.descriptors) ? album.descriptors.join(', ') : '';

                    if (album.cover_url) {
                        currentCoverImg.src = album.cover_url;
                        currentCoverImg.style.display = 'block';
                        noCoverText.style.display = 'none';
                    } else {
                        currentCoverImg.style.display = 'none';
                        noCoverText.style.display = 'block';
                    }

                    const primaryFormatSelect = document.getElementById('primary_format');
                    primaryFormatSelect.value = album.format_name || 'Album';

                    const attributes = album.attributes || [];
                    document.querySelectorAll('input[name="attributes"]').forEach(checkbox => {
                        checkbox.checked = Array.isArray(attributes) && attributes.includes(checkbox.value);
                    });

                    tracklistContainer.innerHTML = '';
                    trackCounter = 1;

                    if (album.tracks && album.tracks.length > 0) {
                        album.tracks.sort((a, b) => a.number - b.number).forEach(track => {
                            const durationValue = track.duration || '';
                            addTrack(track.track_number, track.title, durationValue);
                        });
                        renumberTracks();
                    } else {
                        addTrack(1, '', '');
                    }

                } else if (response.status === 404) {
                    alert('Nie znaleziono albumu.');
                    window.location.href = '/';
                } else {
                    const errorData = await response.text();
                    console.error("API Load Error:", errorData);
                    alert('Nie udało się załadować danych albumu. Błąd serwera.');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                alert('Wystąpił błąd podczas ładowania danych albumu.');
            }
        }

        const albumIdentifier = getUrlParameter('slug') || getUrlParameter('id');
        if (albumIdentifier) {
            loadAlbumData(albumIdentifier);
        } else {
            alert('Nie określono identyfikatora albumu do edycji.');
            window.location.href = '/';
            return;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const title = formData.get('title');
            const artist = formData.get('artist');
            const identifier = albumIdentifierInput.value || albumIdentifier;

            if (!title || title.trim() === '') { alert('Pole "Tytuł" nie może być puste.'); return; }
            if (!artist || artist.trim() === '') { alert('Pole "Artysta" nie może być puste.'); return; }
            if (!identifier) { alert('Błąd: Brak identyfikatora albumu.'); return; }

            const token = localStorage.getItem('token');
            if (!token) {
                alert('Aby zaktualizować album, należy się zalogować.');
                window.location.href = '/login.html';
                return;
            }

            const trackEntries = Array.from(tracklistContainer.querySelectorAll('.track-entry'));
            const tracks = trackEntries.map(entry => ({
                number: parseInt(entry.querySelector('.track-number').value),
                title: entry.querySelector('.track-title').value,
                duration: entry.querySelector('.track-duration').value
            }));

            const selectedAttributes = Array.from(document.querySelectorAll('input[name="attributes"]:checked'))
                .map(cb => cb.value);

            const albumData = {
                title: title,
                artist: artist,
                cover_url: formData.get('cover_url'),
                release_date: formData.get('release_date'),
                primary_format: formData.get('primary_format'),
                attributes: selectedAttributes,
                genres: cleanStringToArray(formData.get('genres')),
                label: formData.get('label'),
                language: cleanStringToArray(formData.get('language')),
                description: formData.get('description'),
                tracks: tracks
            };

            try {
                const response = await fetch(`/api/albums/${identifier}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(albumData)
                });

                if (response.ok) {
                    const data = await response.json();
                    alert('Album został pomyślnie zaktualizowany!');
                    window.location.href = `/release/album/${data.slug || identifier}`;
                } else if (response.status === 401) {
                    alert('Błąd autoryzacji. Brak uprawnień lub token wygasł.');
                    window.location.href = '/login.html';
                } else if (response.status === 404) {
                    alert('Nie znaleziono albumu do aktualizacji.');
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    alert('Błąd podczas aktualizacji: ' + (errorData.error || errorData.message || response.statusText));
                }
            } catch (error) {
                console.error('Fetch error:', error);
                alert('Wystąpił błąd podczas próby aktualizacji albumu.');
            }
        });
    });
</script>
</body>
</html>
