<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Album</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
    form div { margin-bottom: 10px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="number"], input[type="date"], textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-right: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    #tracksContainer {
      border: 1px solid #eee;
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
    }
    .track-item {
      display: flex;
      gap: 10px;
      margin-bottom: 5px;
      align-items: center;
    }
    .track-item input {
      flex: 1;
    }
    .track-item input[name="track_number"] {
      flex: 0 0 50px;
    }
    .remove-track-button {
      background-color: #f44336;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 5px 10px;
    }
    .remove-track-button:hover {
      background-color: #d32f2f;
    }
    .button-group {
      display: flex;
      margin-top: 20px;
    }
    .delete-button {
      background-color: #f44336;
    }
    .delete-button:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>
<h1>Edit Album</h1>

<form id="editAlbumForm">
  <div>
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" required>
  </div>
  <div>
    <label for="artist">Artist:</label>
    <input type="text" id="artist" name="artist" required>
  </div>
  <div>
    <label for="cover_url">Cover URL:</label>
    <input type="text" id="cover_url" name="cover_url">
  </div>
  <div>
    <label for="type">Type:</label>
    <input type="text" id="type" name="type" placeholder="e.g., LP, EP, Single">
  </div>
  <div>
    <label for="release_date">Release Date:</label>
    <input type="date" id="release_date" name="release_date">
  </div>
  <div>
    <label for="release_year">Release Year (if no specific date):</label>
    <input type="number" id="release_year" name="release_year" min="1900" max="2100">
  </div>
  <div>
    <label for="genre">Genre (comma separated):</label>
    <input type="text" id="genre" name="genre" placeholder="e.g., Indie Rock, Alternative Rock">
  </div>
  <div>
    <label for="label">Label:</label>
    <input type="text" id="label" name="label">
  </div>
  <div>
    <label for="language">Language:</label>
    <input type="text" id="language" name="language">
  </div>

  <h2>Tracks</h2>
  <div id="tracksContainer">
  </div>
  <button type="button" id="addTrackButton">Add Track</button>
  <br><br>

  <div class="button-group">
    <button type="submit">Update Album</button>
    <button type="button" id="deleteButton" class="delete-button">Delete Album</button>
  </div>
</form>
