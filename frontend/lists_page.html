<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои Списки</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .section-title {
            color: #fff;
            font-size: 2em;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .list-cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .list-card {
            background-color: #2a2a2a;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .list-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .list-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .list-content {
            padding: 20px;
        }

        .list-name {
            font-size: 1.5em;
            margin: 0;
            color: #e0e0e0;
        }

        .list-username, .list-items-count {
            color: #b0b0b0;
            margin: 5px 0;
        }

        .list-meta {
            font-size: 0.9em;
            color: #999;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="content-wrapper">
    <h1 class="section-title">ВАШИ СПИСКИ</h1>
    <div id="listCardsContainer" class="list-cards-container">
        <p>Загрузка ваших списков...</p>
    </div>
</div>

<script src="/js/lists1.js"></script>
</body>
</html>
