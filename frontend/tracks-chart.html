<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Top Tracks</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/filter_styles.css">
    <style>
        /* Стили остаются теми же, что я давал в предыдущем ответе */
        body { font-family: sans-serif; background-color: #1a1a1a; color: #f0f0f0; margin: 0; padding: 0; }
        #navbar-container { width: 100%; }
        .content-wrapper { display: flex; flex-direction: row; max-width: 1200px; margin: 20px auto; padding: 0 20px; gap: 20px; }
        #filter-sidebar-container { position: sticky; top: 20px; align-self: flex-start; height: fit-content; min-width: 300px; max-width: 400px; }
        .main-content-wrapper { flex-grow: 1; width: 100%; }
        .header-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .track-list { display: flex; flex-direction: column; gap: 10px; }
        .track-card {
            display: flex; align-items: center; background-color: #2a2a2a;
            border-radius: 6px; padding: 10px; gap: 15px;
            transition: background-color 0.2s;
        }
        .track-card:hover { background-color: #333; }
        .track-rank-number { font-size: 1.5em; font-weight: bold; color: #444; width: 40px; text-align: center; }
        .track-cover-link img { width: 60px; height: 60px; border-radius: 4px; object-fit: cover; }
        .track-info { flex-grow: 1; }
        .track-title { font-size: 1.1em; font-weight: bold; color: #fff; text-decoration: none; }
        .track-meta { font-size: 0.85em; color: #aaa; margin-top: 4px; }
        .track-meta a { color: #ccc; text-decoration: none; }
        .track-meta a:hover { color: #00ffcc; text-decoration: underline; }
        .track-stats { text-align: right; min-width: 100px; display: flex; flex-direction: column; justify-content: center; }
        .rating-value { color: #00ffcc; font-weight: bold; font-size: 1.2em; }
        .listens-count { font-size: 0.8em; color: #777; }
        .track-actions { margin-left: 10px; }
        .track-action-btn { background: none; border: 1px solid #444; color: #fff; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .track-action-btn:hover { border-color: #00ffcc; color: #00ffcc; }
        #pagination-footer { display: flex; justify-content: center; margin-top: 30px; gap: 5px; }
    </style>
</head>
<body>

<div id="navbar-container"></div>

<div class="content-wrapper">
    <div class="main-content-wrapper">
        <div id="track-list-container">
            <div class="header-controls">
                <h1 id="main-content-title">Top Tracks</h1>
                <div class="pagination-options">
                    <label for="itemsPerPage">Show:</label>
                    <select id="itemsPerPage">
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>

            <div id="newReleasesContainer" class="track-list">
                <p>Loading tracks...</p>
            </div>

            <div id="pagination-footer"></div>
        </div>
    </div>

    <div id="filter-sidebar-container"></div>
</div>

<script type="module" src="/js/tracks-chart/tracks-main.js"></script>

</body>
</html>
