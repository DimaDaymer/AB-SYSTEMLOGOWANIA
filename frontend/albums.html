<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Details | MelodyRater</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/albums.css">
    <link rel="stylesheet" href="/css/stars.css">

    <script src="/js/StarRating.js"></script>
</head>
<body>
<div id="navbar-container"></div>
<div id="dynamic-background"></div>

<div class="container">
    <div class="left-panel">
        <div id="album-cover-container"></div>
        <div id="tracklist-container"></div>
    </div>

    <div class="center-panel">
        <div id="album-info-container"></div>
        <div id="tabs-container"></div>
    </div>

    <div class="right-panel">
        <div id="user-actions-container"></div>

        <div class="score-block">
            <div class="score-value">Loading...</div>
            <div class="score-ratings"></div>

            <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">

            <div style="margin-bottom: 8px; color: #aaa; font-size: 0.9rem;">Your Rating:</div>
            <div id="album-star-rating-host"></div>
        </div>

        <div id="histogram-container"></div>

        <div id="media-links-container"></div>

        <div class="album-info-container">
            <button id="edit-album-btn" class="button" style="display: none;">Edit Album</button>
        </div>
    </div>
</div>

<script src="/js/albums1.js" type="module"></script>
</body>
</html>
