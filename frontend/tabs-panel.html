<div class="tab-panel">
  <div class="tab-header">
    <div class="tab active" data-tab="recent">Recent</div>
    <div class="tab" data-tab="albums">Albums</div>
    <div class="tab" data-tab="liked">Liked</div>
    <div class="tab" data-tab="wishlist">Wishlist</div>
    <div class="tab" data-tab="trackratings">Track Ratings</div>
  </div>
  <div class="tab-content active" id="recent">
  </div>
  <div class="tab-content" id="albums"><p>Albums tab content.</p></div>
  <div class="tab-content" id="liked"><p>Liked tab content.</p></div>
  <div class="tab-content" id="wishlist"><p>Wishlist tab content.</p></div>
  <div class="tab-content" id="trackratings">
    <h3>Albums with Track Ratings</h3>
    <div id="track-ratings-container"></div>
  </div>
</div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const contents = document.querySelectorAll('.tab-content');

  // This is a helper function that gets stars from a rating
  function getStarsForRating(rating) {
    if (!rating) return '☆☆☆☆☆';

    const fullStars = Math.floor(rating);
    const halfStar = rating % 1 >= 0.5 ? 1 : 0;
    const emptyStars = 5 - fullStars - halfStar;

    return '★'.repeat(fullStars) +
            (halfStar ? '½' : '') +
            '☆'.repeat(emptyStars);
  }

  // This is another helper function for a different star representation
  function scoreToStars(score) {
    const fullStars = Math.floor(score);
    const halfStar = score % 1 >= 0.5 ? 1 : 0;
    const emptyStars = 5 - fullStars - halfStar;

    return '★'.repeat(fullStars) +
            (halfStar ? '½' : '') +
            '☆'.repeat(emptyStars);
  }

  // This is the function to render individual tracks with their ratings
  function renderAlbumTracks(container, tracks) {
    container.innerHTML = '';
    tracks.forEach(track => {
      const trackElement = document.createElement('div');
      trackElement.className = 'track-item';
      trackElement.innerHTML = `
                <div class="track-name">${track.track_number}. ${track.title}</div>
                <div class="track-rating">
                    <span class="rating-stars">${getStarsForRating(track.user_rating)}</span>
                    <span class="rating-value">${track.user_rating}/5</span>
                </div>
            `;
      container.appendChild(trackElement);
    });
  }

  // This is the function that handles loading the albums with track ratings
  async function loadAlbumsWithTrackRatings() {
    try {
      const token = localStorage.getItem('token');
      if (!token) return;

      const container = document.getElementById('track-ratings-container');
      container.innerHTML = '<div class="loading">Loading track ratings...</div>';

      const res = await fetch(`/user/track-ratings`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!res.ok) throw new Error('Failed to load track ratings');
      const albumsWithRatings = await res.json();

      if (!albumsWithRatings || albumsWithRatings.length === 0) {
        container.innerHTML = '<div class="no-ratings">No track ratings yet</div>';
        return;
      }

      container.innerHTML = '';
      albumsWithRatings.forEach(album => {
        const albumElement = document.createElement('div');
        albumElement.className = 'album-with-tracks';
        albumElement.innerHTML = `
                    <div class="album-header">
                        <div class="album-header-content">
                            <img src="${album.cover_url || '/assets/album-placeholder.png'}"
                                 alt="${album.title}" class="album-cover-small">
                            <div>
                                <div class="album-title">${album.title}</div>
                                <div class="album-artist">${album.artist}</div>
                            </div>
                        </div>
                        <div class="toggle-icon">▼</div>
                    </div>
                    <div class="tracks-container"></div>
                `;
        container.appendChild(albumElement);

        const header = albumElement.querySelector('.album-header');
        const tracksContainer = albumElement.querySelector('.tracks-container');
        header.addEventListener('click', () => {
          if (tracksContainer.style.maxHeight) {
            tracksContainer.style.maxHeight = null;
            header.classList.remove('expanded');
          } else {
            if (tracksContainer.innerHTML === '') {
              renderAlbumTracks(tracksContainer, album.tracks);
            }
            tracksContainer.style.maxHeight = tracksContainer.scrollHeight + 'px';
            header.classList.add('expanded');
          }
        });
      });

    } catch (err) {
      console.error('Error loading track ratings:', err);
      const container = document.getElementById('track-ratings-container');
      container.innerHTML = `<p style="color: #ff6b6b;">Error loading track ratings: ${err.message}</p>`;
    }
  }

  // This is the function that loads user actions (listen, liked, wishlist)
  async function loadUserActions(type, containerId) {
    try {
      const token = localStorage.getItem('token');
      if (!token) return;

      const url = type === 'all'
              ? '/api/actions/all'
              : `/api/actions/${type}`;

      const container = document.getElementById(containerId);
      container.innerHTML = '<div class="loading">Loading...</div>';

      const res = await fetch(url, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!res.ok) throw new Error(`Failed to load ${type}`);

      const actions = await res.json();

      if (!actions || actions.length === 0) {
        container.innerHTML = `<p>No ${type} items found</p>`;
        return;
      }

      container.innerHTML = '';
      actions.forEach(action => {
        const actionEl = document.createElement('div');
        actionEl.className = 'album-entry';
        actionEl.innerHTML = `
                    <div class="list-image">
                        <img src="${action.cover_url || '/assets/album-placeholder.png'}"
                             alt="${action.title}" class="album-cover-small" />
                    </div>
                    <a href="/release/album/${action.slug}"
                       style="color: inherit; text-decoration: none; display: flex; align-items: center; width: 100%;">
                        <div class="album-details">
                            <span class="title">${action.title}</span>
                            <span class="artist-year">${action.artist} (${new Date(action.created_at).getFullYear()})</span>
                        </div>
                        <span class="date-rated">${new Date(action.created_at).toLocaleDateString()}</span>
                    </a>
                `;
        container.appendChild(actionEl);
      });
    } catch (err) {
      console.error(`Error loading ${type}:`, err);
      const container = document.getElementById(containerId);
      container.innerHTML = `<p style="color: #ff6b6b;">Error loading ${type}: ${err.message}</p>`;
    }
  }

  // This is the function that loads rated albums (the "Recent" tab)
  async function loadRatedAlbums() {
    try {
      const token = localStorage.getItem('token');
      if (!token) {
        document.getElementById('recent').innerHTML = '<p>Please log in to see your ratings</p>';
        return;
      }

      const container = document.getElementById('recent');
      container.innerHTML = '<div class="loading">Loading rated albums...</div>';

      const res = await fetch('/user/rated-albums', {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!res.ok) {
        const errorText = await res.text();
        throw new Error(`HTTP error! status: ${res.status}, ${errorText}`);
      }

      const albums = await res.json();

      if (!albums || albums.length === 0) {
        container.innerHTML = '<p>No rated albums yet</p>';
        return;
      }

      container.innerHTML = '';
      albums.forEach(album => {
        const albumEl = document.createElement('div');
        albumEl.className = 'album-entry';
        albumEl.innerHTML = `
                    <div class="list-image">
                        <img src="${album.cover_url || '/assets/album-placeholder.png'}"
                             alt="${album.title}" class="album-cover-small" />
                    </div>
                    <a href="/release/album/${album.slug}"
                       style="color: inherit; text-decoration: none; display: flex; align-items: center; width: 100%;">
                        <div class="album-details">
                            <span class="title">${album.title}</span>
                            <span class="artist-year">${album.artist} (${new Date(album.created_at).getFullYear()})</span>
                        </div>
                        <span class="rating-stars">${scoreToStars(album.score)}</span>
                        <span class="date-rated">${new Date(album.created_at).toLocaleDateString()}</span>
                    </a>
                `;
        container.appendChild(albumEl);
      });

    } catch (err) {
      console.error('Error loading rated albums:', err);
      const container = document.getElementById('recent');
      container.innerHTML = `<p style="color: #ff6b6b;">Error loading ratings: ${err.message}</p>`;
    }
  }

  // This sets up the tab switching logic
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      contents.forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).classList.add('active');

      switch(tab.dataset.tab) {
        case 'recent':
          loadRatedAlbums();
          break;
        case 'albums': // albums = listen
          loadUserActions('listen', 'albums');
          break;
        case 'liked':
          loadUserActions('like', 'liked');
          break;
        case 'wishlist':
          loadUserActions('wishlist', 'wishlist');
          break;
        case 'trackratings':
          loadAlbumsWithTrackRatings();
          break;
      }
    });
  });

  document.addEventListener('DOMContentLoaded', () => {
    const activeTab = document.querySelector('.tab.active');
    if (activeTab) {
      switch(activeTab.dataset.tab) {
        case 'recent':
          loadRatedAlbums();
          break;
        case 'albums':
          loadUserActions('listen', 'albums');
          break;
        case 'liked':
          loadUserActions('like', 'liked');
          break;
        case 'wishlist':
          loadUserActions('wishlist', 'wishlist');
          break;
        case 'trackratings':
          loadAlbumsWithTrackRatings();
          break;
      }
    }
  });

</script>
