<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie | MelodyRater</title>
    <link rel="stylesheet" href="./css/common.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <h2>Zaloguj się</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginUsername" class="sr-only">Nazwa użytkownika</label>
                <input type="text" id="loginUsername" class="form-control" placeholder="Nazwa użytkownika" required>
            </div>

            <div class="form-group">
                <label for="loginPassword" class="sr-only">Hasło</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Hasło" required>
            </div>

            <button type="submit" class="btn btn-block">Zaloguj się</button>
        </form>
        <div class="form-footer">
            <p>Nie masz konta? <a href="./register.html">Zarejestruj się tutaj</a></p>
        </div>

        <div id="loginError" class="error-message"></div>
    </div>
</div>
<script src="./js/auth.js"></script>
</body>
</html>
