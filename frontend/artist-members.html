<div id="artist-members-management">
    <h3>Участники Группы (Admin Only)</h3>

    <div class="add-member-form">
        <label for="member-name-input">Имя Участника (для поиска/создания):</label>
        <input type="text" id="member-name-input" placeholder="Введите имя артиста">

        <label for="member-role-input">Роль (необязательно, напр., 'вокал'):</label>
        <input type="text" id="member-role-input" placeholder="Роль">

        <button id="add-member-button">Добавить Участника</button>
        <p id="member-status-message" style="margin-top: 10px; color: green;"></p>
    </div>

    <h4>Текущие Участники</h4>
    <ul id="members-list">
        <li>Загрузка...</li>
    </ul>
</div>

<script>
    // Предполагается, что `GROUP_ARTIST_ID` определен где-то в родительском HTML (например, в artist.html)
    // const GROUP_ARTIST_ID = 123;

    const memberNameInput = document.getElementById('member-name-input');
    const memberRoleInput = document.getElementById('member-role-input');
    const addMemberButton = document.getElementById('add-member-button');
    const membersList = document.getElementById('members-list');
    const memberStatusMessage = document.getElementById('member-status-message');

    // Функция загрузки списка участников
    async function loadMembers() {
        if (!GROUP_ARTIST_ID) return; // Проверка, что ID группы доступен

        membersList.innerHTML = '<li>Загрузка...</li>';
        try {
            const response = await fetch(`/api/credits/artist-members/${GROUP_ARTIST_ID}`);
            const members = await response.json();

            membersList.innerHTML = '';

            if (members.error) {
                membersList.innerHTML = `<li>Ошибка: ${members.error}</li>`;
                return;
            }

            if (members.length === 0) {
                membersList.innerHTML = '<li>Участники не найдены.</li>';
                return;
            }

            members.forEach(member => {
                const li = document.createElement('li');
                let memberLink = `<a href="/artists/${member.member_slug}">${member.member_name}</a>`;
                let roleText = member.role ? ` (${member.role})` : '';

                li.innerHTML = `${memberLink}${roleText}
                                <button class="delete-member-button" data-id="${member.id}" style="margin-left: 10px;">Удалить</button>`;
                membersList.appendChild(li);
            });

            document.querySelectorAll('.delete-member-button').forEach(button => {
                button.addEventListener('click', deleteMember);
            });

        } catch (error) {
            membersList.innerHTML = `<li>Ошибка при загрузке: ${error.message}</li>`;
        }
    }

    // Функция добавления участника
    async function addMember() {
        const memberName = memberNameInput.value.trim();
        const role = memberRoleInput.value.trim();

        if (!memberName) {
            memberStatusMessage.textContent = 'Введите имя участника.';
            return;
        }

        memberStatusMessage.textContent = 'Добавление...';

        try {
            const response = await fetch('/api/credits/artist-members', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    groupArtistId: GROUP_ARTIST_ID,
                    memberName: memberName,
                    role: role
                })
            });

            const result = await response.json();

            if (response.ok) {
                memberStatusMessage.textContent = `Успешно добавлен! ${result.created ? '(Создан новый артист)' : ''}`;
                memberNameInput.value = '';
                memberRoleInput.value = '';
                loadMembers(); // Обновить список
            } else {
                memberStatusMessage.textContent = `Ошибка: ${result.error || 'Неизвестная ошибка'}`;
            }

        } catch (error) {
            memberStatusMessage.textContent = `Сетевая ошибка: ${error.message}`;
        }
    }

    // Функция удаления участника
    async function deleteMember(event) {
        const memberId = event.target.getAttribute('data-id');
        if (!confirm('Вы уверены, что хотите удалить этого участника?')) return;

        try {
            const response = await fetch(`/api/credits/artist-members/${memberId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                loadMembers(); // Обновить список
            } else {
                alert('Ошибка при удалении участника.');
            }
        } catch (error) {
            console.error('Ошибка при удалении:', error);
            alert('Сетевая ошибка при удалении.');
        }
    }

    addMemberButton.addEventListener('click', addMember);

    // Инициализация при загрузке
    document.addEventListener('DOMContentLoaded', () => {
        // Убедитесь, что эта функция вызывается после определения GROUP_ARTIST_ID в artist.html
        // loadMembers();
    });
</script>
