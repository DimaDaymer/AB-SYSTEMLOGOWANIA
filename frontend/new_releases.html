<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Releases</title>
    <style>
        body { font-family: sans-serif; max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .album-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .album-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .album-card img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .album-card h2 {
            font-size: 1.4em;
            margin-top: 0;
            margin-bottom: 5px;
        }
        .album-card p {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 5px;
        }
        .album-card ul {
            list-style: none;
            padding: 0;
            margin-top: 10px;
            text-align: left;
            font-size: 0.85em;
        }
        .album-card ul li {
            margin-bottom: 3px;
        }
        .album-card a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>
<body>
<h1>New Releases</h1>
<div id="newReleasesContainer" class="album-list">
    <p>Loading new releases...</p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const newReleasesContainer = document.getElementById('newReleasesContainer');

        try {
            const response = await fetch('/api/albums');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const albums = await response.json();

            if (albums.length === 0) {
                newReleasesContainer.innerHTML = '<p>No new releases found.</p>';
                return;
            }

            newReleasesContainer.innerHTML = '';

            albums.forEach(album => {
                const albumCard = document.createElement('div');
                albumCard.classList.add('album-card');

                let tracksHtml = '';
                if (album.tracks && album.tracks.length > 0) {
                    tracksHtml = '<h3>Tracks:</h3><ul>';
                    album.tracks.forEach(track => {
                        tracksHtml += `<li>${track.track_number}. ${track.title} ${track.duration ? `(${track.duration})` : ''}</li>`;
                    });
                    tracksHtml += '</ul>';
                }

                // Исправленная ссылка - используется slug вместо ID
                const albumUrl = `/release/album/${album.slug}`;

                albumCard.innerHTML = `
                    <a href="${albumUrl}">
                        ${album.cover_url ? `<img src="${album.cover_url}" alt="${album.title} cover">` : ''}
                        <h2>${album.title}</h2>
                        <p><strong>Artist:</strong> ${album.artist}</p>
                        ${album.type ? `<p><strong>Type:</strong> ${album.type}</p>` : ''}
                        ${album.release_date ? `<p><strong>Release Date:</strong> ${album.release_date}</p>` : (album.release_year ? `<p><strong>Release Year:</strong> ${album.release_year}</p>` : '')}
                        ${album.genres ? `<p><strong>Genres:</strong> ${album.genres}</p>` : ''}
                        ${album.label ? `<p><strong>Label:</strong> ${album.label}</p>` : ''}
                        ${album.language ? `<p><strong>Language:</strong> ${album.language}</p>` : ''}
                        ${tracksHtml}
                    </a>
                `;
                newReleasesContainer.appendChild(albumCard);
            });

        } catch (error) {
            console.error('Error fetching new releases:', error);
            newReleasesContainer.innerHTML = '<p>Failed to load new releases.</p>';
        }
    });
</script>
</body>
</html>
