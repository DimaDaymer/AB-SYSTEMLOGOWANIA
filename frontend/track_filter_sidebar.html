<div class="filter-sidebar">
    <div class="filter-header">Filters (Tracks)</div>
    <div class="filter-dropdowns">
        <select class="filter-dropdown" id="sort-by">
            <option value="release_date">- Default (Date) -</option>
            <option value="rating">Top Score</option>
            <option value="popularity">Popularity</option>
            <option value="title">Title</option>
            <option value="artist">Artist</option>
            <option value="duration">Duration</option>
        </select>
        <select class="filter-dropdown" id="sort-order">
            <option value="desc">Descending</option>
            <option value="asc">Ascending</option>
        </select>
    </div>

    <div class="filter-section">
        <h3>My Activity</h3>
        <div class="status-filter-options" style="display: flex; flex-direction: column; gap: 5px;">
            <label><input type="radio" name="user_status" value="all" checked> Show All</label>
            <label><input type="radio" name="user_status" value="listened"> Only Listened</label>
            <label><input type="radio" name="user_status" value="not_listened"> Exclude Listened</label>
        </div>
        <div style="margin-top: 10px; border-top: 1px solid #444; padding-top: 10px;">
            <label style="display: flex; align-items: center; cursor: pointer;">
                <input type="checkbox" id="one-per-artist" value="true">
                One track per artist <br><span style="font-size: 0.8em; color: #888; margin-left: 24px;">(Groups by Artist)</span>
            </label>
        </div>
    </div>

    <div class="filter-search-container" style="position: relative;">
        <input type="text" class="filter-search-input" placeholder="Search (Track, Artist...)" id="filter-search-input">
        <span class="filter-search-icon">🔍</span>
        <div id="autocomplete-results" class="autocomplete-results"></div>
    </div>

    <div class="filter-section">
        <h3>Genres</h3>
        <p class="metadata">
            <span id="genres-count">...</span> available
            <span id="genres-selected-text" style="display:none; color: #00ffcc; margin-left: 5px;"></span>
        </p>
        <a href="#" id="browse-genres-button" class="filter-link-button">Browse genres ▶</a>
    </div>

    <div class="filter-section">
        <h3>Descriptors</h3>
        <p class="metadata">
            <span id="description-count">...</span> available
            <span id="description-selected-text" style="display:none; color: #00ffcc; margin-left: 5px;"></span>
        </p>
        <a href="#" id="browse-description-button" class="filter-link-button">Browse descriptors ▶</a>
    </div>

    <div class="filter-section">
        <h3>Languages</h3>
        <p class="metadata">
            <span id="language-count">...</span> available
            <span id="language-selected-text" style="display:none; color: #00ffcc; margin-left: 5px;"></span>
        </p>
        <a href="#" id="browse-language-button" class="filter-link-button">Browse languages ▶</a>
    </div>

    <div class="filter-section">
        <h3>Timeframe</h3>
        <div class="year-filter-options">
            <label><input type="radio" id="time-all-time" name="timeframe" value="all-time" checked> All-time</label>
            <label><input type="radio" id="time-specific-year" name="timeframe" value="specific-year"> Specific year/decade</label>
            <input type="text" id="specific-year-input" placeholder="Ex: 1982, 2010s" class="year-input">
            <label><input type="radio" id="time-year-range" name="timeframe" value="year-range"> Year range</label>
            <input type="text" id="year-range-input" placeholder="Ex: 1970-2000" class="year-input">
        </div>
    </div>
</div>

<script>
    // --- GLOBAL VARIABLES (Track Context) ---
    window.selectedGenresArray = window.selectedGenresArray || [];
    window.excludedGenresArray = window.excludedGenresArray || [];
    window.selectedDescriptionArray = window.selectedDescriptionArray || [];
    window.excludedDescriptionArray = window.excludedDescriptionArray || [];
    window.selectedLanguageArray = window.selectedLanguageArray || [];
    window.excludedLanguageArray = window.excludedLanguageArray || [];

    // --- MAIN UPDATE FUNCTION ---
    window.updateUrl = function() {
        const params = new URLSearchParams(window.location.search);

        // 1. Sort & Order
        const sortBy = document.getElementById('sort-by').value;
        if (sortBy && sortBy !== 'release_date') params.set('sort', sortBy);
        else params.delete('sort');

        const sortOrder = document.getElementById('sort-order').value;
        if (sortOrder && sortOrder !== 'desc') params.set('order', sortOrder);
        else params.delete('order');

        // 2. Search
        const searchInput = document.getElementById('filter-search-input');
        if (searchInput && searchInput.value) params.set('search', searchInput.value.trim());
        else params.delete('search');

        // 3. User Activity Status
        const userStatus = document.querySelector('input[name="user_status"]:checked').value;
        if (userStatus && userStatus !== 'all') params.set('status', userStatus);
        else params.delete('status');

        // 4. One Per Artist
        const onePerArtistCheckbox = document.getElementById('one-per-artist');
        if (onePerArtistCheckbox && onePerArtistCheckbox.checked) params.set('one_per_artist', 'true');
        else params.delete('one_per_artist');

        // 5. Tags Helper (Joins arrays with comma)
        const setParams = (selArr, exclArr, pName, exclPName) => {
            if (selArr && selArr.length > 0) params.set(pName, selArr.join(','));
            else params.delete(pName);
            if (exclArr && exclArr.length > 0) params.set(exclPName, exclArr.join(','));
            else params.delete(exclPName);
        };

        setParams(window.selectedGenresArray, window.excludedGenresArray, 'genres', 'exclude_genres');
        setParams(window.selectedDescriptionArray, window.excludedDescriptionArray, 'description', 'exclude_description');
        setParams(window.selectedLanguageArray, window.excludedLanguageArray, 'language', 'exclude_language');

        // 6. Timeframe
        const timeframeRadio = document.querySelector('input[name="timeframe"]:checked');
        const timeframe = timeframeRadio ? timeframeRadio.value : 'all-time';

        params.delete('year');
        params.delete('yearRange');

        if (timeframe === 'specific-year') {
            const val = document.getElementById('specific-year-input').value.trim();
            if (val) {
                // If user types '2010s', send as yearRange, else as year
                if (val.toLowerCase().endsWith('s')) params.set('yearRange', val);
                else params.set('year', val);
            }
        } else if (timeframe === 'year-range') {
            const val = document.getElementById('year-range-input').value.trim();
            if (val) params.set('yearRange', val);
        }

        // 7. Update History & Trigger Load
        const newUrl = `${window.location.pathname}?${params.toString()}`;
        window.history.pushState(null, '', newUrl);

        if (typeof window.applyFilters === 'function') window.applyFilters();
        updateSelectedCountsUI();
    };

    function updateSelectedCountsUI() {
        const updateText = (arrSel, arrExcl, elId) => {
            const el = document.getElementById(elId);
            if (!el) return;
            const count = (arrSel ? arrSel.length : 0) + (arrExcl ? arrExcl.length : 0);
            if (count > 0) {
                el.textContent = `(${count} selected)`;
                el.style.display = 'inline';
            } else {
                el.style.display = 'none';
            }
        };
        updateText(window.selectedGenresArray, window.excludedGenresArray, 'genres-selected-text');
        updateText(window.selectedDescriptionArray, window.excludedDescriptionArray, 'description-selected-text');
        updateText(window.selectedLanguageArray, window.excludedLanguageArray, 'language-selected-text');
    }

    async function fetchCounts() {
        const getCount = async (url, id) => {
            try {
                const r = await fetch(url, { cache: 'no-store' });
                if (r.ok) {
                    const d = await r.json();
                    const el = document.getElementById(id);
                    if (el && d.count) el.textContent = d.count.toLocaleString();
                }
            } catch (e) {}
        };
        await getCount('/api/filters/genres-count', 'genres-count');
        await getCount('/api/filters/description-count', 'description-count');
        await getCount('/api/filters/language-count', 'language-count');
    }

    // Dynamic Loader for Tag Lists (uses track-specific lists if needed, but usually generic is fine)
    function loadDynamicContent(url, cid) {
        const c = document.getElementById(cid); if(!c) return;
        fetch(url).then(r=>r.text()).then(h=>{
            c.innerHTML=h;
            // Execute scripts manually (crucial for filter_list.js)
            c.querySelectorAll('script').forEach(s=>{
                const n=document.createElement('script');
                if(s.src) n.src=s.src;
                else n.textContent = `{\n${s.textContent}\n}`; // Block wrap
                document.body.appendChild(n); s.remove();
            });
        });
    }

    function setupNavButtons() {
        const setup = (id, url) => {
            const btn = document.getElementById(id);
            if(btn) btn.addEventListener('click', (e)=>{
                e.preventDefault();
                loadDynamicContent(url, 'filter-sidebar-container');
            });
        };
        // Reuse the generic list HTMLs
        setup('browse-genres-button', '/genres_list.html');
        setup('browse-description-button', '/description_list.html');
        setup('browse-language-button', '/language_list.html');
    }

    // --- INITIALIZATION ---
    window.initFilters = async function() {
        const params = new URLSearchParams(window.location.search);

        const parseParam = (key) => {
            const val = params.get(key);
            return val ? val.split(',').map(s => s.trim()).filter(v => v) : [];
        };

        // 1. Restore Arrays
        window.selectedGenresArray = parseParam('genres');
        window.excludedGenresArray = parseParam('exclude_genres');
        window.selectedDescriptionArray = parseParam('description');
        window.excludedDescriptionArray = parseParam('exclude_description');
        window.selectedLanguageArray = parseParam('language');
        window.excludedLanguageArray = parseParam('exclude_language');

        updateSelectedCountsUI();

        // 2. Restore Controls
        const sortEl = document.getElementById('sort-by');
        const orderEl = document.getElementById('sort-order');
        const searchEl = document.getElementById('filter-search-input');
        const onePerArtistCheckbox = document.getElementById('one-per-artist');

        if(sortEl) sortEl.value = params.get('sort') || 'release_date';
        if(orderEl) orderEl.value = params.get('order') || 'desc';
        if(searchEl) searchEl.value = params.get('search') || '';

        // Restore One Per Artist
        if(onePerArtistCheckbox) {
            onePerArtistCheckbox.checked = params.get('one_per_artist') === 'true';
        }

        // Restore Status
        const status = params.get('status');
        if (status) {
            const radio = document.querySelector(`input[name="user_status"][value="${status}"]`);
            if (radio) radio.checked = true;
        }

        // Restore Timeframe
        const year = params.get('year');
        const yearRange = params.get('yearRange');
        if (year) {
            document.getElementById('time-specific-year').checked = true;
            document.getElementById('specific-year-input').value = year;
        } else if (yearRange) {
            if (yearRange.endsWith('s')) {
                // e.g., 2010s
                document.getElementById('time-specific-year').checked = true;
                document.getElementById('specific-year-input').value = yearRange;
            } else {
                // e.g., 1990-2000
                document.getElementById('time-year-range').checked = true;
                document.getElementById('year-range-input').value = yearRange;
            }
        } else {
            const allTime = document.getElementById('time-all-time');
            if(allTime) allTime.checked = true;
        }

        // 3. Attach Listeners
        document.querySelectorAll('.filter-dropdown').forEach(d => d.addEventListener('change', window.updateUrl));
        document.querySelectorAll('input[name="user_status"]').forEach(r => r.addEventListener('change', window.updateUrl));
        if(onePerArtistCheckbox) onePerArtistCheckbox.addEventListener('change', window.updateUrl);
        document.querySelectorAll('input[name="timeframe"]').forEach(r => r.addEventListener('change', window.updateUrl));

        if(searchEl) searchEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') window.updateUrl();
        });
        const searchIcon = document.querySelector('.filter-search-icon');
        if(searchIcon) searchIcon.addEventListener('click', window.updateUrl);

        const yInput = document.getElementById('specific-year-input');
        if(yInput) yInput.addEventListener('keypress', (e)=>{if(e.key==='Enter'){document.getElementById('time-specific-year').checked=true; window.updateUrl();}});
        const yrInput = document.getElementById('year-range-input');
        if(yrInput) yrInput.addEventListener('keypress', (e)=>{if(e.key==='Enter'){document.getElementById('time-year-range').checked=true; window.updateUrl();}});

        setupNavButtons();
        fetchCounts();
    };

    // Trigger Init
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        window.initFilters();
    } else {
        document.addEventListener('DOMContentLoaded', window.initFilters);
    }
</script>
