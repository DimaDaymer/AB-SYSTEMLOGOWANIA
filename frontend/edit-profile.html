<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytuj Profil | MelodyRater</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>

<div id="navbar-container"></div>
<div class="form-container">
    <div class="form-card">
        <h2>Edytuj Profil</h2>
        <form id="editProfileForm">
            <div class="form-group">
                <label for="firstName">Imię</label>
                <input type="text" id="firstName" class="form-control" placeholder="Imię">
            </div>

            <div class="form-group">
                <label for="lastName">Nazwisko</label>
                <input type="text" id="lastName" class="form-control" placeholder="Nazwisko">
            </div>

            <div class="form-group">
                <label for="birthDate">Data urodzenia</label>
                <input type="date" id="birthDate" class="form-control">
            </div>

            <div class="form-group">
                <label for="gender">Płeć</label>
                <select id="gender" class="form-control">
                    <option value="">Wybierz płeć</option>
                    <option value="male">Mężczyzna</option>
                    <option value="female">Kobieta</option>
                    <option value="other">Inna</option>
                </select>
            </div>

            <div class="form-group">
                <label for="location">Miasto</label>
                <input type="text" id="location" class="form-control" placeholder="Miasto">
            </div>

            <div class="form-group">
                <label for="country">Kraj</label>
                <input type="text" id="country" class="form-control" placeholder="Kraj">
            </div>

            <div class="form-group">
                <label>Media społecznościowe</label>
                <div id="social-inputs-container" class="form-control">
                </div>
                <button type="button" id="add-social-btn" class="btn btn-block">
                    <i class="fas fa-plus"></i> Dodaj kolejny link
                </button>
            </div>

            <div class="form-group">
                <label for="contactEmail">E-mail kontaktowy</label>
                <input type="email" id="contactEmail" class="form-control" placeholder="E-mail kontaktowy">
            </div>

            <div class="form-group">
                <label for="description">O mnie</label>
                <textarea id="description" class="form-control" placeholder="Opisz siebie" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="music">Ulubiona muzyka (opcjonalnie)</label>
                <input type="text" id="music" class="form-control" placeholder="Ulubiona muzyka">
            </div>

            <div class="form-group">
                <label for="movies">Ulubione filmy (opcjonalnie)</label>
                <input type="text" id="movies" class="form-control" placeholder="Ulubione filmy">
            </div>

            <button type="submit" class="btn btn-block">Zapisz zmiany</button>
        </form>

        <div id="updateMessage" class="success-message"></div>
        <div class="form-footer">
            <a href="profile.html">← Powrót do profilu</a>
        </div>
    </div>
</div>

<script src="js/edit-profile.js"></script>
</body>
</html>
