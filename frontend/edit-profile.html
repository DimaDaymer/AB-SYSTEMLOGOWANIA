<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-container">
    <h2>Edit Profile</h2>
    <form id="editProfileForm">
        <input type="text" id="firstName" placeholder="First Name">
        <input type="text" id="lastName" placeholder="Last Name">
        <input type="date" id="birthDate" placeholder="Birth Date">
        <select id="gender">
            <option value="">Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <input type="text" id="location" placeholder="City">
        <input type="text" id="country" placeholder="Country">
        <input type="text" id="social" placeholder="Social Media Link">
        <input type="email" id="contactEmail" placeholder="Contact Email">
        <textarea id="description" placeholder="About Me"></textarea>
        <input type="text" id="music" placeholder="Favorite Music (optional)">
        <input type="text" id="movies" placeholder="Favorite Movies (optional)">
        <button type="submit">Save Changes</button>
    </form>
    <div id="updateMessage" class="success"></div>
    <a href="profile.html">Back to Profile</a>
</div>

<script src="js/edit-profile.js"></script>
</body>
</html>
