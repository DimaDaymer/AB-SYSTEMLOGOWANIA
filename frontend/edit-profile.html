<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | MelodyRater</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>

<div id="navbar-container"></div>
<div class="form-container">
    <div class="form-card">
        <h2>Edit Profile</h2>
        <form id="editProfileForm">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" class="form-control" placeholder="First Name">
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" class="form-control" placeholder="Last Name">
            </div>

            <div class="form-group">
                <label for="birthDate">Birth Date</label>
                <input type="date" id="birthDate" class="form-control">
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" class="form-control">
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="location">City</label>
                <input type="text" id="location" class="form-control" placeholder="City">
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <input type="text" id="country" class="form-control" placeholder="Country">
            </div>

            <div class="form-group">
                <label for="social">Social Media Link</label>
                <input type="text" id="social" class="form-control" placeholder="Social Media Link">
            </div>

            <div class="form-group">
                <label for="contactEmail">Contact Email</label>
                <input type="email" id="contactEmail" class="form-control" placeholder="Contact Email">
            </div>

            <div class="form-group">
                <label for="description">About Me</label>
                <textarea id="description" class="form-control" placeholder="About Me" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="music">Favorite Music (optional)</label>
                <input type="text" id="music" class="form-control" placeholder="Favorite Music">
            </div>

            <div class="form-group">
                <label for="movies">Favorite Movies (optional)</label>
                <input type="text" id="movies" class="form-control" placeholder="Favorite Movies">
            </div>

            <button type="submit" class="btn btn-block">Save Changes</button>
        </form>

        <div id="updateMessage" class="success-message"></div>
        <div class="form-footer">
            <a href="profile.html">← Back to Profile</a>
        </div>
    </div>
</div>

<script src="js/edit-profile.js"></script>
</body>
</html>
