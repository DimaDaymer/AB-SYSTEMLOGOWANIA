<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование исполнителя | MelodyRater</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/album_edit.css">
</head>
<body>
<div class="form-container">
    <div class="form-card edit-form-accent">
        <h1>Редактирование исполнителя</h1>
        <div id="picture-preview" style="text-align: center; margin-bottom: 20px;">
            <img id="current-picture" src="" alt="Artist Picture" style="display: none; max-width: 200px; height: auto; border-radius: 5px;">
            <p id="no-picture-text">No picture available</p>
        </div>

        <form id="editArtistForm">
            <input type="hidden" id="artist-identifier" name="artist-identifier">
            <input type="hidden" id="artist-id" name="artist-id">

            <div class="form-group">
                <label for="name">Имя исполнителя*</label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="Enter artist name">
            </div>

            <div class="form-group">
                <label for="artist_type">Тип исполнителя</label>
                <select id="artist_type" name="artist_type" class="form-control">
                    <option value="solo">Solo Artist (Person)</option>
                    <option value="group">Group / Band</option>
                </select>
            </div>

            <div class="form-group">
                <label for="picture_url">Picture URL</label>
                <input type="text" id="picture_url" name="picture_url" class="form-control" placeholder="Image link">
            </div>

            <div class="form-group">
                <label for="formed_year">Год образования / Рождения</label>
                <input type="text" id="formed_year" name="formed_year" class="form-control" placeholder="YYYY">
            </div>

            <div class="form-group">
                <label for="origin_country">Страна</label>
                <input type="text" id="origin_country" name="origin_country" class="form-control" placeholder="Country">
            </div>

            <div class="form-group">
                <label for="bio">Биография</label>
                <textarea id="bio" name="bio" class="form-control" rows="8" placeholder="Enter artist biography (Markdown supported)"></textarea>
            </div>

            <div class="form-group">
                <label for="description">Описание (Ключевые слова/метаданные)</label>
                <textarea id="description" name="description" class="form-control" placeholder="Keywords, previous band names, etc. (for admin use)"></textarea>
            </div>

            <button type="submit" class="button">Сохранить изменения</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        async function enforceAdminAccess() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Для редактирования необходима авторизация.');
                window.location.href = '/login.html';
                return false;
            }
            try {
                const res = await fetch('/api/users/me', { headers: { 'Authorization': `Bearer ${token}` }});
                if (!res.ok) throw new Error('Failed to fetch user data');
                const user = await res.json();
                if (user.role !== 'admin') {
                    alert('Нет прав администратора.');
                    window.location.href = '/';
                    return false;
                }
                return true;
            } catch(e) {
                console.error(e);
                window.location.href = '/login.html';
                return false;
            }
        }

        if (!await enforceAdminAccess()) return;

        const form = document.getElementById('editArtistForm');
        const artistIdInput = document.getElementById('artist-id');
        const pictureUrlInput = document.getElementById('picture_url');
        const currentPictureImg = document.getElementById('current-picture');
        const noPictureText = document.getElementById('no-picture-text');

        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        async function loadArtistData(identifier) {
            try {
                const response = await fetch(`/api/artist/${identifier}`);
                if (response.ok) {
                    const data = await response.json();
                    const artist = data.artist;

                    document.getElementById('artist-identifier').value = artist.slug;
                    artistIdInput.value = artist.id;
                    document.getElementById('name').value = artist.name || '';
                    // Загрузка типа
                    document.getElementById('artist_type').value = artist.artist_type || 'solo';

                    pictureUrlInput.value = artist.picture_url || '';
                    document.getElementById('formed_year').value = artist.formed_year || '';
                    document.getElementById('origin_country').value = artist.origin_country || '';
                    document.getElementById('bio').value = artist.bio || '';
                    document.getElementById('description').value = artist.description || '';

                    if (artist.picture_url) {
                        currentPictureImg.src = artist.picture_url;
                        currentPictureImg.style.display = 'block';
                        noPictureText.style.display = 'none';
                    }
                } else {
                    alert('Исполнитель не найден.');
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Fetch error:', error);
            }
        }

        pictureUrlInput.addEventListener('input', () => {
            const url = pictureUrlInput.value.trim();
            if (url) {
                currentPictureImg.src = url;
                currentPictureImg.style.display = 'block';
                noPictureText.style.display = 'none';
            } else {
                currentPictureImg.style.display = 'none';
                noPictureText.style.display = 'block';
            }
        });

        const slug = getUrlParameter('slug');
        if (slug) {
            loadArtistData(slug);
        } else {
            alert('Не указан идентификатор.');
            window.location.href = '/';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const id = artistIdInput.value;
            const token = localStorage.getItem('token');

            const artistData = {
                name: formData.get('name'),
                artist_type: formData.get('artist_type'), // Отправляем тип
                picture_url: formData.get('picture_url'),
                formed_year: formData.get('formed_year'),
                origin_country: formData.get('origin_country'),
                bio: formData.get('bio'),
                description: formData.get('description'),
            };

            try {
                const response = await fetch(`/api/artist/${id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(artistData)
                });

                if (response.ok) {
                    const data = await response.json();
                    alert('Исполнитель успешно обновлен!');
                    window.location.href = `/artist/${data.slug || slug}`;
                } else {
                    alert('Ошибка при обновлении.');
                }
            } catch (error) {
                console.error(error);
                alert('Ошибка сети.');
            }
        });
    });
</script>
</body>
</html>
