<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edycja wykonawcy | MelodyRater</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/album_edit.css">
</head>
<body>
<div class="form-container">
    <div class="form-card edit-form-accent">
        <h1>Edycja wykonawcy</h1>
        <div id="picture-preview" style="text-align: center; margin-bottom: 20px;">
            <img id="current-picture" src="" alt="Zdjęcie wykonawcy" style="display: none; max-width: 200px; height: auto; border-radius: 5px;">
            <p id="no-picture-text">Brak zdjęcia</p>
        </div>

        <form id="editArtistForm">
            <input type="hidden" id="artist-identifier" name="artist-identifier">
            <input type="hidden" id="artist-id" name="artist-id">

            <div class="form-group">
                <label for="name">Nazwa wykonawcy*</label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="Wpisz nazwę wykonawcy">
            </div>

            <div class="form-group">
                <label for="artist_type">Typ wykonawcy</label>
                <select id="artist_type" name="artist_type" class="form-control">
                    <option value="solo">Artysta solowy (Osoba)</option>
                    <option value="group">Zespół / Grupa</option>
                </select>
            </div>

            <div class="form-group">
                <label for="picture_url">URL zdjęcia</label>
                <input type="text" id="picture_url" name="picture_url" class="form-control" placeholder="Link do zdjęcia">
            </div>

            <div class="form-group">
                <label for="formed_year">Rok założenia / urodzenia</label>
                <input type="text" id="formed_year" name="formed_year" class="form-control" placeholder="RRRR">
            </div>

            <div class="form-group">
                <label for="locations">Lokalizacje (oddzielone przecinkami)</label>
                <input type="text" id="locations" name="locations" class="form-control" placeholder="Londyn, Wielka Brytania, Warszawa">
            </div>

            <div class="form-group">
                <label for="bio">Biografia</label>
                <textarea id="bio" name="bio" class="form-control" rows="8" placeholder="Wpisz biografię (obsługa Markdown)"></textarea>
            </div>
            <button type="submit" class="button">Zapisz zmiany</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        async function enforceAdminAccess() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Autoryzacja jest wymagana do edycji.');
                window.location.href = '/login.html';
                return false;
            }
            try {
                const res = await fetch('/api/users/me', { headers: { 'Authorization': `Bearer ${token}` }});
                if (!res.ok) throw new Error('Nie udało się pobrać danych użytkownika');
                const user = await res.json();
                if (user.role !== 'admin') {
                    alert('Brak uprawnień administratora.');
                    window.location.href = '/';
                    return false;
                }
                return true;
            } catch(e) {
                console.error(e);
                window.location.href = '/login.html';
                return false;
            }
        }

        if (!await enforceAdminAccess()) return;

        const form = document.getElementById('editArtistForm');
        const artistIdInput = document.getElementById('artist-id');
        const pictureUrlInput = document.getElementById('picture_url');
        const currentPictureImg = document.getElementById('current-picture');
        const noPictureText = document.getElementById('no-picture-text');

        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        async function loadArtistData(identifier) {
            try {
                const response = await fetch(`/api/artist/${identifier}`);
                if (response.ok) {
                    const data = await response.json();
                    const artist = data.artist;

                    document.getElementById('artist-identifier').value = artist.slug;
                    artistIdInput.value = artist.id;
                    document.getElementById('name').value = artist.name || '';
                    document.getElementById('artist_type').value = artist.artist_type || 'solo';
                    pictureUrlInput.value = artist.picture_url || '';
                    document.getElementById('formed_year').value = artist.formed_year || '';

                    if (artist.locations && Array.isArray(artist.locations)) {
                        document.getElementById('locations').value = artist.locations.join(', ');
                    }

                    document.getElementById('bio').value = artist.bio || '';

                    if (artist.picture_url) {
                        currentPictureImg.src = artist.picture_url;
                        currentPictureImg.style.display = 'block';
                        noPictureText.style.display = 'none';
                    }
                } else {
                    alert('Wykonawca nie został znaleziony.');
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Błąd pobierania:', error);
            }
        }

        pictureUrlInput.addEventListener('input', () => {
            const url = pictureUrlInput.value.trim();
            if (url) {
                currentPictureImg.src = url;
                currentPictureImg.style.display = 'block';
                noPictureText.style.display = 'none';
            } else {
                currentPictureImg.style.display = 'none';
                noPictureText.style.display = 'block';
            }
        });

        const slug = getUrlParameter('slug');
        if (slug) {
            loadArtistData(slug);
        } else {
            alert('Brak identyfikatora.');
            window.location.href = '/';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const id = artistIdInput.value;
            const token = localStorage.getItem('token');

            const locationsRaw = formData.get('locations');
            const locationsArray = locationsRaw
                ? locationsRaw.split(',').map(s => s.trim()).filter(s => s.length > 0)
                : [];

            const artistData = {
                name: formData.get('name'),
                artist_type: formData.get('artist_type'),
                picture_url: formData.get('picture_url'),
                formed_year: formData.get('formed_year'),
                locations: locationsArray,
                bio: formData.get('bio'),
            };

            try {
                const response = await fetch(`/api/artist/${id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(artistData)
                });

                if (response.ok) {
                    const data = await response.json();
                    alert('Wykonawca pomyślnie zaktualizowany!');
                    window.location.href = `/artist/${data.slug || slug}`;
                } else {
                    const err = await response.json();
                    alert('Błąd aktualizacji: ' + (err.error || 'Nieznany błąd'));
                }
            } catch (error) {
                console.error(error);
                alert('Błąd sieci.');
            }
        });
    });
</script>
</body>
</html>
