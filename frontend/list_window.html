<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить в список</title>
    <style>
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .list-window {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            color: #ddd;
            font-family: Arial, sans-serif;
        }

        .list-tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
        }
        .list-tab-button {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            background: none;
            border: none;
            color: #ccc;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        .list-tab-button.active {
            background: #00ffcc;
            color: #1a1a1a;
            border-radius: 6px 6px 0 0;
        }

        .list-window h2 {
            margin-top: 0;
            text-align: center;
            font-weight: 700;
            color: #00ffcc;
        }

        .list-window label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: 600;
            color: #ccc;
        }

        .list-window input[type="text"],
        .list-window textarea {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }

        .list-window .action-buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .list-window button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .save-button {
            background: #00ffcc;
            color: #1a1a1a;
        }
        .cancel-button {
            background: #444;
            color: #ddd;
            margin-right: 10px;
        }

        .list-item {
            background: #2a2a2a;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .list-item.selected {
            background: #00ffcc;
            color: #1a1a1a;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="overlay" id="list-overlay">
    <div class="list-window">
        <div class="list-tabs">
            <button class="list-tab-button active" data-target="existing-lists">Существующие списки</button>
            <button class="list-tab-button" data-target="new-list-form">Новый список</button>
        </div>

        <div id="existing-lists" class="list-tab-content">
            <h2>Выберите список</h2>
            <div id="lists-container"></div>
            <div class="action-buttons">
                <button class="save-button" onclick="addAlbumToList()">Добавить</button>
                <button class="cancel-button" onclick="closeListWindow()">Отмена</button>
            </div>
        </div>

        <div id="new-list-form" class="list-tab-content" style="display: none;">
            <h2>Создать новый список</h2>
            <label for="list-name">Название</label>
            <input type="text" id="list-name" placeholder="Название списка">
            <label for="list-description">Описание</label>
            <textarea id="list-description" rows="4" placeholder="Краткое описание"></textarea>
            <div class="action-buttons">
                <button class="save-button" onclick="saveNewList()">Сохранить</button>
                <button class="cancel-button" onclick="closeListWindow()">Отмена</button>
            </div>
        </div>
    </div>
</div>

<script>
    // переключение вкладок
    document.querySelectorAll(".list-tab-button").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".list-tab-button").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");

            const target = btn.dataset.target;
            document.querySelectorAll(".list-tab-content").forEach(content => {
                content.style.display = "none";
            });
            document.getElementById(target).style.display = "block";
        });
    });
</script>

<script src="/js/lists1.js"></script>
</body>
</html>
