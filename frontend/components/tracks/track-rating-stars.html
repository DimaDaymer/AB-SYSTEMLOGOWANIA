<div id="track-rating-component-host"></div>


<script>
    (function() {
        // Проверка: StarRating должен быть загружен глобально
        if (typeof StarRating === 'undefined') return;

        const container = document.getElementById('track-rating-component-host');
        if (!container) return;

        // Создаем экземпляр StarRating
        const ratingInstance = new StarRating(container, {
            showValue: true,
            clearableText: '×'
        });

        // Слушаем изменения от UI (когда юзер кликает)
        ratingInstance.container.addEventListener('ratingChanged', (e) => {
            const newRating = e.detail.rating;
            if (newRating === 0) {
                if (window.clearTrackRating) window.clearTrackRating();
            } else {
                if (window.rateTrack) window.rateTrack(newRating);
            }
        });

        // Регистрируем компонент, чтобы track.html мог его обновлять
        window.components = window.components || {};
        window.components.trackRatingStars = {
            updateRating: (rating) => {
                ratingInstance.setValue(rating || 0);
            }
        };

        // Ставим начальное значение, если оно уже было загружено
        if (typeof window.currentTrackRating === 'number') {
            ratingInstance.setValue(window.currentTrackRating);
        }
    })();
</script>
