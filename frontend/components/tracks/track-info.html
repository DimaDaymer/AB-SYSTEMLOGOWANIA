<div class="album-info" id="track-header-info">
    <h1 class="album-title" id="track-title">Loading...</h1>

    <div class="album-meta">
        <div class="track-main-row">
            <p class="track-album-info">
                <strong>Song:<br> #<span id="track-number">?</span></strong>
                from album <strong><a href="#" id="track-album-link" class="album-link-inline">Loading...</a></strong>
            </p>
        </div>

        <span><strong>Artist:</strong> <span id="track-artist"></span></span>
        <span><strong>Duration:</strong> <span id="track-duration"></span></span>
        <span><strong>Release Date:</strong> <br><a href="#" id="track-date-link">N/A</a></span>
        <span><strong>Genres:</strong> <span id="track-genres"></span></span>
        <span><strong>Descriptors:</strong> <span id="track-descriptors"></span></span>
        <span><strong>Language:</strong> <span id="track-languages"></span></span>

        <div id="track-rank-container" style="display: none; margin-top: 15px; padding-top: 10px; border-top: 1px solid #444;">
            <strong>Ranked:</strong>
            <div id="track-rank-list" style="display: flex; flex-direction: column; gap: 4px; margin-top: 5px;"></div>
        </div>
    </div>
</div>

<script>
    window.components = window.components || {};

    const setTrackText = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
    };

    const getArray = (data) => {
        if (Array.isArray(data)) return data.filter(s => s && s.length > 0);
        if (typeof data === 'string') return data.split(',').map(s => s.trim()).filter(s => s.length > 0);
        return [];
    };

    function createTrackLinks(containerId, dataArray, paramName, defaultText = 'N/A') {
        const container = document.getElementById(containerId);
        if (!container) return false;
        const elements = getArray(dataArray);
        if (elements.length > 0) {
            container.innerHTML = elements.map(item =>
                `<a href="/chart-page.html?type=tracks&${paramName}=${encodeURIComponent(item)}&sort=rating">${item}</a>`
            ).join(', ');
            return true;
        } else {
            container.textContent = defaultText;
            return false;
        }
    }

    window.components.trackInfo = {
        update: (data) => {
            if (!data) return;

            // 1. Основная информация
            setTrackText('track-title', data.title || 'Unknown Track');
            setTrackText('track-number', data.track_number || '?');
            setTrackText('track-duration', data.duration || 'N/A');

            // 2. Ссылка на альбом
            const albumLink = document.getElementById('track-album-link');
            if (albumLink) {
                albumLink.textContent = data.album_title || 'Unknown Album';
                albumLink.href = data.album_slug ? `/release/album/${data.album_slug}` : '#';
            }

            // 3. Артисты
            const artistContainer = document.getElementById('track-artist');
            if (artistContainer) {
                if (data.artists && data.artists.length > 0) {
                    artistContainer.innerHTML = data.artists.map(a =>
                        `<a href="/artist/${a.slug}">${a.name}</a>`
                    ).join(', ');
                } else if (data.artist_name) {
                    artistContainer.innerHTML = `<a href="/artist/${data.artist_slug || '#'}">${data.artist_name}</a>`;
                } else {
                    artistContainer.textContent = 'Unknown Artist';
                }
            }

            // 4. Списки (Жанры, Дескрипторы, Языки)
            createTrackLinks('track-genres', data.genres, 'genres');
            createTrackLinks('track-descriptors', data.descriptors, 'description');
            createTrackLinks('track-languages', data.languages, 'language');

            // 5. Дата релиза
            const dateLink = document.getElementById('track-date-link');
            if (dateLink && data.release_date) {
                const year = new Date(data.release_date).getFullYear();
                const datePart = data.release_date.split('T')[0];
                dateLink.textContent = datePart;
                dateLink.href = `/chart-page.html?type=tracks&year=${year}&sort=rating#${data.slug}`;
            }

            // 6. Рейтинг (Ранк)
            const rankContainer = document.getElementById('track-rank-container');
            const rankList = document.getElementById('track-rank-list');
            if (rankContainer && rankList) {
                let ranksHTML = [];
                if (data.rank_general) {
                    const url = `/chart-page.html?type=tracks&sort=rating#${data.slug}`;
                    ranksHTML.push(`<div><a href="${url}" style="color: #adff2f; font-weight: bold;">#${data.rank_general} in General Chart</a></div>`);
                }
                if (ranksHTML.length > 0) {
                    rankList.innerHTML = ranksHTML.join('');
                    rankContainer.style.display = 'block';
                } else {
                    rankContainer.style.display = 'none';
                }
            }
        }
    };
</script>
