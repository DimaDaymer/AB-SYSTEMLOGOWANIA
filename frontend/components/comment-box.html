<link rel="stylesheet" href="/css/comments.css">

<div class="comment-section-wrapper" id="comments-system-root">
    <div class="comment-header">
        <h3>Komentarze użytkowników</h3>
        <div class="sort-controls">
            <select class="sort-select">
                <option value="newest">Najnowsze</option>
                <option value="popular">Popularne</option>
            </select>
        </div>
    </div>

    <div class="comment-input-area">
        <div class="input-wrapper">
            <textarea class="comment-textarea main-input" placeholder="Napisz coś na tej tablicy..."></textarea>
            <button class="post-btn main-post-btn">Opublikuj</button>
        </div>
    </div>

    <div class="comments-list"></div>
    <div class="pagination"></div>
</div>

<div class="thread-overlay" id="thread-overlay-shared">
    <div class="thread-modal">
        <div class="thread-header">
            <span>Wątek</span>
            <span class="close-thread" id="thread-close-btn">&times;</span>
        </div>
        <div class="thread-body" id="thread-content-shared"></div>
        <div class="thread-footer">
            <div class="input-wrapper">
                <textarea class="comment-textarea" id="thread-reply-input" placeholder="Napisz odpowiedź..." style="min-height:40px;"></textarea>
                <button class="post-btn" id="thread-send-btn">Odpowiedz</button>
            </div>
        </div>
    </div>
</div>
