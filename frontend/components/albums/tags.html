<div class="album-tags-section">
    <div id="album-tags-list" class="tags-cloud">
    </div>
    <div id="tags-empty-message" style="display: none; color: #777; padding: 20px;">
        Brak tagów użytkowników. Bądź pierwszym, który go doda!
    </div>
</div>

<style>
    .tags-cloud {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px 0;
    }
    .user-tag-item {
        background: rgba(0, 255, 204, 0.1);
        border: 1px solid #00ffcc;
        color: #00ffcc;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.9rem;
        cursor: default;
        transition: transform 0.2s;
    }
    .user-tag-item:hover {
        transform: translateY(-2px);
        background: rgba(0, 255, 204, 0.2);
    }
</style>

<script>
    window.renderAlbumTagsTab = async function(albumId) {
        const listContainer = document.getElementById('album-tags-list');
        const emptyMsg = document.getElementById('tags-empty-message');

        if (!listContainer) return;

        try {
            const res = await fetch(`/api/tags/album-public/${albumId}`);
            if (!res.ok) throw new Error('Nie udało się załadować tagów');

            const tags = await res.json();

            if (!tags || tags.length === 0) {
                listContainer.innerHTML = '';
                emptyMsg.style.display = 'block';
                return;
            }

            emptyMsg.style.display = 'none';
            listContainer.innerHTML = tags.map(tag => {
                const tagName = typeof tag === 'object' ? (tag.name || tag.tag_name) : tag;
                if (!tagName) return '';
                return `<div class="user-tag-item">${tagName}</div>`;
            }).join('');

        } catch (error) {
            console.error('Błąd renderowania tagów:', error);
            listContainer.innerHTML = '<p style="color:red;">Błąd ładowania tagów</p>';
        }
    };
</script>
