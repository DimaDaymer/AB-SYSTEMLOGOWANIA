<div id="album-rating-component-host"></div>

<script>
    (function() {
        if (typeof StarRating === 'undefined') return;

        const container = document.getElementById('album-rating-component-host');
        if (!container) return;

        const ratingInstance = new StarRating(container, {
            showValue: true,
            clearableText: '×'
        });

        ratingInstance.container.addEventListener('ratingChanged', (e) => {
            const newRating = e.detail.rating;
            if (newRating === 0) {
                if (window.clearAlbumRating) window.clearAlbumRating();
            } else {
                if (window.rateAlbum) window.rateAlbum(newRating);
            }
        });

        window.components = window.components || {};
        window.components.albumRatingStars = {
            updateRating: (rating) => {
                ratingInstance.setValue(rating || 0);
            }
        };

        if (typeof window.currentAlbumRating === 'number') {
            ratingInstance.setValue(window.currentAlbumRating);
        }
    })();
</script>
