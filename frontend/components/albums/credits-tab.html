// credits-tab.html
<style>
    .credits-tab {
        padding: 15px;
    }

    .credits-container {
        color: #bbb;
    }

    .credit-item {
        margin-bottom: 15px;
        padding-bottom: 15px;
        border-bottom: 1px solid #333;
    }

    .credit-role {
        font-weight: 600;
        color: #00ffcc;
        margin-bottom: 5px;
    }

    .credit-names {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .credit-name {
        padding: 5px 10px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        transition: background 0.2s ease;
    }

    .credit-name:hover {
        background: rgba(0, 255, 204, 0.2);
    }

    .loading {
        text-align: center;
        padding: 20px;
        color: #aaa;
        font-style: italic;
    }

    .error-message {
        color: #ff6b6b;
        padding: 10px;
        background: rgba(255, 0, 0, 0.1);
        border-radius: 4px;
        margin-top: 10px;
    }
</style>

<script>
    window.components = window.components || {};
    window.components.creditsTab = {
        loaded: false,

        load: async function (albumId) {
            if (this.loaded || !albumId) return;

            const container = document.querySelector('.credits-container');
            if (!container) return;

            container.innerHTML = '<div class="loading">Loading credits...</div>';

            try {
                const response = await fetch(`/api/albums/${albumId}/credits`);
                if (!response.ok) {
                    throw new Error('Failed to load credits');
                }

                const credits = await response.json();
                this.loaded = true;

                if (credits.length === 0) {
                    container.innerHTML = '<div class="loading">No credits information available</div>';
                    return;
                }

                // Group credits by role
                const groupedCredits = {};
                credits.forEach(credit => {
                    if (!groupedCredits[credit.role]) {
                        groupedCredits[credit.role] = [];
                    }
                    groupedCredits[credit.role].push(credit.name);
                });

                // Display grouped credits
                container.innerHTML = '';
                Object.entries(groupedCredits).forEach(([role, names]) => {
                    const creditItem = document.createElement('div');
                    creditItem.className = 'credit-item';

                    const roleElement = document.createElement('div');
                    roleElement.className = 'credit-role';
                    roleElement.textContent = role;

                    const namesContainer = document.createElement('div');
                    namesContainer.className = 'credit-names';

                    names.forEach(name => {
                        const nameElement = document.createElement('div');
                        nameElement.className = 'credit-name';
                        nameElement.textContent = name;
                        namesContainer.appendChild(nameElement);
                    });

                    creditItem.appendChild(roleElement);
                    creditItem.appendChild(namesContainer);
                    container.appendChild(creditItem);
                });
            } catch (error) {
                console.error('Error loading credits:', error);
                container.innerHTML = `
          <div class="error-message">
            Failed to load credits: ${error.message}
          </div>
        `;
            }
        }
    };
</script>
