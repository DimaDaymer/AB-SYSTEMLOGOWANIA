<div class="media-links-wrapper" style="margin-top: 20px;">
    <div id="media-links-list" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
</div>

<script>
    window.components = window.components || {};
    window.components.mediaLinks = {
        update: async function(albumId) {
            const container = document.getElementById('media-links-list');
            if(!container || !albumId) return;

            try {
                // Fetch from the NEW route we added in Step 2
                const res = await fetch(`/api/albums/${albumId}/links`);
                if(!res.ok) throw new Error('Failed to load links');

                const links = await res.json();

                if (links.length === 0) {
                    container.innerHTML = '';
                    return;
                }

                container.innerHTML = links.map(link => `
                    <a href="${link.url}" target="_blank" class="media-btn ${link.platform_name.toLowerCase()}"
                       style="padding: 5px 10px; background: #333; color: white; border-radius: 4px; text-decoration: none; font-size: 0.9rem;">
                        ${link.platform_name}
                    </a>
                `).join('');
            } catch (e) {
                console.error('Media links error:', e);
            }
        }
    };
</script>
