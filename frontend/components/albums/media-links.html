<div class="media-links-section">
    <div class="media-header">
        <h3 class="section-title">Posłuchaj na</h3>
        <button id="edit-media-links-btn" class="admin-only-btn" style="display: none;" onclick="window.components.mediaLinks.open()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </button>
    </div>

    <div id="media-links-display" class="links-grid"></div>

    <div id="media-modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h4>Ustawienia linków streamingowych</h4>
            <div class="input-list">
                <div class="field"><label>Spotify</label><input type="text" id="inp-spotify"></div>
                <div class="field"><label>SoundCloud</label><input type="text" id="inp-soundcloud"></div>
                <div class="field"><label>Deezer</label><input type="text" id="inp-deezer"></div>
                <div class="field"><label>YouTube</label><input type="text" id="inp-youtube"></div>
                <div class="field"><label>YouTube Music</label><input type="text" id="inp-ytmusic"></div>
            </div>
            <div class="modal-footer">
                <button onclick="window.components.mediaLinks.save()" class="save-btn">Zapisz</button>
                <button onclick="window.components.mediaLinks.close()" class="cancel-btn">Zamknij</button>
            </div>
        </div>
    </div>
</div>

<style>
    .media-links-section { margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
    .media-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-title { font-size: 0.85rem; text-transform: uppercase; color: #888; margin: 0; letter-spacing: 0.5px; }
    .links-grid { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; min-height: 35px; }
    .media-link-item img { width: 30px; height: 30px; transition: transform 0.2s; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    .media-link-item:hover img { transform: translateY(-3px); }
    .admin-only-btn { background: none; border: none; color: #ADFF2F; cursor: pointer; opacity: 0.6; padding: 4px; }
    .admin-only-btn:hover { opacity: 1; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-content { background: #1a1a1a; padding: 25px; border-radius: 12px; width: 350px; border: 1px solid #333; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; text-transform: uppercase; }
    .field input { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; box-sizing: border-box; outline: none; }
    .field input:focus { border-color: #ADFF2F; }
    .save-btn { background: #ADFF2F; color: #000; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .cancel-btn { background: none; border: none; color: #aaa; cursor: pointer; margin-left: 10px; }
</style>

<script>
    (function() {
        const PLATFORMS = {
            spotify: { icon: '/img/platforms/spotify.png' },
            soundcloud: { icon: '/img/platforms/soundcloud.png' },
            deezer: { icon: '/img/platforms/deezer.png' },
            youtube: { icon: '/img/platforms/youtube.png' },
            ytmusic: { icon: '/img/platforms/ytmusic.png' }
        };

        window.components.mediaLinks = {
            albumId: null,
            links: [],

            update(albumId, initialLinks = []) {
                this.albumId = albumId;
                this.links = Array.isArray(initialLinks) ? initialLinks : [];
                this.render();
                this.checkAdmin();
            },

            render() {
                const container = document.getElementById('media-links-display');
                if (!container) return;

                if (this.links.length === 0) {
                    container.innerHTML = '<span style="color: #444; font-size: 0.8rem;">Brak dostępnych linków</span>';
                    return;
                }

                container.innerHTML = this.links.map(l => {
                    const p = PLATFORMS[l.platform_id];
                    if (!p) return '';
                    return `<a href="${l.url}" target="_blank" class="media-link-item"><img src="${p.icon}" alt="${l.platform_id}"></a>`;
                }).join('');
            },

            async checkAdmin() {
                const token = localStorage.getItem('token');
                if (!token) return;
                try {
                    const res = await fetch('/api/users/me', { headers: { 'Authorization': `Bearer ${token}` }});
                    const user = await res.json();
                    const btn = document.getElementById('edit-media-links-btn');
                    if (btn && user.role === 'admin') btn.style.display = 'block';
                } catch(e) {}
            },

            open() {
                document.getElementById('media-modal-overlay').style.display = 'flex';
                Object.keys(PLATFORMS).forEach(id => {
                    const val = this.links.find(l => l.platform_id === id)?.url || '';
                    document.getElementById(`inp-${id}`).value = val;
                });
            },

            close() { document.getElementById('media-modal-overlay').style.display = 'none'; },

            async save() {
                const updatedLinks = Object.keys(PLATFORMS).map(id => ({
                    platform_id: id,
                    url: document.getElementById(`inp-${id}`).value.trim()
                })).filter(l => l.url !== '');

                try {
                    const res = await fetch(`/api/albums/${this.albumId}/links`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ links: updatedLinks })
                    });

                    if (res.ok) {
                        this.links = updatedLinks;
                        this.render();
                        this.close();
                        if (window.showMessage) showMessage('Linki zostały zaktualizowane!');
                    }
                } catch (e) { console.error(e); }
            }
        };
    })();
</script>
