<div class="histogram-wrapper" style="margin-top: 20px;">
    <h3 id="histogram-title" style="font-size: 1rem; color: #aaa; margin-bottom: 10px;">Rozkład ocen</h3>
    <div id="histogram-bars">Ładowanie...</div>
</div>

<style>
    .hist-row { display: flex; align-items: center; margin-bottom: 4px; font-size: 0.8rem; }
    .hist-label { width: 30px; text-align: right; margin-right: 8px; color: #fbf2f2; }
    .hist-bar-bg { flex-grow: 1; background: #333; height: 8px; border-radius: 4px; overflow: hidden; }
    .hist-bar-fill { height: 100%; background: #00e5ff; transition: width 0.3s ease; }
    .hist-count { width: 40px; text-align: left; margin-left: 8px; color: #777; font-size: 0.75rem;}
</style>

<script>
    window.components = window.components || {};
    window.components.histogram = {
        update: async function(id, type = 'album') {
            const container = document.getElementById('histogram-bars');
            if(!container || !id) return;

            try {
                let endpoint;
                switch(type) {
                    case 'track': endpoint = `/api/track-ratings/${id}/histogram`; break;
                    case 'album':
                    default: endpoint = `/api/ratings/album/${id}/histogram`;
                }

                const res = await fetch(endpoint);
                if(!res.ok) throw new Error('Nie udało się załadować histogramu');

                const data = await res.json();
                if (!Array.isArray(data)) throw new Error('Błędny format danych');

                const ratings = data.map(r => ({
                    score: parseFloat(r.score),
                    count: parseInt(r.count)
                }));

                const total = ratings.reduce((acc, row) => acc + row.count, 0);

                let html = '';
                const scores = [5, 4.5, 4, 3.5, 3, 2.5, 2, 1.5, 1, 0.5];

                scores.forEach(score => {
                    const row = ratings.find(r => r.score === score);
                    const count = row ? row.count : 0;
                    const percent = total > 0 ? (count / total) * 100 : 0;

                    html += `
                        <div class="hist-row">
                            <div class="hist-label">${score}</div>
                            <div class="hist-bar-bg">
                                <div class="hist-bar-fill" style="width: ${percent}%;"></div>
                            </div>
                            <div class="hist-count">${count}</div>
                        </div>
                    `;
                });

                container.innerHTML = total > 0 ? html : '<div style="color:#666; font-style:italic; font-size: 0.8rem;">Brak ocen</div>';
            } catch (e) {
                console.error('Błąd histogramu:', e);
                container.innerHTML = '<div style="color:red; font-size: 0.8rem;">Błąd ładowania</div>';
            }
        }
    };
</script>
