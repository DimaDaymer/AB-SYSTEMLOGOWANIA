<script>
  window.components = window.components || {};
  window.components.histogram = {
    update: function(histogramData) {
      const bars = document.querySelectorAll('.bar-line');
      histogramData.forEach((data, index) => {
        if (bars[index]) {
          bars[index].style.width = `${data.percentage}%`;
          bars[index].dataset.count = `${data.count.toLocaleString()} ratings`;
        }
      });
    }
  };
</script>
