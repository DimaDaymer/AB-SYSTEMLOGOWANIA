<link rel="stylesheet" href="/css/credits-members.css">

<div class="cm-module" id="album-credits-module">
    <div class="cm-header">
        <h3 id="credits-title">Twórcy albumu</h3>
        <button id="btn-edit-credits" class="icon-btn" style="display: none;" title="Edytuj twórców">✎</button>
    </div>

    <div id="credits-list" class="cm-list">
        <div class="cm-placeholder">Ładowanie twórców...</div>
    </div>

    <div id="credits-editor" class="cm-editor" style="display: none;">
        <div class="editor-row">
            <div class="input-wrapper">
                <input type="text" id="credit-artist-input" class="cm-input" placeholder="Nazwa artysty..." autocomplete="off">
                <div id="credit-artist-suggestions" class="suggestions-box"></div>
            </div>

            <div class="input-wrapper">
                <input type="text" id="credit-role-input" class="cm-input" placeholder="Rola (np. Gitara)..." autocomplete="off">
                <div id="credit-role-suggestions" class="suggestions-box"></div>
            </div>
        </div>

        <div class="editor-row" style="justify-content: flex-end;">
            <button id="btn-add-credit" class="cm-btn-add">Dodaj</button>
        </div>
        <button id="btn-close-credits-editor" class="cm-btn-close">Zakończ edycję</button>
    </div>
</div>

<script>
    // frontend/js/album-credits.js
    (function() {
        let albumId = null;
        let isEditing = false;
        let currentCredits = [];
        const token = localStorage.getItem('token');

        // Główna funkcja inicjalizacji (wywoływana z handleAlbumAction.js lub renderAlbums.js)
        window.initCreditsModule = async (id) => {
            albumId = id;
            currentCredits = await fetchCredits(albumId);
            renderCredits(currentCredits);

            await setupAdminFeatures();
        };

        const fetchCredits = async (id) => {
            try {
                const res = await fetch(`/api/credits/album/${id}`);
                return res.ok ? await res.json() : [];
            } catch (e) {
                console.error(e);
                return [];
            }
        };

        const renderCredits = (data) => {
            const listEl = document.getElementById('credits-list');
            if (!data || data.length === 0) {
                listEl.innerHTML = '<div class="cm-placeholder">Brak informacji o twórcach.</div>';
                return;
            }

            listEl.innerHTML = data.map(c => `
            <div class="cm-item">
                <span class="cm-artist-name">
                    <a href="/artist.html?slug=${c.artist_slug}">${c.artist_name}</a>
                </span>
                <span class="cm-role">${c.role_name || 'Nieznana rola'}</span>
                ${isEditing ? `<button class="delete-btn" onclick="window.deleteAlbumCredit(${c.id})">×</button>` : ''}
            </div>
        `).join('');
        };

        const setupAdminFeatures = async () => {
            if (!token) return;
            try {
                const userRes = await fetch('/api/users/me', { headers: { 'Authorization': `Bearer ${token}` }});
                if (!userRes.ok) return;
                const user = await userRes.json();

                if (user.role === 'admin') {
                    const btnEdit = document.getElementById('btn-edit-credits');
                    const btnClose = document.getElementById('btn-close-credits-editor');
                    const editor = document.getElementById('credits-editor');
                    const btnAdd = document.getElementById('btn-add-credit');

                    btnEdit.style.display = 'block';

                    const toggleEditor = () => {
                        isEditing = !isEditing;
                        editor.style.display = isEditing ? 'block' : 'none';
                        renderCredits(currentCredits); // Ponowne renderowanie, aby pokazać/ukryć przyciski usuwania
                    };

                    btnEdit.onclick = toggleEditor;
                    btnClose.onclick = toggleEditor;

                    // Konfiguracja autouzupełniania
                    setupAutocomplete('credit-artist-input', 'credit-artist-suggestions', 'search-artists');
                    setupAutocomplete('credit-role-input', 'credit-role-suggestions', 'search-roles');

                    // Dodawanie twórcy
                    btnAdd.onclick = async () => {
                        const artistName = document.getElementById('credit-artist-input').value;
                        const roleName = document.getElementById('credit-role-input').value;

                        if(!artistName || !roleName) return alert('Proszę wypełnić oba pola');

                        const res = await fetch('/api/credits', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                            body: JSON.stringify({ albumId, artistName, roleName })
                        });

                        if (res.ok) {
                            document.getElementById('credit-artist-input').value = '';
                            document.getElementById('credit-role-input').value = '';
                            currentCredits = await fetchCredits(albumId);
                            renderCredits(currentCredits);
                        } else {
                            alert('Błąd podczas dodawania twórcy');
                        }
                    };
                }
            } catch (e) { console.error("Weryfikacja uprawnień nie powiodła się", e); }
        };

        // Funkcja autouzupełniania
        const setupAutocomplete = (inputId, suggId, endpoint) => {
            const input = document.getElementById(inputId);
            const suggestionsBox = document.getElementById(suggId);
            if (!input || !suggestionsBox) return;

            let timeout;

            input.oninput = () => {
                clearTimeout(timeout);
                const q = input.value.trim();
                if (q.length < 2) { suggestionsBox.style.display = 'none'; return; }

                timeout = setTimeout(async () => {
                    const res = await fetch(`/api/credits/${endpoint}?q=${encodeURIComponent(q)}`);
                    const data = await res.json();
                    if (data.length > 0) {
                        suggestionsBox.innerHTML = data.map(item => `<div class="suggestion-item">${item.name}</div>`).join('');
                        suggestionsBox.style.display = 'block';
                        suggestionsBox.querySelectorAll('.suggestion-item').forEach(el => {
                            el.onclick = () => {
                                input.value = el.textContent;
                                suggestionsBox.style.display = 'none';
                            };
                        });
                    } else { suggestionsBox.style.display = 'none'; }
                }, 300);
            };

            // Zamykanie przy kliknięciu poza polem
            document.addEventListener('click', (e) => {
                if (!input.contains(e.target) && !suggestionsBox.contains(e.target)) {
                    suggestionsBox.style.display = 'none';
                }
            });
        };

        // Globalna funkcja usuwania
        window.deleteAlbumCredit = async (id) => {
            if (!confirm('Czy na pewno chcesz usunąć te informacje?')) return;
            const res = await fetch(`/api/credits/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            });
            if (res.ok) {
                currentCredits = await fetchCredits(albumId);
                renderCredits(currentCredits);
            }
        };
    })();

</script>
