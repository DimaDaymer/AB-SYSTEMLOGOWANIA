<div class="tracklist">
    <h3>Lista utworów</h3>
    <div id="tracks-container"></div>
    <p id="total-length"></p>
</div>

<script>
    window.components = window.components || {};
    window.components.tracklist = {
        update: function (tracks) {
            const tracksContainer = document.getElementById('tracks-container');
            const totalLengthEl = document.getElementById('total-length');

            if (!tracksContainer) return;

            tracksContainer.innerHTML = '';
            let totalSeconds = 0;

            if (tracks && tracks.length > 0) {
                tracks.forEach(track => {
                    const trackEl = document.createElement('div');
                    trackEl.className = 'track';

                    let avgScoreHtml = '';
                    const ratingCount = parseInt(track.rating_count || 0);
                    const avgRating = parseFloat(track.average_rating || 0);

                    if (ratingCount > 0) {
                        avgScoreHtml = `
                            <div class="track-avg-rating" title="Średnia ocena na podstawie ${ratingCount} głosów">
                                <span class="avg-val">${avgRating.toFixed(2)}</span>
                                <span class="avg-count">(${ratingCount})</span>
                            </div>
                        `;
                    }

                    const trackLink = `/track/${track.slug}`;

                    trackEl.innerHTML = `
                        <div class="track-info">
                            <div class="track-title-row">
                                <a href="${trackLink}" class="track-title-link">
                                    <span class="track-title-num">${track.track_number || ''}. ${track.title}</span>
                                </a>
                            </div>
                            ${avgScoreHtml}
                        </div>
                        <span class="track-duration">${track.duration || ''}</span>
                    `;
                    tracksContainer.appendChild(trackEl);

                    if (track.duration && track.duration.includes(':')) {
                        const parts = track.duration.split(':').map(Number);
                        if(parts.length === 2) {
                            totalSeconds += parts[0] * 60 + parts[1];
                        } else if (parts.length === 3) {
                            totalSeconds += parts[0] * 3600 + parts[1] * 60 + parts[2];
                        }
                    }
                });

                if (totalLengthEl && totalSeconds > 0) {
                    const hours = Math.floor(totalSeconds / 3600);
                    const mins = Math.floor((totalSeconds % 3600) / 60);
                    const secs = totalSeconds % 60;

                    let timeStr = hours > 0 ? `${hours}:` : '';
                    timeStr += `${hours > 0 && mins < 10 ? '0' + mins : mins}:${secs < 10 ? '0' + secs : secs}`;

                    totalLengthEl.textContent = `Całkowity czas: ${timeStr}`;
                    totalLengthEl.style.display = 'block';
                }
            } else {
                tracksContainer.innerHTML = '<p>Brak dostępnych utworów</p>';
                if (totalLengthEl) totalLengthEl.style.display = 'none';
            }
        }
    };
</script>
