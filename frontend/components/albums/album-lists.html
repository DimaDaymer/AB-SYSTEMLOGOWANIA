<div id="album-lists-content" style="padding-top: 5px;">
    <div id="album-lists-list-container">
        <p>Загрузка списков...</p>
    </div>

    <div id="album-lists-footer" style="padding-top: 15px; text-align: center;"></div>
</div>

<script>
    (async function() {
        const container = document.getElementById('album-lists-list-container');
        const footer = document.getElementById('album-lists-footer');
        const LIST_LIMIT = 5;
        let currentPage = 1;
        let albumId = window.currentAlbumId;

        function renderPagination(totalLists) {
            footer.innerHTML = '';
            const totalPages = Math.ceil(totalLists / LIST_LIMIT);

            if (totalPages <= 1) {
                return;
            }

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.textContent = i;

                pageBtn.style.cssText = `
                    margin: 0 5px;
                    padding: 5px 10px;
                    border: 1px solid ${i === currentPage ? '#007bff' : '#555'};
                    background-color: ${i === currentPage ? '#007bff' : 'transparent'};
                    color: ${i === currentPage ? '#fff' : '#ccc'};
                    cursor: pointer;
                    border-radius: 4px;
                    transition: background-color 0.2s;
                `;

                pageBtn.onmouseover = () => { if (i !== currentPage) pageBtn.style.backgroundColor = '#333'; };
                pageBtn.onmouseout = () => { if (i !== currentPage) pageBtn.style.backgroundColor = 'transparent'; };

                pageBtn.onclick = () => {
                    if (i !== currentPage) {
                        currentPage = i;
                        loadAlbumLists(albumId);
                        container.scrollIntoView({ behavior: 'smooth' });
                    }
                };
                footer.appendChild(pageBtn);
            }
        }

        if (!albumId) {
            const checkIdInterval = setInterval(() => {
                albumId = window.currentAlbumId;
                if (albumId) {
                    clearInterval(checkIdInterval);
                    loadAlbumLists(albumId);
                }
            }, 100);
            return;
        }

        async function loadAlbumLists(albumId) {
            if (!albumId) {
                container.innerHTML = '<p class="error" style="color:#ff4d4d; font-size: 0.9em;">ID альбома не найден.</p>';
                return;
            }

            if (!window.ListApp || !window.ListApp.utils) {
                console.error('ListApp или ListApp.utils не инициализированы.');
                if(container) container.innerHTML = '<p class="error" style="color:#ff4d4d; font-size: 0.9em;">Ошибка загрузки (core/context).</p>';
                return;
            }

            const offset = (currentPage - 1) * LIST_LIMIT;
            const endpoint = `/api/user-lists/for-album/${albumId}?limit=${LIST_LIMIT}&offset=${offset}`;

            try {
                const response = await ListApp.utils.fetchAPI(endpoint, { method: 'GET' });
                const lists = response.lists;
                const totalLists = response.total;

                container.innerHTML = '';
                if (!lists || lists.length === 0) {
                    container.innerHTML = '<p class="empty-msg" style="color: #777; font-size: 0.9em;">Этот альбом пока не добавлен ни в один пользовательский список.</p>';
                } else {
                    lists.forEach(list => {
                        const albumCountText = list.albums_count ? `Альбомов: ${list.albums_count}` : 'Пустой список';
                        const creatorText = list.username ? ` от ${list.username}` : '';

                        const card = document.createElement('a');
                        card.className = 'list-card';
                        card.href = `/list.html?slug=${list.slug}`;
                        card.style.cssText = `display: inline-block; width: 100px; margin: 0 10px 10px 0; text-decoration: none;`;

                        card.innerHTML = `
                            <div class="list-cover" style="width: 100%; height: 100px; background: #222 url(${list.cover_url || '/img/default_list_cover.jpg'}) no-repeat center center; background-size: cover; border-radius: 4px; overflow: hidden; margin-bottom: 5px;"></div>
                            <div class="list-info">
                                <h4 style="margin: 0; font-size: 0.95em; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${list.name}</h4>
                                <p class="list-meta" style="margin: 0; font-size: 0.8em; color: #888;">${albumCountText}${creatorText}</p>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }

                renderPagination(totalLists);

            } catch (e) {
                console.error('Ошибка загрузки списков альбома (catch):', e);
                if (!container) return;
                let errorMsg = `❌ **Ошибка загрузки списков.** ${e.message || 'Неизвестная ошибка'}. Пожалуйста, проверьте консоль сервера.`;
                container.innerHTML = `<p class="error" style="color:#ff4d4d; font-size: 0.9em;">${errorMsg}</p>`;
                footer.innerHTML = '';
            }
        }
        loadAlbumLists(albumId);
    })();
</script>
