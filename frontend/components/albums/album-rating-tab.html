
<div className="album-rating-tab-content">
    <div id="album-rating-stars-container"></div>
</div>

<script>
    window.components = window.components || {};
    window.components.albumRatingTab = {
        init: function () {
            const starsContainer = document.getElementById('album-rating-stars-container');
            if (starsContainer && starsContainer.innerHTML === '') {
                window.loadComponent('album-rating-stars-container', '/components/albums/album-rating-stars.html');
            }
        }
    };

    document.addEventListener('click', async (e) => {
        const ratingStarsContainer = e.target.closest('.album-rating-stars');
        if (ratingStarsContainer) {
            // Находим ближайший input[type="radio"] к месту клика
            const ratingInput = e.target.closest('label')?.previousElementSibling;

            if (!ratingInput || ratingInput.tagName !== 'INPUT' || !window.currentAlbumId) {
                return;
            }

            const rating = parseFloat(ratingInput.value);
            if (window.rateAlbum) {
                await window.rateAlbum(rating);
                // После успешной отправки рейтинга обновляем отображение
                window.components.albumRatingStars.updateRating(rating);
            }
        }
    });

</script>
