<div id="track-ratings-container" class="track-ratings-list">
</div>

<style>
    .track-ratings-list {
        list-style-type: none;
        padding: 0;
        margin: 0;
    }
    .track-rating-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #333;
    }
    .track-info { flex-grow: 1; }

    .track-title {
        font-size: 16px;
        color: #ADFF2F;
    }
    .track-link {
        color: #ADFF2F;
        text-decoration: none;
        transition: color 0.2s;
    }
    .track-link:hover {
        color: #fff;
        text-decoration: underline;
    }

    .track-duration { font-size: 14px; color: #999; }

    .track-rating {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .track-rating-value {
        font-size: 16px;
        font-weight: bold;
        color: #ADFF2F;
        min-width: 55px;
        text-align: left;
    }
</style>

<script>
    window.components = window.components || {};

    window.components.trackRatingsTab = {
        update: function (tracks, userRatings) {
            const container = document.getElementById('track-ratings-container');
            if (!container) return;
            container.innerHTML = '';

            tracks.forEach(track => {
                const score = userRatings[track.id] || 0;

                const trackItem = document.createElement('li');
                trackItem.className = 'track-rating-item';
                trackItem.innerHTML = `
                <div class="track-info">
                    <div class="track-title">${track.track_number}. ${track.title}</div>
                </div>
                <div class="track-rating">
                    <div class="track-rating-value">${score > 0 ? score.toFixed(1) : '0.0'}/5</div>
                    <div class="track-star-rating-host"></div>
                </div>
            `;

                const starHost = trackItem.querySelector('.track-star-rating-host');
                const valueEl = trackItem.querySelector('.track-rating-value');

                const ratingInstance = new StarRating(starHost, { showValue: false });
                ratingInstance.setValue(score);

                ratingInstance.container.addEventListener('ratingChanged', (e) => {
                    const newScore = e.detail.rating;
                    valueEl.textContent = `${newScore.toFixed(1)}/5`;
                    newScore === 0 ? clearTrackRating(track.id) : saveTrackRating(track.id, newScore);
                });

                container.appendChild(trackItem);
            });
        }
    };

    async function saveTrackRating(trackId, rating) {
        try {
            const token = localStorage.getItem('token');
            if (!token) {
                window.showMessage('Zaloguj się, aby oceniać utwory', true);
                return;
            }
            const res = await fetch(`/api/track-ratings/${trackId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ rating })
            });
            if (!res.ok) throw new Error('Nie udało się zapisać');
            window.showMessage('Ocena utworu została zapisana!');
            window.dispatchEvent(new CustomEvent('trackRatingUpdated', {
                detail: { trackId: trackId, rating: rating }
            }));
        } catch (err) {
            console.error('Błąd:', err);
            window.showMessage('Błąd podczas zapisywania oceny', true);
        }
    }

    async function clearTrackRating(trackId) {
        try {
            const token = localStorage.getItem('token');
            if (!token) {
                window.showMessage('Zaloguj się, aby usunąć ocenę', true);
                return;
            }
            const res = await fetch(`/api/track-ratings/${trackId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error('Nie udało się usunąć');
            window.showMessage('Ocena utworu została usunięta!');
            window.dispatchEvent(new CustomEvent('trackRatingUpdated', {
                detail: { trackId: trackId, rating: 0 }
            }));
        } catch (err) {
            console.error('Błąd:', err);
            window.showMessage('Błąd podczas usuwania oceny', true);
        }
    }
</script>
