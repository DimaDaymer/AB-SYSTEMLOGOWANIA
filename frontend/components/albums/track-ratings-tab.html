<div id="track-ratings-container" class="track-ratings-list">
</div>

<style>
    .track-ratings-list {
        list-style-type: none;
        padding: 0;
        margin: 0;
    }
    .track-rating-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #333;
    }
    .track-info { flex-grow: 1; }
    .track-title { font-size: 16px; color: #ADFF2F; }
    .track-duration { font-size: 14px; color: #999; }

    .track-rating {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    /* Специфичный стиль для цифры "X.X/5" в списке треков */
    .track-rating-value {
        font-size: 16px;
        font-weight: bold;
        color: #ADFF2F;
        min-width: 55px;
        text-align: left;
    }


</style>

<script>
    window.components = window.components || {};
    window.components.trackRatingsTab = {
        update: function (tracks, userRatings) {
            const container = document.getElementById('track-ratings-container');
            if (!container) return;
            container.innerHTML = '';

            if (typeof StarRating === 'undefined') {
                console.error('StarRating class not loaded for tracks!');
                return;
            }

            tracks.forEach(track => {
                const trackRating = userRatings[track.id] || 0;

                const trackItem = document.createElement('li');
                trackItem.className = 'track-rating-item';
                trackItem.dataset.trackId = track.id;

                trackItem.innerHTML = `
                    <div class="track-info">
                        <div class="track-title">${track.track_number}. ${track.title}</div>
                        <div class="track-duration">${track.duration || ''}</div>
                    </div>
                    <div class="track-rating">
                        <div class="track-rating-value">${trackRating ? trackRating.toFixed(1) : '0.0'}/5</div>
                        <div class="track-star-rating-host"></div>
                    </div>
                `;

                const starHost = trackItem.querySelector('.track-star-rating-host');
                const valueEl = trackItem.querySelector('.track-rating-value');

                const trackRatingInstance = new StarRating(starHost, {
                    showValue: false,
                    clearableText: '×'
                });

                trackRatingInstance.setValue(trackRating);

                trackRatingInstance.container.addEventListener('ratingChanged', (e) => {
                    const newRating = e.detail.rating;
                    valueEl.textContent = `${newRating.toFixed(1)}/5`;

                    if (newRating === 0) {
                        clearTrackRating(track.id);
                    } else {
                        saveTrackRating(track.id, newRating);
                    }
                });

                container.appendChild(trackItem);
            });
        }
    };

    async function saveTrackRating(trackId, rating) {
        try {
            const token = localStorage.getItem('token');
            if (!token) {
                window.showMessage('Please log in to rate tracks', true);
                return;
            }
            const res = await fetch(`/api/track-ratings/${trackId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ rating })
            });
            if (!res.ok) throw new Error('Failed to save');
            window.showMessage('Track rating saved!');
            window.dispatchEvent(new CustomEvent('trackRatingUpdated', {
                detail: { trackId: trackId, rating: rating }
            }));
        } catch (err) {
            console.error('Error:', err);
            window.showMessage('Error saving rating', true);
        }
    }

    async function clearTrackRating(trackId) {
        try {
            const token = localStorage.getItem('token');
            if (!token) {
                window.showMessage('Please log in to clear rating', true);
                return;
            }
            const res = await fetch(`/api/track-ratings/${trackId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error('Failed to clear');
            window.showMessage('Track rating cleared!');
            window.dispatchEvent(new CustomEvent('trackRatingUpdated', {
                detail: { trackId: trackId, rating: 0 }
            }));
        } catch (err) {
            console.error('Error:', err);
            window.showMessage('Error clearing rating', true);
        }
    }
</script>
