<div class="album-tabs-wrapper">
    <div class="tabs-header">
        <button class="tab-btn active" data-tab="track-ratings">Oceny utworów</button>
        <button class="tab-btn" data-tab="credits">Twórcy</button>
        <button class="tab-btn" data-tab="lists">Listy</button>
        <button class="tab-btn" data-tab="tags">Tagi</button>
    </div>

    <div class="tabs-content">
        <div id="track-ratings-tab-container" class="tab-pane active"></div>
        <div id="credits-container" class="tab-pane"></div>
        <div id="album-lists-tab-container" class="tab-pane"></div>
        <div id="album-tags-tab-container" class="tab-pane"></div>
    </div>
</div>

<style>
    .album-tabs-wrapper {
        background: rgba(0, 0, 0, 0.4);
        border-radius: 12px;
        padding: 20px;
        margin-top: 20px;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tabs-header {
        display: flex;
        gap: 20px;
        border-bottom: 1px solid #333;
        margin-bottom: 20px;
        padding-bottom: 10px;
    }

    .tab-btn {
        background: none;
        border: none;
        color: #888;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        padding: 5px 0;
        position: relative;
        transition: color 0.3s ease;
    }

    .tab-btn:hover {
        color: #fff;
    }

    .tab-btn.active {
        color: #ADFF2F;
    }

    .tab-btn.active::after {
        content: '';
        position: absolute;
        bottom: -11px;
        left: 0;
        width: 100%;
        height: 2px;
        background: #ADFF2F;
        box-shadow: 0 0 8px rgba(173, 255, 47, 0.6);
    }

    .tab-pane {
        display: none;
        animation: fadeIn 0.4s ease;
    }

    .tab-pane.active {
        display: block;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<script>
    document.querySelectorAll('.tab-btn').forEach(button => {
        button.addEventListener('click', () => {
            const tabName = button.getAttribute('data-tab');

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));

            button.classList.add('active');

            if (tabName === 'track-ratings') document.getElementById('track-ratings-tab-container').classList.add('active');
            if (tabName === 'credits') document.getElementById('credits-container').classList.add('active');
            if (tabName === 'lists') document.getElementById('album-lists-tab-container').classList.add('active');
            if (tabName === 'tags') document.getElementById('album-tags-tab-container').classList.add('active');
        });
    });
</script>
