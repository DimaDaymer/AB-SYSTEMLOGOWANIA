// tags-tab.html
<style>
  .tags-tab {
    padding: 15px;
  }

  .tags-container {
    color: #bbb;
  }

  .tags-input-container {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }

  #tag-input {
    flex: 1;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid #444;
    border-radius: 4px;
    color: white;
    font-size: 0.9rem;
  }

  #add-tag-btn {
    padding: 8px 15px;
    background: #00ffcc;
    color: #1a1a1a;
    border: none;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  #add-tag-btn:hover {
    background: #00e6b8;
  }

  .tags-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .tag-item {
    padding: 5px 12px;
    background: rgba(0, 255, 204, 0.2);
    border-radius: 20px;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .tag-remove {
    cursor: pointer;
    font-weight: bold;
    padding: 0 5px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.2);
  }

  .tag-remove:hover {
    background: rgba(255, 0, 0, 0.3);
  }

  .loading {
    text-align: center;
    padding: 20px;
    color: #aaa;
    font-style: italic;
  }

  .error-message {
    color: #ff6b6b;
    padding: 10px;
    background: rgba(255, 0, 0, 0.1);
    border-radius: 4px;
    margin-top: 10px;
  }
</style>

<script>
  window.components = window.components || {};
  window.components.tagsTab = {
    loaded: false,

    init: function () {
      const addTagBtn = document.getElementById('add-tag-btn');
      if (addTagBtn) {
        addTagBtn.addEventListener('click', () => {
          this.addTag();
        });

        const tagInput = document.getElementById('tag-input');
        if (tagInput) {
          tagInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
              this.addTag();
            }
          });
        }
      }
    },

    load: async function (albumId) {
      if (this.loaded || !albumId) return;

      const container = document.querySelector('.tags-list');
      if (!container) return;

      container.innerHTML = '<div class="loading">Loading tags...</div>';

      try {
        const response = await fetch(`/api/albums/${albumId}/tags`);
        if (!response.ok) {
          throw new Error('Failed to load tags');
        }

        const tags = await response.json();
        this.loaded = true;

        container.innerHTML = '';

        if (tags.length === 0) {
          container.innerHTML = '<div class="loading">No tags yet. Be the first to add one!</div>';
          return;
        }

        tags.forEach(tag => {
          const tagElement = document.createElement('div');
          tagElement.className = 'tag-item';
          tagElement.innerHTML = `
            <span>${tag.name}</span>
            ${tag.is_owner ? `<span class="tag-remove" data-tag-id="${tag.id}">×</span>` : ''}
          `;

          container.appendChild(tagElement);

          // Add remove handler for owner tags
          if (tag.is_owner) {
            const removeBtn = tagElement.querySelector('.tag-remove');
            removeBtn.addEventListener('click', () => {
              this.removeTag(tag.id);
            });
          }
        });
      } catch (error) {
        console.error('Error loading tags:', error);
        container.innerHTML = `
          <div class="error-message">
            Failed to load tags: ${error.message}
          </div>
        `;
      }
    },

    addTag: async function () {
      const input = document.getElementById('tag-input');
      if (!input || !input.value.trim()) return;

      const tagName = input.value.trim();
      input.value = '';

      try {
        const token = localStorage.getItem('token');
        if (!token) {
          showMessage('Please log in to add tags', true);
          return;
        }

        const response = await fetch(`/api/albums/${window.currentAlbumId}/tags`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({name: tagName})
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || 'Failed to add tag');
        }

        // Reload tags
        await this.load(window.currentAlbumId);
        showMessage('Tag added successfully!');
      } catch (error) {
        console.error('Error adding tag:', error);
        showMessage('Error adding tag: ' + error.message, true);
      }
    },

    removeTag: async function (tagId) {
      try {
        const token = localStorage.getItem('token');
        if (!token) {
          showMessage('Please log in to remove tags', true);
          return;
        }

        const response = await fetch(`/api/albums/${window.currentAlbumId}/tags/${tagId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || 'Failed to remove tag');
        }

        // Reload tags
        await this.load(window.currentAlbumId);
        showMessage('Tag removed successfully!');
      } catch (error) {
        console.error('Error removing tag:', error);
        showMessage('Error removing tag: ' + error.message, true);
      }
    }
  };
</script>
