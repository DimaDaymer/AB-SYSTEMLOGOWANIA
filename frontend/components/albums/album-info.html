<div class="album-info">
    <h1 class="album-title" id="album-title"></h1>
    <div class="album-meta">
        <span><strong>Artist:</strong> <span id="album-artist"></span></span>
        <span><strong>Type:</strong> <span id="album-type"></span></span>
        <span><strong>Release Date:</strong><br> <a href="#" id="release-date-link"></a></span>
        <span><strong>Genres:</strong> <span id="album-genres"></span></span>
        <span><strong>Label:</strong> <span id="album-label"></span></span>
        <span><strong>Language:</strong> <span id="album-language"></span></span>
        <span><strong>Description:</strong> <span id="album-description"></span></span>
    </div>
</div>

<script>
    window.components = window.components || {};

    // ----------------------------------------------------
    // 1. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ----------------------------------------------------

    // Устанавливает простой текст
    const setText = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
    };

    // Устанавливает текст и URL для ссылки
    const setLinkText = (id, text, url) => {
        const el = document.getElementById(id);
        if (el) {
            el.textContent = text;
            el.href = url;
        }
    };

    // Функция для безопасного извлечения массива из строки (если данные приходят как строка "a, b, c")
    const getSplitArray = (data) => Array.isArray(data)
        ? data
        : (typeof data === 'string'
                ? data.split(',').map(s => s.trim()).filter(s => s.length > 0)
                : []
        );

    // Функция для создания кликабельных ссылок (для Type, Genres, Description и т.д.)
    function createLinks(containerId, dataArray, paramName, defaultText = 'N/A') {
        const container = document.getElementById(containerId);
        const elements = getSplitArray(dataArray);

        if (container && elements.length > 0) {
            container.innerHTML = elements.map(item => {
                const encodedItem = encodeURIComponent(item);
                // Все ссылки ведут на /new_releases.html с соответствующим параметром
                return `<a href="/new_releases.html?${paramName}=${encodedItem}" class="${paramName}-link">${item}</a>`;
            }).join(', ');
        } else {
            // Если данных нет, просто устанавливаем текст
            setText(containerId, defaultText);
        }
    }

    // ----------------------------------------------------
    // 2. ГЛАВНАЯ ФУНКЦИЯ ОБНОВЛЕНИЯ КОМПОНЕНТА
    // ----------------------------------------------------

    window.components.albumInfo = {
        update: function(albumData) {

            // Заголовок альбома
            setText('album-title', albumData.title || 'Untitled Album');

            // === ВОССТАНОВЛЕННЫЙ КОД ДЛЯ ИСПОЛНИТЕЛЯ (Artist) ===
            const artistContainer = document.getElementById('album-artist');
            // Ожидаем массив объектов: [{ name: '...', slug: '...' }, ...]
            const albumArtists = albumData.artists;

            if (artistContainer && Array.isArray(albumArtists) && albumArtists.length > 0) {
                // Создаем HTML-ссылки для каждого исполнителя
                artistContainer.innerHTML = albumArtists.map(artist => {
                    // Используем ссылку на страницу исполнителя с его слагом
                    // Если slug отсутствует, ссылка будет вести на заглушку
                    const artistUrl = artist.slug ? `/artist.html?slug=${artist.slug}` : '#';
                    return `<a href="${artistUrl}" class="artist-link">${artist.name}</a>`;
                }).join(', '); // Разделяем имена запятыми
            } else {
                setText('album-artist', 'Unknown artist');
            }
            // === КОНЕЦ ВОССТАНОВЛЕННОГО КОДА ДЛЯ ИСПОЛНИТЕЛЯ ===

            // --- Поля, где нужны кликабельные теги (используем новую функцию) ---

            // Тип альбома (теперь кликабельный)
            createLinks('album-type', albumData.type, 'type', albumData.type || 'N/A');

            // Жанры
            createLinks('album-genres', albumData.genres, 'genre');

            // Лейбл
            createLinks('album-label', albumData.label, 'label');

            // Язык
            createLinks('album-language', albumData.language, 'language');

            // Описание (теперь кликабельные теги)
            createLinks('album-description', albumData.description, 'description');

            // --- Дата выпуска (ссылка на год) ---
            const releaseDateLink = document.getElementById('release-date-link');
            const date = albumData.release_date ? new Date(albumData.release_date) : null;

            if (releaseDateLink && date && !isNaN(date.getTime())) {
                const year = date.getFullYear();
                // Используем формат, который у вас был: YYYY-MM-DD
                const formattedDate = date.toISOString().split('T')[0];
                setLinkText('release-date-link', formattedDate, `/new_releases.html?year=${year}`);
            } else {
                setLinkText('release-date-link', 'N/A', '#');
            }
        }
    };
</script>
