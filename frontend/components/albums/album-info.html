<div class="album-info">
    <h1 class="album-title" id="album-title">Ładowanie...</h1>
    <div class="album-meta">
        <span><strong>Wykonawca:</strong> <span id="album-artist"></span></span>
        <span><strong>Format:</strong> <span id="album-format"></span></span>
        <span id="album-attributes-wrapper" style="display: none;">
            <strong>Atrybuty:</strong> <span id="album-attributes"></span>
        </span>
        <span><strong>Data wydania:</strong><br> <a href="#" id="release-date-link"></a></span>
        <span><strong>Gatunki:</strong> <span id="album-genres"></span></span>
        <span><strong>Wytwórnia:</strong> <span id="album-label"></span></span>
        <span><strong>Język:</strong> <span id="album-language"></span></span>
        <span><strong>Deskryptory:</strong> <span id="album-description"></span></span>

        <div id="album-rank-container" style="display: none; margin-top: 15px; padding-top: 10px; border-top: 1px solid #444;">
            <strong>Rankingi:</strong>
            <div id="album-rank" style="display: flex; flex-direction: column; gap: 4px; margin-top: 5px;"></div>
        </div>
    </div>
</div>

<script>
    window.components = window.components || {};

    const setText = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
    };

    const getSplitArray = (data) => {
        if (Array.isArray(data)) return data.filter(s => s && s.length > 0);
        if (typeof data === 'string') return data.split(',').map(s => s.trim()).filter(s => s.length > 0);
        return [];
    };

    function createLinks(containerId, dataArray, paramName, defaultText = 'Brak danych') {
        const container = document.getElementById(containerId);
        if (!container) return false;
        const elements = getSplitArray(dataArray);
        if (elements.length > 0) {
            container.innerHTML = elements.map(item =>
                `<a href="/chart-page.html?${paramName}=${encodeURIComponent(item)}">${item}</a>`
            ).join(', ');
            return true;
        } else {
            setText(containerId, defaultText);
            return false;
        }
    }

    window.components.albumInfo = {
        update: function(albumData) {
            setText('album-title', albumData.title || 'Bez tytułu');
            const artistContainer = document.getElementById('album-artist');
            if (artistContainer && albumData.artists && albumData.artists.length > 0) {
                artistContainer.innerHTML = albumData.artists.map(a =>
                    `<a href="/artist/${a.slug}">${a.name}</a>`
                ).join(', ');
            } else {
                setText('album-artist', 'Nieznany');
            }

            createLinks('album-format', albumData.format_name, 'format', 'Nieznany');
            const hasAttrs = createLinks('album-attributes', albumData.attributes, 'attributes', '');
            const attrWrapper = document.getElementById('album-attributes-wrapper');
            if(attrWrapper) {
                attrWrapper.style.display = hasAttrs ? 'inline' : 'none';
            }

            createLinks('album-genres', albumData.genres, 'genres');
            setText('album-label', albumData.label || 'Brak danych');
            createLinks('album-language', albumData.languages, 'language');
            createLinks('album-description', albumData.descriptors, 'description');

            const dateLink = document.getElementById('release-date-link');
            if (dateLink && albumData.release_date) {
                const year = new Date(albumData.release_date).getFullYear();
                dateLink.textContent = albumData.release_date.split('T')[0];
                dateLink.href = `/chart-page.html?year=${year}`;
            }

            const rankContainer = document.getElementById('album-rank-container');
            const rankDiv = document.getElementById('album-rank');

            if (rankContainer && rankDiv) {
                let ranksHTML = [];
                const slugHash = albumData.slug ? `#${albumData.slug}` : '';

                if (albumData.current_rank) {
                    const generalUrl = `/chart-page.html?sort=rating${slugHash}`;
                    ranksHTML.push(`<div><a href="${generalUrl}" style="color: #adff2f; font-weight: bold;">#${albumData.current_rank} w Rankingu Ogólnym</a></div>`);
                }

                if (albumData.extra_ranks && albumData.extra_ranks.format) {
                    const fRank = albumData.extra_ranks.format;
                    if (fRank.name !== 'Album') {
                        const url = `/chart-page.html?format=${encodeURIComponent(fRank.name)}&sort=rating${slugHash}`;
                        ranksHTML.push(`<div><a href="${url}" style="color: #00ffcc;">#${fRank.rank} w kategorii ${fRank.name}</a></div>`);
                    }
                }

                if (albumData.extra_ranks && albumData.extra_ranks.attributes) {
                    albumData.extra_ranks.attributes.forEach(attr => {
                        const url = `/chart-page.html?attributes=${encodeURIComponent(attr.name)}&sort=rating${slugHash}`;
                        ranksHTML.push(`<div><a href="${url}" style="color: #ff99cc;">#${attr.rank} w kategorii ${attr.name}</a></div>`);
                    });
                }

                if (ranksHTML.length > 0) {
                    rankDiv.innerHTML = ranksHTML.join('');
                    rankContainer.style.display = 'block';
                } else {
                    rankContainer.style.display = 'none';
                }
            }
        }
    };
</script>
