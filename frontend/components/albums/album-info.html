<div class="album-info">
    <h1 class="album-title" id="album-title">Loading...</h1>
    <div class="album-meta">
        <span><strong>Artist:</strong> <span id="album-artist"></span></span>
        <span><strong>Format:</strong> <span id="album-format"></span></span>

        <span id="album-attributes-wrapper" style="display: none;">
            <strong>Attributes:</strong> <span id="album-attributes"></span>
        </span>

        <span><strong>Release Date:</strong><br> <a href="#" id="release-date-link"></a></span>
        <span><strong>Genres:</strong> <span id="album-genres"></span></span>
        <span><strong>Label:</strong> <span id="album-label"></span></span>
        <span><strong>Language:</strong> <span id="album-language"></span></span>
        <span><strong>Descriptors:</strong> <span id="album-description"></span></span>

        <span id="album-rank-container" style="display: none;">
            <strong>Ranked:</strong>
            <span id="album-rank"></span>
        </span>
    </div>
</div>

<script>
    window.components = window.components || {};

    const setText = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
    const getSplitArray = (data) => Array.isArray(data) ? data : (typeof data === 'string' ? data.split(',').map(s => s.trim()).filter(s => s.length > 0) : []);

    function createLinks(containerId, dataArray, paramName, defaultText = 'N/A') {
        const container = document.getElementById(containerId);
        if (!container) return false;
        const elements = getSplitArray(dataArray);
        if (elements.length > 0) {
            container.innerHTML = elements.map(item =>
                `<a href="/chart-page.html?${paramName}=${encodeURIComponent(item)}">${item}</a>`
            ).join(', ');
            return true;
        } else {
            setText(containerId, defaultText);
            return false;
        }
    }

    window.components.albumInfo = {
        update: function(albumData) {
            setText('album-title', albumData.title || 'Untitled');

            // Artist
            const artistContainer = document.getElementById('album-artist');
            if (artistContainer && albumData.artists && albumData.artists.length > 0) {
                artistContainer.innerHTML = albumData.artists.map(a => `<a href="/artist.html?slug=${a.slug}">${a.name}</a>`).join(', ');
            } else { setText('album-artist', 'Unknown'); }

            // Format & Attributes (Links)
            createLinks('album-format', albumData.format_name, 'format', 'Unknown');
            const hasAttrs = createLinks('album-attributes', albumData.attributes, 'attributes', '');
            if(document.getElementById('album-attributes-wrapper')) {
                document.getElementById('album-attributes-wrapper').style.display = hasAttrs ? 'inline' : 'none';
            }

            // Meta
            createLinks('album-genres', albumData.genres, 'genres');
            setText('album-label', albumData.label || 'N/A');
            createLinks('album-language', albumData.languages, 'language');

            // ИСПРАВЛЕНИЕ: Используем 'descriptors' из API для отображения дескрипторов
            // и передаем 'description' как имя параметра для фильтра (как и было)
            createLinks('album-description', albumData.descriptors, 'description');

            // Date
            const dateLink = document.getElementById('release-date-link');
            if (dateLink && albumData.release_date) {
                const year = new Date(albumData.release_date).getFullYear();
                dateLink.textContent = albumData.release_date.split('T')[0];
                dateLink.href = `/chart-page.html?year=${year}`;
            }

            // === RANK DISPLAY LOGIC ===
            const rankContainer = document.getElementById('album-rank-container');
            const rankSpan = document.getElementById('album-rank');

            if (rankContainer && rankSpan) {
                let ranksHTML = [];
                const slugHash = `#${albumData.slug}`;

                // 1. General Rank (Всегда показываем, если есть)
                if (albumData.current_rank) {
                    const generalUrl = `/chart-page.html?sort=rating${slugHash}`;
                    ranksHTML.push(`<a href="${generalUrl}" style="color: greenyellow; text-decoration: none; font-weight: bold;">#${albumData.current_rank} in General</a>`);
                }

                // 2. Format Rank
                if (albumData.extra_ranks && albumData.extra_ranks.format) {
                    const fRank = albumData.extra_ranks.format;
                    const isStandardAlbum = (fRank.name === 'Album');
                    const hasAttributes = (albumData.attributes && albumData.attributes.length > 0);

                    if (!isStandardAlbum || hasAttributes) {
                        const url = `/chart-page.html?format=${encodeURIComponent(fRank.name)}&sort=rating${slugHash}`;
                        ranksHTML.push(`<a href="${url}" style="color: #00ffcc; text-decoration: none;">#${fRank.rank} for ${fRank.name}</a>`);
                    }
                }

                // 3. Attribute Ranks (Всегда показываем все)
                if (albumData.extra_ranks && albumData.extra_ranks.attributes) {
                    albumData.extra_ranks.attributes.forEach(attr => {
                        const url = `/chart-page.html?attributes=${encodeURIComponent(attr.name)}&sort=rating${slugHash}`;
                        ranksHTML.push(`<a href="${url}" style="color: #ff99cc; text-decoration: none;">#${attr.rank} for ${attr.name}</a>`);
                    });
                }

                if (ranksHTML.length > 0) {
                    rankSpan.innerHTML = ranksHTML.join(' / ');
                    rankContainer.style.display = 'inline';
                } else {
                    rankContainer.style.display = 'none';
                }
            }
        }
    };
</script>
