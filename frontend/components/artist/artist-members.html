<div class="members-module">
    <div class="members-header">
        <h3 id="members-module-title">Members</h3>
        <button id="btn-edit-members" class="icon-btn" style="display: none;" title="Edit Relations">✎</button>
    </div>

    <div id="members-list" class="members-list">
        <div class="loading-placeholder">Loading...</div>
    </div>

    <div id="members-editor" class="members-editor" style="display: none;">
        <div class="editor-row">
            <div style="position: relative; flex: 1;">
                <input type="text" id="member-artist-input" placeholder="Name..." autocomplete="off" style="width: 100%;">
                <div id="artist-suggestions" class="suggestions-box"></div>
            </div>

            <div style="position: relative; flex: 1;">
                <input type="text" id="member-role-input" placeholder="Role (e.g. Vocalist)..." autocomplete="off" style="width: 100%;">
                <div id="role-suggestions" class="suggestions-box"></div>
            </div>
        </div>

        <div class="editor-row year-row" style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="number" id="member-start-year-input" placeholder="Start Year" min="1900" max="2100" style="flex: 1;">
            <input type="number" id="member-end-year-input" placeholder="End Year" min="1900" max="2100" style="flex: 1;">
            <button id="btn-add-member" class="button-small">Add</button>
        </div>
        <button id="btn-close-editor" class="text-btn">Done Editing</button>
    </div>
</div>
