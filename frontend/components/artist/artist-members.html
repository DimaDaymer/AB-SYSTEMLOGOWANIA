<link rel="stylesheet" href="/css/credits-members.css">

<div class="cm-module" id="artist-members-module">
    <div class="cm-header">
        <h3 id="members-module-title">Członkowie</h3>
        <button id="btn-edit-members" class="icon-btn" style="display: none;" title="Edytuj relacje">✎</button>
    </div>

    <div id="members-list" class="cm-list">
        <div class="cm-placeholder">Ładowanie...</div>
    </div>

    <div id="members-editor" class="cm-editor" style="display: none;">
        <div class="editor-row">
            <div class="input-wrapper">
                <input type="text" id="member-artist-input" class="cm-input" placeholder="Imię i nazwisko..." autocomplete="off">
                <div id="member-name-suggestions" class="suggestions-box"></div>
            </div>

            <div class="input-wrapper">
                <input type="text" id="member-role-input" class="cm-input" placeholder="Rola (np. Wokalista)..." autocomplete="off">
                <div id="member-role-suggestions" class="suggestions-box"></div>
            </div>
        </div>

        <div class="editor-row">
            <input type="number" id="member-start-year" class="cm-input" placeholder="Rok rozpoczęcia" min="1900" max="2100" style="flex: 1;">
            <input type="number" id="member-end-year" class="cm-input" placeholder="Rok zakończenia" min="1900" max="2100" style="flex: 1;">
            <button id="btn-add-member" class="cm-btn-add">Dodaj</button>
        </div>

        <button id="btn-close-members-editor" class="cm-btn-close">Zakończ edycję</button>
    </div>
</div>

<script>
    (function() {
        let ctx = { id: null, type: 'group', isAdmin: false, isEditing: false };
        const token = localStorage.getItem('token');

        // Inicjalizacja (wywoływana из artist.js)
        window.initMembersModule = async function(artistId, artistType = 'group') {
            ctx.id = artistId;
            ctx.type = artistType;
            ctx.isEditing = false;

            const titleEl = document.getElementById('members-module-title');
            const inputEl = document.getElementById('member-artist-input');

            if (titleEl && inputEl) {
                const isSolo = ctx.type === 'solo';
                titleEl.textContent = isSolo ? 'Występuje w grupach' : 'Członkowie';
                inputEl.placeholder = isSolo ? 'Nazwa grupy...' : 'Nazwa artysty...';
            }

            await loadMembers();
            await setupAdmin();
        };

        async function loadMembers() {
            const mode = ctx.type === 'solo' ? 'groups' : 'members';
            const list = document.getElementById('members-list');
            if (!list) return;

            try {
                const res = await fetch(`/api/credits/related/${ctx.id}?mode=${mode}`);
                const data = await res.json();

                if (!data.length) {
                    list.innerHTML = '<div class="cm-placeholder">Brak danych.</div>';
                    return;
                }

                const groups = {};
                data.forEach(item => {
                    const key = `${item.target_id}_${item.role_name}`;
                    if (!groups[key]) groups[key] = { ...item, periods: [], ids: [] };

                    let period = item.start_year ? `${item.start_year}-${item.end_year || 'Obecnie'}` : '';
                    if (period) groups[key].periods.push(`(${period})`);
                    groups[key].ids.push(item.id);
                });

                list.innerHTML = Object.values(groups).map(g => `
                <div class="cm-item">
                    <span class="cm-artist-name">
                        <a href="/artist.html?slug=${g.target_slug}">${g.target_name}</a>
                        <span class="cm-period">${g.periods.join(', ')}</span>
                    </span>
                    <span class="cm-role">${g.role_name || 'Członek'}</span>
                    ${ctx.isEditing ? `<button class="delete-btn" onclick="window.deleteMember('${g.ids.join(',')}')">×</button>` : ''}
                </div>
            `).join('');

            } catch (e) {
                list.innerHTML = '<div class="cm-placeholder">Błąd podczas ładowania danych.</div>';
            }
        }

        async function setupAdmin() {
            if (!token) return;
            try {
                const res = await fetch('/api/users/me', { headers: { 'Authorization': `Bearer ${token}` }});
                if (res.ok) {
                    const user = await res.json();
                    if (user.role === 'admin') {
                        ctx.isAdmin = true;

                        const btnEdit = document.getElementById('btn-edit-members');
                        const editor = document.getElementById('members-editor');
                        const btnClose = document.getElementById('btn-close-members-editor');
                        const btnAdd = document.getElementById('btn-add-member');

                        if (btnEdit) btnEdit.style.display = 'block';

                        const toggleEditor = () => {
                            ctx.isEditing = !ctx.isEditing;
                            if (editor) editor.style.display = ctx.isEditing ? 'block' : 'none';
                            loadMembers();
                        };

                        if (btnEdit) btnEdit.onclick = toggleEditor;
                        if (btnClose) btnClose.onclick = toggleEditor;

                        setupAutocomplete('member-artist-input', 'member-name-suggestions', 'search-artists');
                        setupAutocomplete('member-role-input', 'member-role-suggestions', 'search-roles');

                        if (btnAdd) {
                            btnAdd.onclick = async () => {
                                const targetName = document.getElementById('member-artist-input').value.trim();
                                const roleName = document.getElementById('member-role-input').value.trim();
                                const startYear = document.getElementById('member-start-year').value;
                                const endYear = document.getElementById('member-end-year').value;

                                if (!targetName || !roleName) return alert('Nazwa i rola są wymagane');

                                const payload = {
                                    hostArtistId: ctx.id,
                                    hostType: ctx.type,
                                    targetName,
                                    roleName,
                                    startYear,
                                    endYear
                                };

                                const apiRes = await fetch('/api/credits', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                    body: JSON.stringify(payload)
                                });

                                if (apiRes.ok) {
                                    document.getElementById('member-artist-input').value = '';
                                    document.getElementById('member-role-input').value = '';
                                    document.getElementById('member-start-year').value = '';
                                    document.getElementById('member-end-year').value = '';
                                    loadMembers();
                                } else {
                                    alert('Błąd podczas dodawania członka');
                                }
                            };
                        }
                    }
                }
            } catch (e) { console.error(e); }
        }

        window.deleteMember = async function(idsString) {
            if (!confirm('Usunąć tę relację?')) return;
            const ids = idsString.split(',');
            for (const id of ids) {
                await fetch(`/api/credits/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
            }
            loadMembers();
        };

        function setupAutocomplete(inputId, suggId, endpoint) {
            const input = document.getElementById(inputId);
            const sugg = document.getElementById(suggId);
            if (!input || !sugg) return;

            let timeout;
            input.oninput = () => {
                clearTimeout(timeout);
                const q = input.value.trim();
                if (q.length < 2) { sugg.style.display = 'none'; return; }

                timeout = setTimeout(async () => {
                    const res = await fetch(`/api/credits/${endpoint}?q=${encodeURIComponent(q)}`);
                    const data = await res.json();

                    if (data.length > 0) {
                        sugg.innerHTML = data.map(i => `<div class="suggestion-item">${i.name}</div>`).join('');
                        sugg.style.display = 'block';
                        sugg.querySelectorAll('.suggestion-item').forEach(el => {
                            el.onclick = () => { input.value = el.textContent; sugg.style.display = 'none'; };
                        });
                    } else {
                        sugg.style.display = 'none';
                    }
                }, 300);
            };

            document.addEventListener('click', (e) => {
                if (!input.contains(e.target) && !sugg.contains(e.target)) {
                    sugg.style.display = 'none';
                }
            });
        }
    })();
</script>
