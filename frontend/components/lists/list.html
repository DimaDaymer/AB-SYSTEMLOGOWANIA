<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Lista</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="/css/lists.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/comments.css">
</head>
<body>
<div id="dynamic-background"></div>
<div id="navbar-container"></div>
<div class="content-wrapper">

    <div class="list-header" style="margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #333;">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom: 10px;">
            <h1 id="list-main-title" style="margin: 0; font-size: 2.8em; color: #fff; font-weight: 800;">Ładowanie...</h1>
            <button id="edit-list-btn" class="action-button" style="display:none; padding: 10px 20px; background: #333; color: #00ffcc; border: 1px solid #00ffcc; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s;">✏️ Edytuj listę</button>
        </div>

        <p id="list-meta-info" style="color: #00ffcc; margin: 0 0 25px 0; font-size: 1.1em; letter-spacing: 0.5px;">...</p>

        <div class="hero-outer-container" style="display: flex; gap: 30px; align-items: stretch;">

            <div class="list-hero-section" style="flex: 2; margin-bottom: 0;">
                <div id="list-main-cover" class="list-page-cover"></div>
                <div class="list-description"></div>

            </div>
            <div class="list-hero-section" style="flex: 1; margin-bottom: 0; align-items: stretch;">
                <div class="similar-lists-section" style="width: 100%;">
                    <h3 style="font-size: 1.1em; margin-top: 0; color: #00ffcc; border-bottom: 1px solid rgba(0,255,204,0.2); padding-bottom: 5px;">
                        Podobne listy
                    </h3>
                    <div id="similar-lists-container">
                    </div>
                </div>
            </div>
        </div>

        <div class="pagination-options" style="margin-top: 25px; color: #888; display: flex; align-items: center; gap: 10px;">
            <label for="itemsPerPage">Pokaż na stronę:</label>
            <select id="itemsPerPage" style="background: #222; color: #fff; border: 1px solid #444; padding: 5px 10px; border-radius: 4px;">
                <option value="10">10</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>
    </div>

    <div class="list-page-content" style="display: flex; gap: 40px;">
        <div class="main-list-column" style="flex: 3;">
            <div class="list-controls" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h3 style="margin: 0; color: #fff;">Elementy</h3>
                <div style="display: flex; align-items: center;">
                    <label for="sort-by" style="margin-right: 12px; color: #aaa;">Sortuj według:</label>
                    <select id="sort-by" style="padding: 8px 12px; border-radius: 4px; background: #222; color: #fff; border: 1px solid #444;"></select>
                    <button id="save-sort-btn" style="display:none; margin-left: 15px; padding: 8px 16px; background: #00ffcc; color: #111; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Zapisz nową kolejność</button>
                </div>
            </div>
            <div class="album-list-container">
                <p style="color: #777; text-align: center;">Ładowanie elementów...</p>
            </div>
            <div id="pagination-footer" style="margin-top: 30px; display: flex; justify-content: center; gap: 5px;"></div>
        </div>

        <div id="comment-box-list-placeholder" class="hero-side-comments"></div>

    </div>
</div>

<script>
    // Zmieniono na ładowanie uniwersalnego comment-box.html
    fetch('/components/comment-box.html')
        .then(response => {
            if (!response.ok) throw new Error("Błąd ładowania comment-box.html");
            return response.text();
        })
        .then(html => {
            document.getElementById('comment-box-list-placeholder').innerHTML = html;
        })
        .catch(err => console.error("Błąd modułu komentarzy:", err));
</script>

<script src="/js/similar-loader.js"></script>
<script src="/js/list-app-core.js"></script>
<script src="/js/list-app-modal.js"></script>
<script type="module" src="/js/list-app-lists.js"></script>
<script src="/js/comments-core.js"></script>
<script src="/js/loadnavbar.js"></script>
</body>
</html>
