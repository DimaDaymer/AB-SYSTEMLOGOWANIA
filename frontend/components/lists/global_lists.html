<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Globalne Listy - Społeczność</title>
    <link rel="stylesheet" href="/css/lists.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-container"></div>
<div class="content-wrapper" style="max-width: 1300px; margin: 0 auto; padding: 20px;">
    <div class="filter-controls" style="display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap;">
        <div class="filter-group">
            <label for="listTypeFilter">Typ zawartości:</label>
            <select id="listTypeFilter">
                <option value="all">Wszystkie typy</option>
                <option value="album">Albumy</option>
                <option value="track">Utwory</option>
                <option value="artist">Artyści</option>
                <option value="user">Użytkownicy</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="listSortOrder">Sortuj według:</label>
            <select id="listSortOrder">
                <option value="created_at_desc">Najnowsze najpierw</option>
                <option value="items_count_desc">Najwięcej elementów</option>
                <option value="reviews_desc">Najwięcej recenzji</option>
            </select>
        </div>
    </div>
    <div class="list-header" style="margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #333;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 class="section-title" style="margin: 0; border: none; padding: 0;">Listy społeczności</h1>

            <div class="pagination-options">
                <label for="itemsPerPage">List na stronę:</label>
                <select id="itemsPerPage">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                </select>
            </div>
        </div>
        <p style="color: #00ffcc; margin-top: 5px; font-size: 1.1em;">Odkrywaj listy stworzone przez społeczność</p>
    </div>

    <div class="list-page-content">
        <div class="main-list-column" style="width: 100%;">
            <div id="globalListCardsContainer" class="list-cards-container">
                <p style="color: #777; text-align: center;">Ładowanie list społeczności...</p>
            </div>

            <div id="pagination-footer"></div>
        </div>
    </div>
</div>

<script src="/js/list-app-core.js"></script>
<script type="module" src="/js/list-app-lists.js"></script>
<script src="/js/loadnavbar.js"></script>

</body>
</html>
