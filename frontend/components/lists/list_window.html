<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить в список</title>
    <style>
        /* Стили для модального окна */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .list-window {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            color: #ddd;
            font-family: Arial, sans-serif;
        }

        .list-window h2 {
            color: #fff;
            margin-top: 0;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        /* Табы */
        .list-tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
        }
        .list-tab-button {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            background: none;
            border: none;
            color: #ccc;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        .list-tab-button.active {
            background: #00ffcc;
            color: #1a1a1a;
            border-radius: 6px 6px 0 0;
        }

        .list-tab-content {
            padding: 10px 0;
        }

        /* Список существующих элементов */
        #lists-container {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 5px;
        }
        .list-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px dotted #333;
            transition: background-color 0.2s;
        }
        .list-item:hover {
            background-color: #2e2e2e;
        }
        .list-item.selected {
            background-color: #00ffcc;
            color: #1a1a1a;
            font-weight: bold;
        }

        /* Форма создания нового списка */
        label {
            display: block;
            margin-top: 10px;
            color: #ccc;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #2e2e2e;
            color: #fff;
        }

        /* Кнопки действий */
        .action-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .action-buttons button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        .save-button, .add-button {
            background-color: #00ffcc;
            color: #1a1a1a;
        }
        .save-button:hover, .add-button:hover {
            background-color: #00e6b8;
        }
        .cancel-button {
            background-color: #444;
            color: #fff;
        }
        .cancel-button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

<div id="list-overlay" class="overlay">
    <div class="list-window">
        <h2>Управление списками</h2>

        <div class="list-tabs">
            <button class="list-tab-button active" data-target="existing-lists">Добавить в существующий</button>
            <button class="list-tab-button" data-target="new-list-form">Создать новый</button>
        </div>

        <div id="existing-lists" class="list-tab-content" style="display: block;">
            <div id="lists-container">
                <p style="text-align: center; color: #777;">Загрузка ваших списков...</p>
            </div>

            <div class="action-buttons">
                <button class="add-button" onclick="ListApp.modal.addAlbum()" disabled>Добавить</button>
                <button class="cancel-button" onclick="ListApp.modal.close()">Отмена</button>
            </div>
        </div>

        <div id="new-list-form" class="list-tab-content" style="display: none;">
            <label for="list-name">Название</label>
            <input type="text" id="list-name" placeholder="Название списка">
            <label for="list-description">Описание</label>
            <textarea id="list-description" rows="4" placeholder="Краткое описание"></textarea>

            <div class="action-buttons">
                <button class="save-button" onclick="ListApp.modal.createNew()">Сохранить</button>
                <button class="cancel-button" onclick="ListApp.modal.close()">Отмена</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
