<script>
    window.components = window.components || {};
    window.components.listsTab = {

        // Для Recent (Rated Albums)
        loadRatedAlbums: async function(containerId) {
            const ctx = window.ProfileContext;
            const url = ctx.getApiUrl('rated-albums');
            await this._fetchAndRender(url, containerId);
        },

        // Для Actions (Listen, Like, Wishlist)
        loadUserActions: async function(type, containerId) {
            const ctx = window.ProfileContext;
            const url = ctx.getActionUrl(type);
            await this._fetchAndRender(url, containerId);
        },

        // Общая функция рендера
        _fetchAndRender: async function(url, containerId) {
            const container = document.getElementById(containerId);
            if(!container) return;

            container.innerHTML = '<div class="loading">Loading...</div>';
            const ctx = window.ProfileContext;
            const headers = (!ctx.isPublicProfile && ctx.token) ? { 'Authorization': `Bearer ${ctx.token}` } : {};

            try {
                const res = await fetch(url, { headers });
                if(!res.ok) throw new Error('Error');
                const items = await res.json();

                if(!items || !items.length) {
                    container.innerHTML = '<div>List is empty.</div>';
                    return;
                }

                container.innerHTML = '';
                items.forEach(item => {
                    // Используем общий стиль списка
                    const div = document.createElement('div');
                    div.className = 'album-entry'; // Предполагается, что CSS для этого в global или tab-panel
                    div.innerHTML = `
                    <img src="${item.cover_url || '/assets/placeholder.png'}" class="list-cover">
                    <div class="list-info">
                        <a href="/release/album/${item.slug}">${item.title}</a>
                        <div>${item.artist}</div>
                    </div>
                    ${item.score ? `<div class="score">${item.score}</div>` : ''}
                `;
                    container.appendChild(div);
                });

            } catch (e) {
                console.error(e);
                container.innerHTML = 'Error loading list.';
            }
        }
    };
</script>
