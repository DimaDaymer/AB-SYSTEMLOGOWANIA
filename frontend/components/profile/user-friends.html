<div class="friends-box">
    <h3>Znajomi</h3>
    <div id="friends-list" class="friends-list">
        <div class="loading-small">Wczytywanie...</div>
    </div>
    <div id="friends-pagination" style="margin-top: 10px; display: flex; justify-content: center; gap: 5px;"></div>
</div>

<style>
    .friends-box {
        background: rgba(0, 0, 0, 0.4);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .friend-item { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #eee; padding: 6px 0; }
    .friend-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #333; }
    .loading-small { font-size: 0.8rem; color: #666; padding: 10px; }
</style>

<script>
    (function() {
        const handleImgError = "this.onerror=null; this.src='/img/default-artist.png';";

        const checkReady = setInterval(() => {
            if (window.profileContext && window.profileContext.ready) {
                clearInterval(checkReady);
                loadFriends();
            }
        }, 100);

        async function loadFriends(page = 1) {
            const ctx = window.profileContext;
            const list = document.getElementById('friends-list');
            const paginEl = document.getElementById('friends-pagination');
            const targetUsername = ctx.username || localStorage.getItem('username');
            const limit = 10;

            if (!targetUsername || !list) return;

            try {
                const res = await fetch(`/api/users/${targetUsername}/friends?page=${page}&limit=${limit}`);
                const data = await res.json();

                if (!data.items || !data.items.length) {
                    list.innerHTML = '<div style="color:#555; font-size:0.8em;">Brak znajomych</div>';
                    if (paginEl) paginEl.innerHTML = '';
                    return;
                }

                list.innerHTML = data.items.map(f => `
                    <a href="/user/${f.username}" class="friend-item">
                        <img src="${f.profile_pic || '/img/default-artist.png'}" onerror="${handleImgError}" class="friend-avatar">
                        <span>${f.username}</span>
                    </a>`).join('');

                if (paginEl) {
                    try {
                        const { renderPagination } = await import('/js/pagination.js');
                        renderPagination(
                            paginEl,
                            {
                                total: data.total,
                                page: data.page,
                                limit: data.limit
                            },
                            loadFriends,
                            { showInfo: false }
                        );
                    } catch (err) {
                        console.error("Błąd ładowania paginacji znajomych:", err);
                    }
                }
            } catch (e) {
                console.error('Błąd znajomych:', e);
                list.innerHTML = 'Błąd';
            }
        }
    })();
</script>
