<link rel="stylesheet" href="/css/comments.css">
<script src="/js/comments-core.js"></script>

<div class="comment-section-wrapper" id="profile-comments-root">
    <div class="comment-header">
        <h3>User Comments</h3>
        <div class="sort-controls">
            <select class="sort-select">
                <option value="newest">Newest</option>
                <option value="popular">Popular</option>
            </select>
        </div>
    </div>

    <div class="comment-input-area">
        <img src="/uploads/avatars/default.png" class="user-avatar-small">
        <div class="input-wrapper">
            <textarea class="comment-textarea main-input" placeholder="Write something on this wall..."></textarea>
            <button class="post-btn main-post-btn">Post</button>
        </div>
    </div>

    <div class="comments-list"></div>
    <div class="pagination"></div>
</div>

<div class="thread-overlay" id="thread-overlay-shared">
    <div class="thread-modal">
        <div class="thread-header">
            <span>Thread</span>
            <span class="close-thread" id="thread-close-btn">&times;</span>
        </div>
        <div class="thread-body" id="thread-content-shared"></div>
        <div class="thread-footer">
            <div class="input-wrapper">
                <textarea class="comment-textarea" id="thread-reply-input" placeholder="Write a reply..." style="min-height:40px;"></textarea>
                <button class="post-btn" id="thread-send-btn">Reply</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Инициализация для профиля
    // Ждем, пока profile.js определит username
    const initProfileComments = setInterval(() => {
        let targetUser = null;

        // Попытка 1: Из глобального контекста profile.js
        if (window.profileContext && window.profileContext.username) {
            targetUser = window.profileContext.username;
        }
        // Попытка 2: Если это мой профиль (из токена)
        else {
            try {
                const token = localStorage.getItem('token');
                if(token) {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = JSON.parse(decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
                    // Если URL просто /profile, берем из токена
                    if(window.location.pathname === '/profile') targetUser = jsonPayload.username;
                }
            } catch(e){}
        }

        if (targetUser) {
            clearInterval(initProfileComments);
            new CommentsCore({
                mode: 'PROFILE',
                entityId: targetUser,
                containerId: 'profile-comments-root'
            });
        }
    }, 500);
</script>
