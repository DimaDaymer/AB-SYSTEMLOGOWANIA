<style>
    /* Стиль контейнера гистограммы */
    .histogram-container {
        background-color: #111; /* Темный фон как на фото */
        padding: 20px;
        border-radius: 8px;
        color: #fff;
        font-family: sans-serif;
        margin-bottom: 20px;
        border: 1px solid #2a2a2a;
    }

    .histogram-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid #333;
        font-size: 0.9em;
        color: #aaa;
    }

    .hist-row {
        display: flex;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid #1a1a1a;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    .hist-row:hover {
        background-color: #1a1a1a;
    }

    .hist-score {
        width: 40px;
        font-weight: bold;
        font-size: 1.1em;
        color: #fff;
    }

    .hist-count {
        width: 60px;
        color: #888;
        font-size: 0.9em;
        text-align: right;
        margin-right: 15px;
    }

    .hist-bar-area {
        flex-grow: 1;
        margin-right: 20px;
        background-color: #1a1a1a; /* Фон пустой части бара */
        height: 24px;
        border-radius: 2px;
        position: relative;
    }

    .hist-bar-fill {
        background-color: #3b4d61; /* Серо-синий цвет как на фото */
        height: 100%;
        border-radius: 2px;
        width: 0; /* Анимируется JS */
        transition: width 0.5s ease-out;
    }

    .hist-stars {
        width: 100px;
        text-align: right;
        color: #ccc; /* Цвет звезд */
        font-size: 1.2em;
        letter-spacing: 2px;
    }

    /* Кнопка "Назад" для списка */
    .back-to-stats-btn {
        background: none;
        border: 1px solid #00ffcc;
        color: #00ffcc;
        padding: 5px 15px;
        cursor: pointer;
        margin-bottom: 15px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .back-to-stats-btn:hover {
        background: rgba(0, 255, 204, 0.1);
    }
</style>

<div id="ratings-histogram-view">
    <div class="histogram-container">
        <div class="histogram-header">
            <span>Rating</span>
            <span style="margin-left: auto; margin-right: 140px;">Histogram statistics</span>
            <span>Stars</span>
        </div>
        <div id="histogram-rows">Loading stats...</div>
    </div>
</div>

<script>
    class RatingsHistogram {
        constructor(containerId, username, apiBaseUrl, onRowClick) {
            this.container = document.getElementById(containerId);
            this.username = username;
            this.apiBaseUrl = apiBaseUrl; // e.g., '/api'
            this.onRowClick = onRowClick; // Callback function(score)
            this.stats = null;
        }

        async loadStats() {
            try {
                const response = await fetch(`${this.apiBaseUrl}/users/${this.username}/stats/ratings`);
                const data = await response.json();
                this.stats = data.stats; // { "5.0": 10, "4.5": 2 ... }
                this.total = data.totalRatings;
                this.render();
            } catch (error) {
                console.error("Failed to load stats", error);
                this.container.innerHTML = "Error loading statistics.";
            }
        }

        render() {
            const rowsContainer = document.getElementById('histogram-rows');
            rowsContainer.innerHTML = '';

            // Проходим от 5.0 до 0.5
            const scores = Object.keys(this.stats).sort((a, b) => parseFloat(b) - parseFloat(a));

            // Находим макс значение для масштабирования бара (чтобы самый длинный был 100%)
            const maxCount = Math.max(...Object.values(this.stats)) || 1;

            scores.forEach(score => {
                const count = this.stats[score];
                const percentage = (count / maxCount) * 100;
                const starsHtml = this.generateStars(parseFloat(score));

                const row = document.createElement('div');
                row.className = 'hist-row';
                row.innerHTML = `
                    <div class="hist-score">${score}</div>
                    <div class="hist-count">${count > 0 ? count : '-'}</div>
                    <div class="hist-bar-area">
                        <div class="hist-bar-fill" style="width: ${percentage}%"></div>
                    </div>
                    <div class="hist-stars">${starsHtml}</div>
                `;

                // Обработка клика
                row.addEventListener('click', () => {
                    if (this.onRowClick && count > 0) {
                        this.onRowClick(score);
                    }
                });

                rowsContainer.appendChild(row);
            });
        }

        generateStars(score) {
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                if (score >= i) {
                    stars += '★'; // Full star
                } else if (score >= i - 0.5) {
                    stars += '½'; // Half star (если шрифт поддерживает, иначе можно использовать спец символ)
                } else {
                    stars += '☆'; // Empty star
                }
            }
            return stars;
        }
    }
</script>
