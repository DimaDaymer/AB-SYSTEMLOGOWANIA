<div id="notifications-container"></div>
<div id="friends-container"></div>
<div id="soulmates-container"></div>
<div id="followed-artists-container-root"></div>

<script>
    (function() {
        // Используем функцию загрузки из родительского окна или определяем локально,
        // если profile.js загружает этот файл через fetch
        async function loadSubComponent(containerId, filePath) {
            const container = document.getElementById(containerId);
            if (!container) return;
            try {
                const response = await fetch(filePath);
                const html = await response.text();
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                const scripts = Array.from(tempDiv.querySelectorAll('script'));
                scripts.forEach(oldScript => oldScript.remove());
                container.innerHTML = tempDiv.innerHTML;

                for (const oldScript of scripts) {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => {
                        newScript.setAttribute(attr.name, attr.value);
                    });
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    document.body.appendChild(newScript);
                }
            } catch (error) {
                console.error(`Error loading sub-component ${filePath}:`, error);
            }
        }

        // Загружаем подразделы
        loadSubComponent('notifications-container', '/components/profile/user-notifications.html');
        loadSubComponent('friends-container', '/components/profile/user-friends.html');
        loadSubComponent('soulmates-container', '/components/profile/user-soulmates.html');
        loadSubComponent('followed-artists-container-root', '/components/profile/followed-artists.html');
    })();
</script>
