<h3 style="color:#fff; margin-bottom: 20px;">Oceny utworów według albumu</h3>
<div id="track-ratings-container"></div>
<div class="view-all-wrapper"></div>

<script type="module">
    (function() {
        const { getUrl, getHeaders, getStars, getArtist, createOpenAllBtn, openOverlay, toggleTracks, PREVIEW_LIMIT } = window.TabsShared;

        async function fetchRatedApi(page, limit) {
            const res = await fetch(`${getUrl('rated-albums')}?page=${page}&limit=${limit}`, { headers: getHeaders() });
            return await res.json();
        }

        async function loadTrackRatingsTab() {
            const container = document.getElementById('track-ratings-container');
            container.innerHTML = 'Wczytywanie...';
            try {
                const data = await fetchRatedApi(1, PREVIEW_LIMIT);
                container.innerHTML = data.items.map(a => `
                <div class="album-entry" style="flex-wrap:wrap">
                    <img src="${a.cover_url || '/img/default-artist.png'}" class="album-cover-small">
                    <div class="album-details">
                        <a href="/release/album/${a.slug}" class="title">${a.title}</a>
                        <span class="artist-info">${getArtist(a)}</span>
                    </div>
                    <button class="toggle-tracks-btn" data-id="${a.id}">Pokaż utwory</button>
                    <div class="track-list-dropdown" id="drop-${a.id}" style="display:none">Wczytywanie...</div>
                </div>`).join('');

                container.querySelectorAll('.toggle-tracks-btn').forEach(b => b.onclick = () => {
                    const d = document.getElementById(`drop-${b.dataset.id}`);
                    d.style.display = d.style.display === 'none' ? 'block' : 'none';
                    b.textContent = d.style.display === 'none' ? 'Pokaż utwory' : 'Ukryj utwory';
                    if (d.style.display === 'block') toggleTracks(b.dataset.id, b, `drop-${b.dataset.id}`);
                });
                createOpenAllBtn('trackratings', data.total, () => openOverlay('Oceny utworów', 'tracks', fetchRatedApi));
            } catch (e) { container.innerHTML = 'Błąd.'; }
        }

        loadTrackRatingsTab();
    })();
</script>
