<div id="tab-ulist-grid-container"></div>
<div class="view-all-wrapper"></div>

<script type="module">
    (function() {
        const { getUrl, getHeaders, createOpenAllBtn, openOverlay, PREVIEW_LIMIT } = window.TabsShared;

        async function fetchListsApi(page, limit) {
            const res = await fetch(`${getUrl('lists')}?page=${page}&limit=${limit}`, { headers: getHeaders() });
            return await res.json();
        }

        async function loadUserLists() {
            const container = document.getElementById('tab-ulist-grid-container');
            container.innerHTML = '<p style="color:var(--text-dim)">Wczytywanie list...</p>';
            try {
                const data = await fetchListsApi(1, PREVIEW_LIMIT);
                const lists = data.items || data;
                if (!lists || lists.length === 0) { container.innerHTML = 'Nie znaleziono list.'; return; }
                container.innerHTML = lists.slice(0, 6).map(list => `
                    <div class="album-entry">
                        <img src="${list.cover_url || '/img/default-artist.png'}" class="album-cover-small">
                        <div class="album-details">
                            <a href="/list.html?slug=${list.slug}" class="title">${list.name || list.title}</a>
                            <span class="artist-info">${list.type.toUpperCase()} • ${list.items_count || 0} el.</span>
                        </div>
                    </div>
                `).join('');
                createOpenAllBtn('userlists', data.total || lists.length, () => openOverlay('Listy użytkownika', 'lists', fetchListsApi));
            } catch (e) { container.innerHTML = 'Błąd.'; }
        }

        loadUserLists();
    })();
</script>
