<div id="user-tags-container"></div>
<div class="view-all-wrapper" id="tags-view-all-wrap"></div>

<script type="module">
    (function() {
        const { getUrl, getHeaders, getArtist, createOpenAllBtn, openOverlay } = window.TabsShared;

        async function fetchTagsApi(page, limit) {
            const res = await fetch(`${getUrl('my-tags')}?page=${page}&limit=${limit}`, { headers: getHeaders() });
            return await res.json();
        }

        async function loadTags() {
            const container = document.getElementById('user-tags-container');
            container.innerHTML = 'Wczytywanie tagów...';
            try {
                const data = await fetchTagsApi(1, 50);
                const items = data.items || data;
                const groups = items.reduce((acc, item) => {
                    if (!acc[item.tag_name]) acc[item.tag_name] = [];
                    acc[item.tag_name].push(item);
                    return acc;
                }, {});
                container.innerHTML = Object.keys(groups).sort().map(tagName => `
                <div class="tag-group">
                    <div class="tag-title">${tagName} (${groups[tagName].length})</div>
                    ${groups[tagName].slice(0, 3).map(a => `<div class="album-entry"><img src="${a.cover_url || '/img/default-artist.png'}" class="album-cover-small"><div class="album-details"><a href="/release/album/${a.slug}" class="title">${a.title}</a><span class="artist-info">${getArtist(a)}</span></div></div>`).join('')}
                </div>`).join('');
                createOpenAllBtn('tags', data.total || items.length, () => openOverlay('Wszystkie otagowane albumy', 'tags', fetchTagsApi));
            } catch (e) { container.innerHTML = 'Błąd.'; }
        }

        loadTags();
    })();
</script>
