<div id="reviews-container"></div>
<div class="view-all-wrapper"></div>

<script type="module">
    (function() {
        const { getUrl, getHeaders, getStars, formatDate, createOpenAllBtn, openOverlay, PREVIEW_LIMIT } = window.TabsShared;

        async function fetchReviewsApi(page, limit) {
            const res = await fetch(`${getUrl('reviews')}?page=${page}&limit=${limit}`, { headers: getHeaders() });
            return await res.json();
        }

        async function loadReviews() {
            const container = document.getElementById('reviews-container');
            container.innerHTML = 'Wczytywanie...';
            try {
                const data = await fetchReviewsApi(1, PREVIEW_LIMIT);
                const items = data.items || data;
                container.innerHTML = items.map(r => `<div class="album-entry" style="flex-direction:column; align-items:start"><div style="display:flex; gap:10px; width:100%"><img src="${r.cover_url || '/img/default-artist.png'}" style="width:40px;height:40px;border-radius:4px"><div style="flex-grow:1"><strong>${r.album_title}</strong><br><span style="color:gold">${getStars(r.user_score)}</span></div><span style="font-size:0.75rem; color:var(--text-dim)">${formatDate(r.created_at)}</span></div><p style="font-size:0.85rem; margin-top:8px; color:#ccc">${r.content ? r.content.substring(0, 120) + '...' : ''}</p></div>`).join('');
                createOpenAllBtn('reviews', data.total || items.length, () => openOverlay('Recenzje', 'reviews', fetchReviewsApi));
            } catch (e) { container.innerHTML = 'Błąd.'; }
        }

        loadReviews();
    })();
</script>
