<div class="side-card">
    <h3>Obserwowani wykonawcy</h3>
    <div id="followed-artists-container" class="followed-artists-grid">
        <div class="loading-placeholder" style="font-size: 0.9em; color: #888;">Wczytywanie...</div>
    </div>
    <div id="artists-pagination" style="margin-top: 15px;"></div>
</div>

<style>
    .side-card {
        background: rgba(0, 0, 0, 0.4);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .followed-artists-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
        gap: 15px; justify-items: center; margin-top: 15px;
    }
    .artist-card-mini {
        display: flex; flex-direction: column; align-items: center;
        text-decoration: none; width: 100%; transition: transform 0.2s ease;
    }
    .artist-card-mini:hover { transform: translateY(-3px); }
    .artist-avatar-mini {
        width: 70px; height: 70px; border-radius: 50%;
        object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.1);
        background: #1a1a1a; transition: all 0.3s ease;
    }
    .artist-card-mini:hover .artist-avatar-mini { border-color: #00ffcc; box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); }
    .artist-name-mini {
        font-size: 0.7rem; color: #999; text-align: center; margin-top: 8px;
        width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
</style>

<script>
    (function() {
        const checkReady = setInterval(() => {
            if (window.profileContext && window.profileContext.ready) {
                clearInterval(checkReady);
                loadFollowedArtists();
            }
        }, 100);

        async function loadFollowedArtists(page = 1) {
            const ctx = window.profileContext;
            const container = document.getElementById('followed-artists-container');
            const targetUsername = ctx.username || localStorage.getItem('username');
            const limit = 6;

            if (!targetUsername || !container) return;

            try {
                const res = await fetch(`/api/users/${targetUsername}/followed-artists?page=${page}&limit=${limit}`);
                const data = await res.json();

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = '<div style="color:#555; font-size:0.8em;">Brak subskrypcji</div>';
                    const paginEl = document.getElementById('artists-pagination');
                    if (paginEl) paginEl.innerHTML = '';
                    return;
                }

                container.innerHTML = data.items.map(a => `
                    <a href="/artist/${a.slug}" class="artist-card-mini" title="${a.name}">
                        <img src="${a.image || '/img/default-artist.png'}" class="artist-avatar-mini" onerror="this.src='/img/default-artist.png'">
                        <span class="artist-name-mini">${a.name}</span>
                    </a>`).join('');

                const paginEl = document.getElementById('artists-pagination');
                if (paginEl) {
                    try {
                        const { renderPagination } = await import('/js/pagination.js');
                        renderPagination('artists-pagination', {
                            total: data.total,
                            page: data.page,
                            limit: data.limit
                        }, loadFollowedArtists);
                    } catch (err) {}
                }
            } catch (e) {
                console.error('Błąd wykonawców:', e);
                container.innerHTML = '<div style="color:#555; font-size:0.8em;">Błąd wczytywania...</div>';
            }
        }
    })();
</script>
