<div className="tab-panel">
  <div className="tab-header">
    <div className="tab active" data-tab="recent">Recent</div>
    <div className="tab" data-tab="albums">Albums</div>
    <div className="tab" data-tab="liked">Liked</div>
    <div className="tab" data-tab="wishlist">Wishlist</div>
    <div className="tab" data-tab="trackratings">Track Ratings</div>
  </div>
  <div className="tab-content active" id="recent">
  </div>
  <div className="tab-content" id="albums"><p>Albums tab content.</p></div>
  <div className="tab-content" id="liked"><p>Liked tab content.</p></div>
  <div className="tab-content" id="wishlist"><p>Wishlist tab content.</p></div>
  <div className="tab-content" id="trackratings">
    <h3>Albums with Track Ratings</h3>
    <div id="track-ratings-container"></div>
  </div>
</div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const contents = document.querySelectorAll('.tab-content');

  // Эта вспомогательная функция теперь корректно работает с 5-балльной шкалой
  function getStarsForRating(rating) {
    if (!rating || rating === 0) return '☆☆☆☆☆';
    const fullStars = Math.floor(rating);
    const halfStar = rating % 1 >= 0.25 && rating % 1 < 0.75 ? '½' : '';
    const emptyStars = 5 - fullStars - (halfStar ? 1 : 0);
    return '★'.repeat(fullStars) + halfStar + '☆'.repeat(emptyStars);
  }

  // Эта вспомогательная функция для другой шкалы рейтинга (5-балльная для альбомов)
  function scoreToStars(score) {
    if (!score) return '☆☆☆☆☆';
    const fullStars = Math.floor(score);
    const halfStar = score % 1 >= 0.25 && score % 1 < 0.75 ? '½' : '';
    const emptyStars = 5 - fullStars - (halfStar ? 1 : 0);
    return '★'.repeat(fullStars) + halfStar + '☆'.repeat(emptyStars);
  }

  // Эта функция для рендеринга отдельных треков с их рейтингами
  function renderAlbumTracks(container, tracks) {
    container.innerHTML = '';
    tracks.forEach(track => {
      const trackElement = document.createElement('div');
      trackElement.className = 'track-item';
      // Исправлено: теперь отображается рейтинг из 5, а не из 10
      trackElement.innerHTML = `
        <div class="track-name">${track.track_number}. ${track.title}</div>
        <div class="track-rating">
            <span class="rating-stars">${getStarsForRating(track.user_rating)}</span>
            <span class="rating-value">${track.user_rating}/5</span>
        </div>
      `;
      container.appendChild(trackElement);
    });
  }

  // Новая функция для обновления рейтинга одного трека
  function updateSingleTrackRating(trackId, newRating) {
    const trackItem = document.querySelector(`#trackratings .track-item[data-track-id="${trackId}"]`);
    if (!trackItem) return;

    const ratingValueEl = trackItem.querySelector('.rating-value');
    if (ratingValueEl) {
      ratingValueEl.textContent = `${newRating.toFixed(1)}/5`;
    }

    const ratingStarsEl = trackItem.querySelector('.rating-stars');
    if (ratingStarsEl) {
      ratingStarsEl.textContent = getStarsForRating(newRating);
    }
  }

  // Это функция, которая загружает альбомы с рейтингами треков
  async function loadAlbumsWithTrackRatings() {
    try {
      const token = localStorage.getItem('token');
      if (!token) return;

      const container = document.getElementById('track-ratings-container');
      container.innerHTML = '<div class="loading">Loading track ratings...</div>';

      const res = await fetch(`/user/track-ratings`, {
        headers: {'Authorization': `Bearer ${token}`}
      });

      if (!res.ok) throw new Error('Failed to load track ratings');
      const albumsWithRatings = await res.json();

      if (!albumsWithRatings || albumsWithRatings.length === 0) {
        container.innerHTML = '<div class="no-ratings">No track ratings yet</div>';
        return;
      }

      container.innerHTML = '';
      albumsWithRatings.forEach(album => {
        const albumElement = document.createElement('div');
        albumElement.className = 'album-with-tracks';
        albumElement.innerHTML = `
          <div class="album-header">
            <div class="album-header-content">
              <img src="${album.cover_url || '/assets/album-placeholder.png'}"
                   alt="${album.title}" class="album-cover-small">
              <div>
                <div class="album-title">${album.title}</div>
                <div class="album-artist">${album.artist}</div>
              </div>
            </div>
            <div class="toggle-icon">▼</div>
          </div>
          <div class="tracks-container"></div>
        `;
        container.appendChild(albumElement);

        const header = albumElement.querySelector('.album-header');
        const tracksContainer = albumElement.querySelector('.tracks-container');
        header.addEventListener('click', () => {
          if (tracksContainer.style.maxHeight) {
            tracksContainer.style.maxHeight = null;
            header.classList.remove('expanded');
          } else {
            if (tracksContainer.innerHTML === '') {
              renderAlbumTracks(tracksContainer, album.tracks);
            }
            tracksContainer.style.maxHeight = tracksContainer.scrollHeight + 'px';
            header.classList.add('expanded');
          }
        });
      });

    } catch (err) {
      console.error('Error loading track ratings:', err);
      const container = document.getElementById('track-ratings-container');
      container.innerHTML = `<p style="color: #ff6b6b;">Error loading track ratings: ${err.message}</p>`;
    }
  }

  // ... (остальные функции loadUserActions, loadRatedAlbums) ...

  // Это устанавливает логику переключения вкладок
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      contents.forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).classList.add('active');

      switch (tab.dataset.tab) {
        case 'recent':
          loadRatedAlbums();
          break;
        case 'albums': // albums = listen
          loadUserActions('listen', 'albums');
          break;
        case 'liked':
          loadUserActions('like', 'liked');
          break;
        case 'wishlist':
          loadUserActions('wishlist', 'wishlist');
          break;
        case 'trackratings':
          loadAlbumsWithTrackRatings();
          break;
      }
    });
  });

  document.addEventListener('DOMContentLoaded', () => {
    const activeTab = document.querySelector('.tab.active');
    if (activeTab) {
      switch (activeTab.dataset.tab) {
        case 'recent':
          loadRatedAlbums();
          break;
        case 'albums':
          loadUserActions('listen', 'albums');
          break;
        case 'liked':
          loadUserActions('like', 'liked');
          break;
        case 'wishlist':
          loadUserActions('wishlist', 'wishlist');
          break;
        case 'trackratings':
          loadAlbumsWithTrackRatings();
          break;
      }
    }
  });

  // --- Добавлено: глобальный слушатель событий ---
  window.addEventListener('trackRatingUpdated', (e) => {
    const { trackId, rating } = e.detail;
    // Предполагается, что trackId в событии — это ID трека
    updateSingleTrackRating(trackId, rating);
  });
  // --- --------------------------------------- ---

</script>
