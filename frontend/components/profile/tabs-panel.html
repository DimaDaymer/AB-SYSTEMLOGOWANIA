<style>
    /* Style dla paginacji w overlayu */
    #overlay-pagination-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 5px;
        margin-top: 20px;
        padding-bottom: 20px;
    }
    .page-btn {
        background: #2a2a2a;
        border: 1px solid #444;
        color: #fff;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 4px;
    }
    .page-btn.active {
        background: var(--accent);
        border-color: var(--accent);
    }
    .page-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .sort-table th { cursor: pointer; user-select: none; }
    .sort-table th:hover { background: rgba(255,255,255,0.1); }
</style>

<div id="overlay-module" class="full-screen-overlay">
    <span class="close-overlay" id="close-overlay-btn">&times;</span>
    <div class="overlay-content">
        <h2 id="overlay-title" style="color: var(--accent); margin-bottom: 25px; font-weight: 300; letter-spacing: 1px; border-left: 4px solid var(--accent); padding-left: 15px;"></h2>
        <div id="overlay-table-container"></div>
        <div id="overlay-pagination-container"></div>
    </div>
</div>

<div class="tabs-header">
    <div class="tab active" data-tab="recent" data-src="/components/profile/tabs/tab-ratings.html">Oceny</div>
    <div class="tab" data-tab="trackratings" data-src="/components/profile/tabs/tab-tracks.html">Utwory</div>
    <div class="tab" data-tab="reviews" data-src="/components/profile/tabs/tab-reviews.html">Recenzje</div>
    <div class="tab" data-tab="userlists" data-src="/components/profile/tabs/tab-lists.html">Listy</div>
    <div class="tab" data-tab="liked" data-src="/components/profile/tabs/tab-liked.html">Polubione</div>
    <div class="tab" data-tab="wishlist" data-src="/components/profile/tabs/tab-wishlist.html">Chcę usłyszeć</div>
    <div class="tab" data-tab="albums" data-src="/components/profile/tabs/tab-listened.html">Przesłuchane</div>
    <div class="tab" data-tab="tags" data-src="/components/profile/tabs/tab-tags.html">Tagi</div>
</div>

<div class="tabs-body">
    <div id="recent" class="tab-content active"></div>
    <div id="trackratings" class="tab-content"></div>
    <div id="reviews" class="tab-content"></div>
    <div id="userlists" class="tab-content"></div>
    <div id="liked" class="tab-content"></div>
    <div id="wishlist" class="tab-content"></div>
    <div id="albums" class="tab-content"></div>
    <div id="tags" class="tab-content"></div>
</div>

<script type="module">
    import pagination from '/js/pagination.js';

    (function() {
        const OVERLAY_LIMIT = 100;
        let currentSort = { key: 'title', asc: true };
        let overlayState = { type: '', title: '', extra: null, fetchFn: null };
        const overlay = document.getElementById('overlay-module');

        // --- SHARED UTILITIES EXPORT ---
        // Tworzymy globalny obiekt, aby pod-moduły mogły korzystać z tych funkcji
        window.TabsShared = {
            PREVIEW_LIMIT: 10,

            formatDate: (dateStr) => {
                if (!dateStr) return '—';
                const d = new Date(dateStr);
                return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit', year: 'numeric' });
            },

            getArtist: (a) => {
                return a.artist || a.artist_name || (a.artists && a.artists[0] ? a.artists[0].name : '') || 'Nieznany wykonawca';
            },

            getStars: (score) => {
                if (!score || score === 0) return '';
                const s = parseFloat(score);
                const full = Math.floor(s);
                const half = s % 1 >= 0.5 ? '½' : '';
                const empty = 5 - full - (half ? 1 : 0);
                return '★'.repeat(full) + half + '☆'.repeat(Math.max(0, empty));
            },

            getUrl: (type, extra = '') => {
                const ctx = window.profileContext || { username: 'me', isPublic: false };
                const base = ctx.isPublic ? `/api/users/${ctx.username}` : `/api/users`;
                switch(type) {
                    case 'stats': return ctx.isPublic ? `${base}/stats/ratings` : `/api/users/me/stats/ratings`;
                    case 'rated-albums': return `${base}/rated-albums${extra}`;
                    case 'album-details': return `/api/albums/${extra}`;
                    case 'track-user-scores': return `/api/track-ratings/album/${extra}/user-scores`;
                    case 'actions': return ctx.isPublic ? `${base}/actions/${extra}` : `/api/actions/${extra}`;
                    case 'reviews': return `${base}/reviews`;
                    case 'lists': return `${base}/lists`;
                    case 'my-tags': return `${base}/tags`;
                    default: return '';
                }
            },

            getHeaders: () => {
                const token = localStorage.getItem('token') || (window.profileContext && window.profileContext.token);
                return token ? { 'Authorization': `Bearer ${token}` } : {};
            },

            createOpenAllBtn: (tabId, total, fn) => {
                const wrap = document.querySelector(`#${tabId} .view-all-wrapper`);
                if (!wrap) return;
                wrap.innerHTML = '';
                if (total > window.TabsShared.PREVIEW_LIMIT) {
                    const btn = document.createElement('button');
                    btn.className = 'view-all-btn';
                    btn.textContent = `OTWÓRZ PEŁNĄ LISTĘ (${total})`;
                    btn.onclick = fn;
                    wrap.appendChild(btn);
                }
            },

            openOverlay: async (title, type, fetchFn, extra = null) => {
                overlayState = { title, type, fetchFn, extra };
                document.getElementById('overlay-title').textContent = title;
                document.body.classList.add('overlay-open');
                overlay.style.display = 'block';
                overlay.scrollTop = 0;
                loadOverlayPage(1);
            }
        };

        // --- OVERLAY LOGIC ---
        document.getElementById('close-overlay-btn').onclick = closeOverlay;
        overlay.onclick = (e) => { if (e.target === overlay) closeOverlay(); };
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.style.display === 'block') closeOverlay();
        });

        function closeOverlay() {
            overlay.style.display = 'none';
            document.body.classList.remove('overlay-open');
            document.getElementById('overlay-table-container').innerHTML = '';
            document.getElementById('overlay-pagination-container').innerHTML = '';
        }

        async function loadOverlayPage(page) {
            const container = document.getElementById('overlay-table-container');
            container.innerHTML = '<p style="color:var(--text-dim); padding: 20px;">Wczytywanie danych...</p>';

            try {
                const data = await overlayState.fetchFn(page, OVERLAY_LIMIT, overlayState.extra);
                const items = data.items || data;
                const meta = {
                    total: data.total || items.length,
                    page: page,
                    limit: OVERLAY_LIMIT
                };
                renderSortableTable(container, items, overlayState.type);
                pagination.renderPagination('overlay-pagination-container', meta, (targetPage) => {
                    loadOverlayPage(targetPage);
                }, { scrollToTop: false });

            } catch (e) {
                container.innerHTML = '<p style="color:red">Błąd pobierania danych.</p>';
            }
        }

        function renderSortableTable(container, items, type) {
            container.innerHTML = '';
            const table = document.createElement('table');
            table.className = 'sort-table';

            let headers = [
                { label: '', key: null },
                { label: type === 'lists' ? 'Nazwa' : 'Wydanie', key: type === 'lists' ? 'name' : 'title' }
            ];

            if (type === 'lists') {
                headers.push({ label: 'Typ', key: 'type' }, { label: 'Elementy', key: 'items_count' }, { label: 'Utworzono', key: 'created_at' });
            } else {
                headers.push({ label: 'Wykonawca', key: 'artist' }, { label: 'Data wydania', key: 'release_date' });
                if (type === 'reviews') headers.push({ label: 'Ocena', key: 'user_score' }, { label: 'Data', key: 'created_at' });
                else if (type === 'tags') headers.push({ label: 'Tag', key: 'tag_name' });
                else if (['tracks', 'rated', 'recent'].includes(type)) headers.push({ label: 'Ocena', key: 'score' });
                else headers.push({ label: 'Dodano', key: 'created_at' });
            }

            const thead = document.createElement('thead');
            const trH = document.createElement('tr');
            headers.forEach(h => {
                const th = document.createElement('th');
                if (h.key) {
                    th.innerHTML = h.label + (currentSort.key === h.key ? (currentSort.asc ? ' ↑' : ' ↓') : '');
                    th.onclick = () => {
                        currentSort.asc = currentSort.key === h.key ? !currentSort.asc : true;
                        currentSort.key = h.key;
                        const sorted = [...items].sort((a, b) => {
                            let valA = a[h.key] ?? '';
                            let valB = b[h.key] ?? '';
                            if (['release_date', 'created_at'].includes(h.key)) {
                                valA = new Date(valA).getTime() || 0; valB = new Date(valB).getTime() || 0;
                            } else if (!isNaN(valA) && valA !== '' && !isNaN(valB)) {
                                valA = parseFloat(valA); valB = parseFloat(valB);
                            } else {
                                valA = valA.toString().toLowerCase(); valB = valB.toString().toLowerCase();
                            }
                            return currentSort.asc ? (valA > valB ? 1 : -1) : (valA < valB ? 1 : -1);
                        });
                        renderSortableTable(container, sorted, type);
                    };
                } else th.textContent = h.label;
                trH.appendChild(th);
            });
            thead.appendChild(trH);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            const { formatDate, getArtist, getStars } = window.TabsShared; // Użycie helperów

            items.forEach(a => {
                const tr = document.createElement('tr');
                tr.className = 'table-row';
                let rowHtml = `
                    <td><img src="${a.cover_url || '/img/default-artist.png'}" class="table-cover"></td>
                    <td><a href="${type==='lists' ? '/list.html?slug='+a.slug : '/release/album/'+a.slug}" class="table-link">${a.title || a.name || a.album_title || 'Nieznany'}</a></td>
                    <td><span class="table-artist">${type==='lists' ? a.type : getArtist(a)}</span></td>
                `;

                if (type !== 'lists') {
                    rowHtml += `<td style="color:var(--text-dim); font-size:0.85rem">${formatDate(a.release_date)}</td>`;
                    if (type === 'reviews') rowHtml += `<td style="color:gold">${getStars(a.user_score)}</td><td>${formatDate(a.created_at)}</td>`;
                    else if (['tracks', 'rated', 'recent'].includes(type)) rowHtml += `<td style="color:gold">${getStars(a.score || a.user_score)}</td>`;
                    else if (type === 'tags') rowHtml += `<td style="color:var(--accent)">#${a.tag_name}</td>`;
                    else rowHtml += `<td>${formatDate(a.created_at)}</td>`;

                    if (type === 'tracks') rowHtml += `<td><button class="toggle-tracks-btn" data-id="${a.id}">Utwory</button></td>`;
                } else {
                    rowHtml += `<td style="color:var(--text-dim)">${a.items_count || 0} el.</td><td>${formatDate(a.created_at)}</td>`;
                }

                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);

                if (type === 'tracks') {
                    const tRow = document.createElement('tr');
                    tRow.style.display = 'none';
                    tRow.innerHTML = `<td colspan="6"><div class="track-list-dropdown" id="drop-overlay-${a.id}">Wczytywanie...</div></td>`;
                    tbody.appendChild(tRow);
                    tr.querySelector('.toggle-tracks-btn').onclick = function() {
                        const isVis = tRow.style.display === 'table-row';
                        tRow.style.display = isVis ? 'none' : 'table-row';
                        this.textContent = isVis ? 'Utwory' : 'Ukryj';
                        // Jeśli potrzeba, można wywołać logikę ładowania utworów, ale tutaj w Overlayu
                        // prościej jest zostawić to, lub przenieść logikę toggleTracks do Shared
                        if (!isVis && window.TabsShared.toggleTracks) {
                            window.TabsShared.toggleTracks(a.id, this, `drop-overlay-${a.id}`);
                        }
                    };
                }
            });
            table.appendChild(tbody);
            container.appendChild(table);
        }

        // Dodajemy helper toggleTracks do shared, bo jest używany w tabeli Overlay i w zakładce Tracks
        window.TabsShared.toggleTracks = async (albumId, btn, dropId) => {
            const drop = document.getElementById(dropId);
            if (!drop.innerText.includes('Wczytywanie')) return;
            try {
                const { getUrl, getHeaders, getStars } = window.TabsShared;
                const [albRes, scoRes] = await Promise.all([
                    fetch(getUrl('album-details', albumId), { headers: getHeaders() }),
                    fetch(getUrl('track-user-scores', albumId), { headers: getHeaders() })
                ]);
                const albData = await albRes.json();
                const scoData = await scoRes.json();
                const scoresMap = Array.isArray(scoData) ? scoData.reduce((acc, s) => ({ ...acc, [s.track_id || s.id]: s.score || s.rating }), {}) : scoData;
                const tracks = albData.tracks || [];
                if (!tracks.length) { drop.innerHTML = 'Brak utworów.'; return; }

                drop.innerHTML = tracks.map(t => {
                    const score = scoresMap[t.id];
                    return `
                    <div class="track-item">
                        <span class="track-pos">${t.position || ''}</span>
                        <span class="track-name">${t.title}</span>
                        <span class="track-stars">${score ? getStars(score) : '<span style="opacity:0.1">☆☆☆☆☆</span>'}</span>
                    </div>`;
                }).join('');
            } catch (e) { drop.innerHTML = 'Błąd wczytywania.'; }
        };


        // --- TAB SWITCHING & LOADING ---
        const tabs = document.querySelectorAll('.tab');
        const loadedTabs = new Set();

        async function activateTab(tabEl) {
            document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
            tabEl.classList.add('active');

            const tabId = tabEl.dataset.tab;
            document.getElementById(tabId).classList.add('active');

            // Jeśli moduł nie był ładowany, załaduj go teraz
            if (!loadedTabs.has(tabId)) {
                const src = tabEl.dataset.src;
                if (src && window.loadComponent) {
                    await window.loadComponent(tabId, src);
                    loadedTabs.add(tabId);
                }
            }
        }

        tabs.forEach(t => t.onclick = () => activateTab(t));

        // Start: załaduj domyślny tab (recent)
        const defaultTab = document.querySelector('.tab[data-tab="recent"]');
        if (defaultTab) {
            // Czekamy chwilę aż profileContext będzie ready (bezpiecznik)
            const timer = setInterval(() => {
                if (window.profileContext) {
                    clearInterval(timer);
                    activateTab(defaultTab);
                }
            }, 50);
        }
    })();
</script>
