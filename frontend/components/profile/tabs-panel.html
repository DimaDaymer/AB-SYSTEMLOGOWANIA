<style>

    }

    .album-details { display: flex; flex-direction: column; justify-content: center; flex-grow: 1;}

    /* Review Text Styles */

    .rating-stars { color: #ffd700; letter-spacing: 2px; margin-left: auto; white-space: nowrap; }

    .pagination-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; padding: 10px 0; }
    .pagination-button { padding: 5px 10px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; }
    .pagination-button:hover:not(:disabled), .pagination-button.active { background: #00ffcc; color: #1a1a1a; }
    .pagination-button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* === HISTOGRAM STYLES (Интегрированы сюда) === */
    .histogram-container {
        background-color: #111;
        padding: 20px;
        border-radius: 8px;
        color: #fff;
        font-family: sans-serif;

        border: 1px solid #2a2a2a;
    }
    .histogram-header {
        display: flex; justify-content: space-between; margin-bottom: 15px;
        padding-bottom: 10px; border-bottom: 1px solid #333;

    }

        display: flex; align-items: center; padding: 8px 0;

    }

        flex-grow: 1; margin-right: 20px; background-color: #1a1a1a;

        padding: 5px 15px; cursor: pointer; margin-bottom: 15px;

    }
    .back-to-stats-btn:hover { background: rgba(0, 255, 204, 0.1); }

    /* === TRACK & TAG STYLES === */
    .tag-group { margin-bottom: 10px; border-bottom: 1px solid #2a2a2a; }
    .tag-group-title {
        color: #00ffcc; cursor: pointer; padding: 10px 5px; margin: 0;
        font-size: 1.2em; display: flex; justify-content: space-between; align-items: center;
        transition: background-color 0.2s ease;
    }
    .tag-group-title:hover { background-color: #2a2a2a; }
    .tag-group-title::after { content: '▼'; font-size: 0.8em; color: #888; transition: transform 0.3s ease-out; }
    .tag-group.expanded .tag-group-title::after { transform: rotate(180deg); }
    .tag-albums-list { overflow: hidden; transition: max-height 0.3s ease-out; display: flex; flex-direction: column; gap: 10px; padding: 0; }

    .album-with-tracks { margin-bottom: 15px; background: #1e1e1e; border-radius: 5px; overflow: hidden; }
    .album-header { display: flex; justify-content: space-between; align-items: center; padding: 10px; cursor: pointer; background: #252525; }
    .album-header-content { display: flex; align-items: center; gap: 10px; }
    .toggle-icon { font-size: 0.8em; color: #888; }
    .tracks-container { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: #111; }
    .track-item { display: flex; justify-content: space-between; padding: 8px 15px; border-bottom: 1px solid #222; }
    .track-name { color: #ddd; }
    .track-rating { display: flex; gap: 10px; align-items: center; }
    .rating-value { color: #00ffcc; font-weight: bold; }
</style>

<script>
    (function() {
        // === КЛАСС ГИСТОГРАММЫ (RatingsHistogram) ===
        class RatingsHistogram {
            constructor(containerId, username, apiBaseUrl, onRowClick) {
                this.container = document.getElementById(containerId);
                this.username = username;
                this.apiBaseUrl = apiBaseUrl;
                this.onRowClick = onRowClick;
                this.stats = null;
            }

            async loadStats() {
                try {
                    const url = `/api/users/${this.username}/stats/ratings`;
                    const headers = {};
                    if (window.profileContext && window.profileContext.token) {
                        headers['Authorization'] = `Bearer ${window.profileContext.token}`;
                    }

                    const response = await fetch(url, { headers });
                    if(!response.ok) throw new Error("Stats load failed");

                    const data = await response.json();
                    this.stats = data.stats;
                    this.total = data.totalRatings;
                    this.render();
                } catch (error) {
                    console.error("Failed to load stats", error);
                    this.container.innerHTML = "<p style='padding:20px; color:#aaa'>No ratings statistics available.</p>";
                }
            }

            render() {
                this.container.innerHTML = `
                <div class="histogram-container">
                    <div class="histogram-header">
                        <span>Rating</span>
                        <span style="margin-left: auto; margin-right: 140px;">Histogram statistics</span>
                        <span>Stars</span>
                    </div>
                    <div id="histogram-rows"></div>
                </div>`;

                const rowsContainer = this.container.querySelector('#histogram-rows');
                const scores = Object.keys(this.stats).sort((a, b) => parseFloat(b) - parseFloat(a));
                const maxCount = Math.max(...Object.values(this.stats)) || 1;

                scores.forEach(score => {
                    const count = this.stats[score];
                    const percentage = (count / maxCount) * 100;
                    const starsHtml = this.generateStars(parseFloat(score));

                    const row = document.createElement('div');
                    row.className = 'hist-row';
                    row.innerHTML = `
                        <div class="hist-score">${score}</div>
                        <div class="hist-count">${count > 0 ? count : '-'}</div>
                        <div class="hist-bar-area">
                            <div class="hist-bar-fill" style="width: ${percentage}%"></div>
                        </div>
                        <div class="hist-stars">${starsHtml}</div>
                    `;

                    row.addEventListener('click', () => {
                        if (this.onRowClick && count > 0) {
                            this.onRowClick(score);
                        }
                    });

                    rowsContainer.appendChild(row);
                });
            }

            generateStars(score) {
                let stars = '';
                for (let i = 1; i <= 5; i++) {
                    if (score >= i) stars += '★';
                    else if (score >= i - 0.5) stars += '½';
                    else stars += '☆';
                }
                return stars;
            }
        }
        // =================================================================

        const ctx = window.profileContext;
        const ALBUM_LIMIT = 10;
        let currentPage = {};
        let currentScoreFilter = null;
        let histogramInstance = null;

        function scoreToStars(score) {
            if (score === null || typeof score === 'undefined') return '';
            const stars = score <= 5 ? score : score / 2;
            const fullStars = Math.floor(stars);
            const halfStar = stars % 1 >= 0.25 && stars % 1 < 0.75 ? '½' : '';
            const emptyStars = 5 - fullStars - (halfStar ? 1 : 0);
            return '★'.repeat(Math.max(0, fullStars)) + halfStar + '☆'.repeat(Math.max(0, emptyStars));
        }

        /**
         * Обновленная функция рендеринга пагинации с номерами страниц.
         */
        function renderPagination(container, tabName, totalCount) {
            const totalPages = Math.ceil(totalCount / ALBUM_LIMIT);
            const currentPageNum = currentPage[tabName] || 1;

            // Удаляем старую пагинацию
            container.querySelectorAll('.pagination-controls').forEach(el => el.remove());

            if (totalPages <= 1) return;

            const paginationDiv = document.createElement('div');
            paginationDiv.className = 'pagination-controls';

            // Кнопка "Предыдущая"
            paginationDiv.insertAdjacentHTML('beforeend', `<button class="pagination-button" data-page="${currentPageNum - 1}" data-action="prev" ${currentPageNum === 1 ? 'disabled' : ''}>«</button>`);

            // Отображение номеров страниц (логика для показа только ближайших страниц)
            const maxVisiblePages = 7; // Максимальное количество видимых кнопок
            let startPage = Math.max(1, currentPageNum - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            // Добавляем кнопки с номерами страниц
            for (let i = startPage; i <= endPage; i++) {
                const isActive = i === currentPageNum ? 'active' : '';
                paginationDiv.insertAdjacentHTML('beforeend', `<button class="pagination-button ${isActive}" data-page="${i}">${i}</button>`);
            }

            // Кнопка "Следующая"
            paginationDiv.insertAdjacentHTML('beforeend', `<button class="pagination-button" data-page="${currentPageNum + 1}" data-action="next" ${currentPageNum === totalPages ? 'disabled' : ''}>»</button>`);

            // Добавляем обработчик клика для всех кнопок пагинации
            paginationDiv.querySelectorAll('.pagination-button').forEach(button => {
                button.addEventListener('click', () => {
                    const newPage = parseInt(button.dataset.page);

                    if (newPage >= 1 && newPage <= totalPages && newPage !== currentPageNum) {
                        currentPage[tabName] = newPage;
                        // Вызываем triggerLoad, который знает о фильтре
                        triggerLoad(tabName, newPage);
                    }
                });
            });

            container.appendChild(paginationDiv);
        }

        // --- Load User Reviews ---
        async function loadUserReviews(page = 1) {
            const container = document.getElementById('reviews');
            if (!container) return;

            const tabName = 'reviews';
            if (!ctx || (!ctx.isPublic && !ctx.token)) return;

            container.innerHTML = '<div class="loading">Loading reviews...</div>';
            try {
                const url = `${ctx.getApiUrl('reviews')}?page=${page}&limit=${ALBUM_LIMIT}`;
                const headers = (!ctx.isPublic && ctx.token) ? { 'Authorization': `Bearer ${ctx.token}` } : {};

                const res = await fetch(url, { headers });
                if (!res.ok) throw new Error(`Status: ${res.status}`);

                const data = await res.json();
                const reviews = data.items || [];
                const totalCount = data.total_count || 0;

                if (!reviews || reviews.length === 0) {
                    container.innerHTML = '<p>No reviews written yet.</p>';
                    return;
                }

                container.innerHTML = '';
                reviews.forEach(review => {
                    const reviewEl = document.createElement('div');
                    reviewEl.className = 'album-entry';
                    reviewEl.innerHTML = `
                    <div class="album-entry-header">
                        <div class="list-image">
                            <img src="${review.cover_url || '/assets/album-placeholder.png'}" alt="${review.album_title}" class="album-cover-small" />
                        </div>
                        <a href="/release/album/${review.slug}" style="color: inherit; text-decoration: none; display: flex; align-items: center; width: 100%;">
                            <div class="album-details">
                                <span class="title">${review.album_title}</span>
                                <span class="artist-year">${review.artist || 'Unknown Artist'}</span>
                            </div>
                            <span class="rating-stars">${scoreToStars(review.user_score)}</span>
                        </a>
                    </div>
                    <div class="review-block">
                        ${review.review_title ? `<span class="review-title">${review.review_title}</span>` : ''}
                        ${review.content}
                        <span class="review-date">${new Date(review.created_at).toLocaleDateString()}</span>
                    </div>
                    `;
                    container.appendChild(reviewEl);
                });

                renderPagination(container, tabName, totalCount);
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p>Failed to load reviews.</p>';
            }
        }

        // --- Logic for Rated Albums & Histogram ---
        async function loadRatedAlbums(page = 1, scoreFilter = null) {
            const listContainer = document.getElementById('rated-albums-container');
            const listWrapper = document.getElementById('rated-albums-list');
            const histogramWrapper = document.getElementById('histogram-wrapper');
            const titleEl = document.getElementById('current-filter-title');

            if (!ctx || (!ctx.isPublic && !ctx.token)) return;

            if (scoreFilter) {
                // Фильтр активен: показываем список, скрываем гистограмму
                histogramWrapper.style.display = 'none';
                listWrapper.style.display = 'block';
                titleEl.textContent = `Albums rated ${scoreFilter}`;
                currentScoreFilter = scoreFilter;
            }

            listContainer.innerHTML = '<div class="loading">Loading albums...</div>';

            try {
                let url = `${ctx.getApiUrl('rated-albums')}?page=${page}&limit=${ALBUM_LIMIT}`;
                if (scoreFilter) url += `&score=${scoreFilter}`;

                const headers = (!ctx.isPublic && ctx.token) ? { 'Authorization': `Bearer ${ctx.token}` } : {};
                const res = await fetch(url, { headers });
                const data = await res.json();
                const albums = data.items || [];

                if (albums.length === 0) {
                    listContainer.innerHTML = '<p>No albums found for this rating.</p>';
                    return;
                }

                listContainer.innerHTML = '';
                albums.forEach(album => {
                    const albumEl = document.createElement('div');
                    albumEl.className = 'album-entry';
                    albumEl.innerHTML = `
                        <div class="album-entry-header">
                            <div class="list-image">
                                <img src="${album.cover_url || '/assets/album-placeholder.png'}" alt="${album.title}" class="album-cover-small" />
                            </div>
                            <a href="/release/album/${album.slug}" style="color: inherit; text-decoration: none; display: flex; align-items: center; width: 100%;">
                                <div class="album-details">
                                    <span class="title">${album.title}</span>
                                    <span class="artist-year">${album.artist}</span>
                                </div>
                                <span class="rating-stars">${scoreToStars(album.score)}</span>
                            </a>
                        </div>
                    `;
                    listContainer.appendChild(albumEl);
                });

                renderPagination(listContainer, 'recent', data.total_count);

            } catch (err) {
                console.error(err);
                listContainer.innerHTML = '<p>Failed to load.</p>';
            }
        }

        // --- Init Histogram ---
        function initHistogram() {
            const container = document.getElementById('histogram-wrapper');
            container.style.display = 'block';
            document.getElementById('rated-albums-list').style.display = 'none';

            // Если гистограмма уже инициализирована, просто перезагружаем статистику
            if (histogramInstance) {
                histogramInstance.loadStats();
                return;
            }

            const username = ctx.username || (ctx.user ? ctx.user.username : 'me');

            histogramInstance = new RatingsHistogram(
                'histogram-wrapper',
                username,
                '/api',
                (score) => {
                    // При клике на бар загружаем список с фильтром
                    loadRatedAlbums(1, score);
                }
            );
            histogramInstance.loadStats();
        }

        // Back Button
        const backBtn = document.getElementById('back-to-histogram');
        if(backBtn) {
            backBtn.addEventListener('click', () => {
                document.getElementById('rated-albums-list').style.display = 'none';
                document.getElementById('histogram-wrapper').style.display = 'block';
                currentScoreFilter = null;
                // При возврате, убедитесь, что контейнер списка очищен от старой пагинации
                document.getElementById('rated-albums-container').innerHTML = '';
            });
        }

        async function loadUserActions(type, containerId, page = 1) {
            const container = document.getElementById(containerId + '-container') || document.getElementById(containerId);
            if (!container) return;

            const tabName = containerId;
            if (!ctx || (!ctx.isPublic && !ctx.token)) return;

            container.innerHTML = '<div class="loading">Loading...</div>';
            try {
                const url = `${ctx.getActionUrl(type)}?page=${page}&limit=${ALBUM_LIMIT}`;
                const headers = (!ctx.isPublic && ctx.token) ? { 'Authorization': `Bearer ${ctx.token}` } : {};

                const res = await fetch(url, { headers });
                if (!res.ok) { container.innerHTML = '<p>Empty.</p>'; return; }

                const data = await res.json();
                const actions = data.items || data;
                const totalCount = data.total_count || actions.length;

                if (!actions || actions.length === 0) {
                    container.innerHTML = `<p>List is empty</p>`;
                    return;
                }

                container.innerHTML = '';
                actions.forEach(action => {
                    const actionEl = document.createElement('div');
                    actionEl.className = 'album-entry';
                    actionEl.innerHTML = `
                    <div class="album-entry-header">
                        <div class="list-image">
                            <img src="${action.cover_url || '/assets/album-placeholder.png'}" alt="${action.title}" class="album-cover-small" />
                        </div>
                        <a href="/release/album/${action.slug}" style="color: inherit; text-decoration: none; display: flex; align-items: center; width: 100%;">
                            <div class="album-details">
                                <span class="title">${action.title}</span>
                                <span class="artist-year">${action.artist}</span>
                            </div>
                        </a>
                    </div>
                `;
                    container.appendChild(actionEl);
                });
                renderPagination(container, tabName, totalCount);
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p>Failed to load list.</p>';
            }
        }

        async function loadAlbumsWithTrackRatings() {
            const container = document.getElementById('track-ratings-container');
            if (!ctx || (!ctx.isPublic && !ctx.token)) return;

            container.innerHTML = '<div class="loading">Loading track ratings...</div>';
            try {
                const url = ctx.getApiUrl('track-ratings');
                const headers = (!ctx.isPublic && ctx.token) ? { 'Authorization': `Bearer ${ctx.token}` } : {};

                const res = await fetch(url, { headers });
                if (!res.ok) throw new Error('Failed');
                const albumsWithRatings = await res.json();

                if (!albumsWithRatings || albumsWithRatings.length === 0) {
                    container.innerHTML = '<div class="no-ratings">No track ratings yet</div>';
                    return;
                }

                container.innerHTML = '';
                albumsWithRatings.forEach(album => {
                    const displayArtist = album.artist ? album.artist.split(',')[0].trim() : 'Unknown Artist';
                    const albumElement = document.createElement('div');
                    albumElement.className = 'album-with-tracks';
                    albumElement.innerHTML = `
                    <div class="album-header">
                        <div class="album-header-content">
                            <img src="${album.cover_url || '/assets/album-placeholder.png'}"
                                 alt="${album.title}" class="album-cover-small" style="width:40px; height:40px;">
                            <div>
                                <div class="album-title" style="color:#fff; font-weight:bold;">${album.title}</div>
                                <div class="album-artist" style="color:#888; font-size:0.9em;">${displayArtist}</div>
                            </div>
                        </div>
                        <div class="toggle-icon">▼</div>
                    </div>
                    <div class="tracks-container"></div>
                `;
                    container.appendChild(albumElement);

                    const header = albumElement.querySelector('.album-header');
                    const tracksContainer = albumElement.querySelector('.tracks-container');

                    header.addEventListener('click', () => {
                        if (tracksContainer.innerHTML === '') {
                            album.tracks.forEach(track => {
                                const tDiv = document.createElement('div');
                                tDiv.className = 'track-item';
                                tDiv.innerHTML = `
                                <div class="track-name">${track.track_number}. ${track.title}</div>
                                <div class="track-rating">
                                    <span class="rating-stars" style="color:#ffd700;">${scoreToStars(track.user_rating)}</span>
                                    <span class="rating-value">${track.user_rating}</span>
                                </div>`;
                                tracksContainer.appendChild(tDiv);
                            });
                        }
                        if (tracksContainer.style.maxHeight) {
                            tracksContainer.style.maxHeight = null;
                            header.querySelector('.toggle-icon').textContent = '▼';
                        } else {
                            tracksContainer.style.maxHeight = tracksContainer.scrollHeight + 'px';
                            header.querySelector('.toggle-icon').textContent = '▲';
                        }
                    });
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p>Error loading tracks.</p>';
            }
        }

        async function loadUserTags() {
            const container = document.getElementById('user-tags-container');
            if (!ctx || (!ctx.isPublic && !ctx.token)) return;

            container.innerHTML = '<div class="loading">Loading tags...</div>';
            try {
                const url = ctx.isPublic
                    ? `/api/users/${ctx.username}/tags`
                    : `/api/tags/my-tags`;
                const headers = (!ctx.isPublic && ctx.token) ? { 'Authorization': `Bearer ${ctx.token}` } : {};

                const res = await fetch(url, { headers });
                if (!res.ok) throw new Error('Failed tags');
                const data = await res.json();

                if (data.length === 0) {
                    container.innerHTML = '<p>No tags yet.</p>';
                    return;
                }

                const groupedTags = {};
                data.forEach(item => {
                    if (!groupedTags[item.tag_name]) groupedTags[item.tag_name] = [];
                    groupedTags[item.tag_name].push(item);
                });

                container.innerHTML = '';
                for (const [tagName, albums] of Object.entries(groupedTags)) {
                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'tag-group';

                    const title = document.createElement('h3');
                    title.className = 'tag-group-title';
                    title.textContent = `#${tagName} (${albums.length})`;

                    const listDiv = document.createElement('div');
                    listDiv.className = 'tag-albums-list';
                    listDiv.style.maxHeight = '0px';

                    albums.forEach(album => {
                        const albumEl = document.createElement('div');
                        albumEl.className = 'album-entry';
                        albumEl.innerHTML = `
                     <div class="album-entry-header">
                        <div class="list-image">
                            <img src="${album.cover_url || '/assets/album-placeholder.png'}"
                                 alt="${album.title}" class="album-cover-small" />
                        </div>
                        <a href="/release/album/${album.slug}"
                           style="color: inherit; text-decoration: none; display: flex; align-items: center; width: 100%;">
                            <div class="album-details">
                                <span class="title">${album.title}</span>
                                <span class="artist-year">${album.artist_name || album.artist} (${new Date(album.release_date).getFullYear()})</span>
                            </div>
                        </a>
                    </div>
                `;
                        listDiv.appendChild(albumEl);
                    });

                    title.addEventListener('click', () => {
                        const isExpanded = groupDiv.classList.toggle('expanded');
                        if (isExpanded) {
                            listDiv.style.maxHeight = listDiv.scrollHeight + 'px';
                        } else {
                            listDiv.style.maxHeight = '0px';
                        }
                    });

                    groupDiv.appendChild(title);
                    groupDiv.appendChild(listDiv);
                    container.appendChild(groupDiv);
                }

            } catch (err) {
                console.error('Error loading tags:', err);
                container.innerHTML = '<p style="color:red">Error loading tags</p>';
            }
        }

        function triggerLoad(tabName, page = 1) {
            currentPage[tabName] = page;

            switch (tabName) {
                case 'recent':
                    // Если есть фильтр, грузим список, иначе гистограмму
                    if (currentScoreFilter) {
                        loadRatedAlbums(page, currentScoreFilter);
                    } else {
                        initHistogram();
                    }
                    break;

                case 'albums': loadUserActions('listen', 'albums', page); break;
                case 'liked': loadUserActions('like', 'liked', page); break;
                case 'wishlist': loadUserActions('wishlist', 'wishlist', page); break;
                case 'reviews': loadUserReviews(page); break;
                case 'trackratings': loadAlbumsWithTrackRatings(); break;
                case 'tags': loadUserTags(); break;
            }
        }

        const tabs = document.querySelectorAll('.tab');
        const contents = document.querySelectorAll('.tab-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                contents.forEach(c => c.classList.remove('active'));

                tab.classList.add('active');
                const targetId = tab.dataset.tab;
                document.getElementById(targetId).classList.add('active');

                triggerLoad(targetId, 1);
            });
        });

        // Инициализация при загрузке (если активный таб recent)
        const activeTab = document.querySelector('.tab.active');
        if (activeTab && activeTab.dataset.tab === 'recent') {
            triggerLoad('recent', 1);
        }

    })();
</script>
