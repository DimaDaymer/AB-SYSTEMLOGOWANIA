<div id="soulmate-section" class="side-card" style="display:none; background: linear-gradient(145deg, rgba(0, 255, 204, 0.05), rgba(0, 0, 0, 0.4)); border: 1px solid rgba(0, 255, 204, 0.2);">
    <h3 style="color: #00ffcc; font-size: 0.9rem; margin-bottom: 15px;">Muzyczna bratnia dusza</h3>
    <div id="soulmate-container">
        <div class="loading-small">Szukanie dopasowań...</div>
    </div>
</div>

<style>
    .side-card {
        background: rgba(0, 0, 0, 0.4);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .soulmate-card {
        display: flex; align-items: center; gap: 12px; text-decoration: none;
        background: rgba(255, 255, 255, 0.03); padding: 10px; border-radius: 10px;
        transition: all 0.3s ease; margin-bottom: 8px;
    }
    .soulmate-card:hover { background: rgba(255, 255, 255, 0.07); transform: translateX(5px); }
    .soulmate-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #00ffcc; }
    .soulmate-info { flex: 1; overflow: hidden; }
    .soulmate-name { display: block; color: #fff; font-weight: 600; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .soulmate-match { display: block; color: #00ffcc; font-size: 0.7rem; margin-top: 2px; }
    .loading-small { font-size: 0.8rem; color: #666; padding: 10px; }
</style>

<script>
    (function() {
        const checkReady = setInterval(() => {
            if (window.profileContext && window.profileContext.ready) {
                clearInterval(checkReady);
                const targetId = window.profileContext.targetId;
                if (targetId) loadSoulmatesList(targetId);
            }
        }, 100);

        async function loadSoulmatesList(userId) {
            const container = document.getElementById('soulmate-container');
            const section = document.getElementById('soulmate-section');
            if (!container || !section) return;

            try {
                const res = await fetch(`/api/similar/users/${userId}?limit=5&t=${Date.now()}`);
                const data = await res.json();

                if (data.items && data.items.length > 0) {
                    section.style.display = 'block';
                    container.innerHTML = data.items.map(user => `
                        <a href="/user/${user.username}" class="soulmate-card">
                            <img src="${user.profile_pic || '/img/default-avatar.png'}"
                                 onerror="this.src='/img/default-artist.png';" class="soulmate-avatar">
                            <div class="soulmate-info">
                                <span class="soulmate-name">${user.username}</span>
                                <span class="soulmate-match">Dopasowanie: ${user.match_percent}%</span>
                                <span style="font-size: 0.65rem; color: #00ffcc; opacity: 0.8;">
                                    Wspólnych ocen: ${user.shared_albums}
                                </span>
                            </div>
                        </a>
                    `).join('');
                } else {
                    section.style.display = 'none';
                }
            } catch (e) {
                console.error('Błąd soulmate:', e);
                section.style.display = 'none';
            }
        }
    })();
</script>
