<div id="notifications-box" class="notifications-box" style="display:none;">
    <h3>Powiadomienia <span id="notif-count" style="display:none; background:#ff4444; color:white; padding:2px 6px; border-radius:10px; font-size:0.7em;">0</span></h3>
    <div id="notif-list" class="notif-list">
        <div class="loading-small">Wczytywanie...</div>
    </div>
    <button id="mark-all-read" style="width:100%; background:none; border:none; color:#00ffcc; font-size:0.75em; cursor:pointer; margin-top:10px; text-align:right;">Oznacz wszystkie jako przeczytane</button>
</div>

<style>
    .notifications-box {
        background: rgba(0, 0, 0, 0.4);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .notif-list { max-height: 300px; overflow-y: auto; }
    .notif-item { padding: 10px; border-bottom: 1px solid #222; font-size: 0.85em; color: #ccc; }
    .notif-item.unread { border-left: 3px solid #00ffcc; background: rgba(0, 255, 204, 0.05); color: #fff; }
    .loading-small { font-size: 0.8rem; color: #666; padding: 10px; }
</style>

<script>
    (function() {
        const checkReady = setInterval(() => {
            if (window.profileContext && window.profileContext.ready) {
                clearInterval(checkReady);
                initNotifications();
            }
        }, 100);

        async function initNotifications() {
            const ctx = window.profileContext;
            if (!ctx.isPublic && ctx.token) {
                loadNotifications(ctx);
            }
        }

        async function loadNotifications(ctx) {
            const box = document.getElementById('notifications-box');
            if (box) box.style.display = 'block';
            const list = document.getElementById('notif-list');

            try {
                const res = await fetch('/api/notifications/my', {
                    headers: { 'Authorization': `Bearer ${ctx.token}` }
                });
                const data = await res.json();
                if (!data || !data.length) {
                    list.innerHTML = '<div style="color:#555; font-size:0.8em;">Brak powiadomień</div>';
                    return;
                }

                list.innerHTML = data.map(n => {
                    let link = '#';
                    if (n.type === 'new_release' && n.related_slug) {
                        link = `/release/album/${n.related_slug}`;
                    } else if (n.sender_username) {
                        link = `/user/${n.sender_username}`;
                    }
                    return `
                    <a href="${link}" class="notif-link" style="text-decoration:none;">
                        <div class="notif-item ${n.is_read ? '' : 'unread'}">
                            <div>${n.content}</div>
                            <div style="font-size:0.7em; color:#666; margin-top:4px;">
                                ${new Date(n.created_at).toLocaleString('pl-PL')}
                            </div>
                        </div>
                    </a>`;
                }).join('');
            } catch (e) {
                console.error('Błąd powiadomień:', e);
                list.innerHTML = 'Błąd wczytywania';
            }
        }
    })();
</script>
