<div class="avatar-wrapper">
    <div class="avatar">
        <img id="avatar-img" src="/assets/avatar-placeholder.png" alt="User Avatar" />
        <label for="avatarUpload" id="change-avatar-label" class="change-avatar-label" style="display:none;">Change Avatar</label>
        <input type="file" id="avatarUpload" accept="image/*" style="display: none;" />
    </div>
</div>

<div class="user-info-content">
    <h1 id="nickname">...</h1>
    <span><strong>Username:</strong> <span id="display-username">...</span></span>

    <div id="info-fields"></div>
    <div id="loading-error" style="color:red; margin-top: 10px; display:none;">Profile loading error. You might not be authorized or the API is not returning JSON.</div>

    <div class="profile-actions" style="margin-top: 15px;">
        <button id="editProfileButton" class="edit-button" style="display:none;">Edit Profile</button>

        <button id="followButton" class="follow-button" style="display:none;">Follow</button>
    </div>
</div>

<style>
    .avatar-wrapper { text-align: center; margin-bottom: 20px; }
    .avatar img { width: 150px; height: 150px; object-fit: cover; border-radius: 50%; }
    .info-line { margin: 5px 0; color: #ccc; }
    .change-avatar-label { cursor: pointer; color: #00ffcc; display: block; margin-top: 5px; font-size: 0.9em; }

    /* Styles for the follow button */
    .follow-button {
        background-color: #00ffcc; color: #000; border: none; padding: 8px 16px;
        cursor: pointer; font-weight: bold; border-radius: 4px;
        transition: opacity 0.2s;
    }
    .follow-button:hover { opacity: 0.8; }
    .follow-button.following {
        background-color: #333; color: #fff; border: 1px solid #555;
    }
</style>

<script>
    (function() {
        const ctx = window.profileContext;
        const errorEl = document.getElementById('loading-error');

        async function initUserInfo() {
            // If it's the user's own profile:
            if (!ctx.isPublic) {
                document.getElementById('change-avatar-label').style.display = 'block';
                const editBtn = document.getElementById('editProfileButton');
                editBtn.style.display = 'inline-block';
                editBtn.onclick = () => window.location.href = '/edit-profile.html';            }
            // If it's another user's profile and we are logged in:
            else if (ctx.token) {
                checkFollowStatus();
            }

            try {
                // FIX: Passing an empty string to get /api/users/:username or /api/users/me
                const url = ctx.getApiUrl('');
                const headers = (!ctx.isPublic && ctx.token) ? { 'Authorization': `Bearer ${ctx.token}` } : {};

                const res = await fetch(url, { headers });

                if (!res.ok) {
                    // If status is not 200 (e.g., 404 or 500)
                    throw new Error(`Profile fetch failed with status: ${res.status}`);
                }

                // Check Content-Type to ensure it's JSON
                const contentType = res.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Received non-JSON response from profile API');
                }

                const data = await res.json();

                errorEl.style.display = 'none';

                document.getElementById('nickname').textContent = data.nickname || data.username;
                document.getElementById('display-username').textContent = data.username;

                if (data.profile_pic) {
                    document.getElementById('avatar-img').src = data.profile_pic;
                }

                const fields = [
                    { label: 'Age', value: data.age },
                    { label: 'Country', value: data.country },
                    { label: 'About Me', value: data.description, isBlock: true },
                    { label: 'Music', value: data.music, isBlock: true }
                ];

                const fieldsContainer = document.getElementById('info-fields');
                fieldsContainer.innerHTML = fields.map(f => {
                    if (!f.value) return '';
                    return `<div class="info-line"><strong>${f.label}:</strong> ${f.value}</div>`;
                }).join('');

            } catch (e) {
                console.error("UserInfo Error:", e);
                // If an error occurred (including JSON parsing error), show it to the user
                errorEl.style.display = 'block';
                errorEl.textContent = 'Profile loading error. You might not be authorized or the API is not returning JSON.';
            }
        }

        // Follow button logic
        async function checkFollowStatus() {
            const btn = document.getElementById('followButton');
            btn.style.display = 'inline-block';

            try {
                const res = await fetch(`/api/users/${ctx.username}/is-following`, {
                    headers: { 'Authorization': `Bearer ${ctx.token}` }
                });
                const data = await res.json();
                updateFollowButton(data.isFollowing);
            } catch (e) { console.error(e); }

            btn.onclick = async () => {
                const isFollowing = btn.classList.contains('following');
                const method = isFollowing ? 'DELETE' : 'POST';

                try {
                    const res = await fetch(`/api/users/${ctx.username}/follow`, {
                        method: method,
                        headers: { 'Authorization': `Bearer ${ctx.token}` }
                    });
                    if (res.ok) {
                        updateFollowButton(!isFollowing);
                        // Update the friends list on the right panel
                        window.dispatchEvent(new CustomEvent('updateRightPanel'));
                    }
                } catch (e) { alert('Action Error'); }
            };
        }

        function updateFollowButton(isFollowing) {
            const btn = document.getElementById('followButton');
            if (isFollowing) {
                btn.textContent = 'Following (Unfollow)';
                btn.classList.add('following');
            } else {
                btn.textContent = 'Follow';
                btn.classList.remove('following');
            }
        }

        // Avatar upload logic
        document.getElementById('avatarUpload').addEventListener('change', async (e) => {
            if (ctx.isPublic) return;
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('avatar', file);

            try {
                const res = await fetch('/api/users/upload/avatar', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${ctx.token}` },
                    body: formData
                });
                const result = await res.json();
                if (result.success && result.url) {
                    document.getElementById('avatar-img').src = result.url + `?t=${Date.now()}`;
                }
            } catch (err) { console.error('Avatar upload error', err); }
        });

        initUserInfo();
    })();
</script>
