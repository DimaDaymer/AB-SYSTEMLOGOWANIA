<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Nowe wydania</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/filter_styles.css">

    <style>
        .content-wrapper {
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            gap: 20px;
        }

        #filter-sidebar-container {
            position: sticky;
            top: 20px;
            align-self: flex-start;
            min-width: 400px;
        }

        .main-content-wrapper {
            flex-grow: 1;
        }
    </style>
</head>
<body>
<div id="navbar-container"></div>
<div class="content-wrapper">
    <div class="main-content-wrapper">
        <div id="album-list-container">
            <div class="header-controls">
                <h1 id="main-content-title">Nowe wydania</h1>
                <div class="pagination-options">
                    <label for="itemsPerPage">Pokaż:</label>
                    <select id="itemsPerPage">
                        <option value="10">10</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>

            <div id="newReleasesContainer" class="album-list">
                <p>Ładowanie nowych wydań...</p>
            </div>

            <div id="pagination-footer"></div>
        </div>
    </div>
    <div id="filter-sidebar-container"></div>
</div>
<script src="/js/loadnavbar.js"></script>
<script type="module" src="/js/charts/main.js"></script>
<script src="/js/charts/filter_list.js"></script></body>
</html>
