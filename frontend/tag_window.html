<div class="overlay" id="tag-overlay">
    <div class="tag-window">
        <h2>Manage Tags</h2>
        <div class="tag-input-container">
            <input type="text" id="new-tag-input"
                   placeholder="Enter tag name (e.g. 'Sad Vibes')"
                   maxlength="30"
                   list="user-tags-suggestions">

            <button class="add-tag-btn" onclick="addNewTag()">Add</button>
        </div>

        <datalist id="user-tags-suggestions"></datalist>

        <div class="tags-list-label">Your tags for this album:</div>
        <div id="current-tags-list" class="tags-container">
        </div>

        <div class="action-buttons">
            <button class="cancel-button" onclick="closeTagWindow()">Close</button>
        </div>
    </div>
</div>

<style>
    /* ... (все ваши стили остаются без изменений) ... */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .tag-window {
        background: #1a1a1a;
        border-radius: 12px;
        padding: 20px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        color: #ddd;
        font-family: Arial, sans-serif;
        text-align: center;
    }
    .tag-window h2 { margin-top: 0; color: #00ffcc; }

    .tag-input-container {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .tag-window input {
        flex: 1;
        padding: 10px;
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 6px;
        color: #fff;
        box-sizing: border-box;
    }

    .add-tag-btn {
        background: #00ffcc;
        color: #1a1a1a;
        border: none;
        border-radius: 6px;
        padding: 0 20px;
        font-weight: bold;
        cursor: pointer;
    }

    .tags-list-label { text-align: left; margin-bottom: 10px; font-size: 0.9em; color: #888; }

    .tags-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 50px;
        margin-bottom: 20px;
    }

    .tag-pill {
        background: #333;
        padding: 5px 10px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        font-size: 0.9em;
        border: 1px solid #444;
    }

    .tag-pill .tag-remove {
        margin-left: 8px;
        color: #ff6b6b;
        cursor: pointer;
        font-weight: bold;
        padding-left: 5px;
    }

    .tag-pill .tag-remove:hover { color: #ff4444; }

    .cancel-button {
        background: #444;
        color: #ddd;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }
</style>

<script>
    // === (НОВАЯ ФУНКЦИЯ) ===
    // Загружает уникальные теги пользователя для подсказок
    async function loadTagSuggestions() {
        const datalist = document.getElementById('user-tags-suggestions');
        if (!datalist) return;

        try {
            const token = localStorage.getItem('token');
            const res = await fetch('/api/tags/my-unique-tags', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) return;

            const tags = await res.json(); // Ожидаем массив строк, напр. ["rock", "pop"]
            datalist.innerHTML = '';
            tags.forEach(tag => {
                const option = document.createElement('option');
                option.value = tag;
                datalist.appendChild(option);
            });
        } catch (e) {
            console.error('Failed to load tag suggestions:', e);
        }
    }


    async function loadAlbumTags() {
        const container = document.getElementById('current-tags-list');
        container.innerHTML = '<span style="color: #666;">Loading...</span>';

        try {
            const token = localStorage.getItem('token');
            if (!window.currentAlbumId) return;

            const res = await fetch(`/api/tags/album/${window.currentAlbumId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const tags = await res.json();
            renderTags(tags);
        } catch (e) {
            console.error(e);
            container.innerHTML = 'Error loading tags.';
        }
    }

    function renderTags(tags) {
        // ... (код без изменений) ...
        const container = document.getElementById('current-tags-list');
        container.innerHTML = '';

        if (!tags || tags.length === 0) {
            container.innerHTML = '<span style="color: #666; font-style: italic;">No tags yet.</span>';
            return;
        }

        tags.forEach(tag => {
            const div = document.createElement('div');
            div.className = 'tag-pill';
            div.innerHTML = `
                <span>#${tag.tag_name}</span>
                <span class="tag-remove" onclick="removeTag(${tag.id})">×</span>
            `;
            container.appendChild(div);
        });
    }

    async function addNewTag() {
        // ... (код без изменений) ...
        const input = document.getElementById('new-tag-input');
        const tagName = input.value.trim();
        if(!tagName) return;

        try {
            const token = localStorage.getItem('token');
            const res = await fetch('/api/tags', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ albumId: window.currentAlbumId, tagName })
            });

            if(res.ok) {
                input.value = '';
                loadAlbumTags();
                loadTagSuggestions(); // Обновляем подсказки после добавления нового тега
            } else {
                const err = await res.json();
                alert(err.error || 'Error adding tag');
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function removeTag(tagId) {
        // ... (код без изменений) ...
        if(!confirm('Remove this tag?')) return;
        try {
            const token = localStorage.getItem('token');
            const res = await fetch(`/api/tags/${tagId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if(res.ok) loadAlbumTags();
        } catch (e) { console.error(e); }
    }

    function closeTagWindow() {
        // ... (код без изменений) ...
        const overlay = document.getElementById('tag-overlay');
        if(overlay) overlay.remove();
        document.body.classList.remove('no-scroll');
    }

    // Запускаем обе функции при загрузке окна
    if (document.getElementById('current-tags-list')) {
        loadAlbumTags();
        loadTagSuggestions(); // <-- (ИЗМЕНЕНИЕ)
    }
</script>
