<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Исполнитель | RateYourMusic Clone</title>
    <link rel="stylesheet" href="/css/main.css"> <link rel="stylesheet" href="/css/artist.css"> </head>
<body>

<div id="navbar-container">
</div>

<div class="container">
    <div class="artist-header">
        <img id="artistPhoto" src="/assets/artist-placeholder.png" alt="Фото исполнителя" class="artist-photo">
        <div class="artist-info">
            <h1 id="artistName">Загрузка...</h1>
            <p id="artistLocation" class="artist-location"></p>
        </div>
    </div>

    <div class="artist-details">
        <div class="detail-block">
            <h3>Основан</h3>
            <p id="foundedDate"></p>
        </div>
        <div class="detail-block">
            <h3>Участники</h3>
            <p id="membersList"></p>
        </div>
        <div class="detail-block" id="relatedArtistsBlock" style="display:none;">
            <h3>Связанные исполнители</h3>
            <p id="relatedArtistsList"></p>
        </div>
        <div class="detail-block" id="alsoKnownAsBlock" style="display:none;">
            <h3>Также известен как</h3>
            <p id="alsoKnownAsList"></p>
        </div>
        <div class="detail-block">
            <h3>Жанры</h3>
            <p id="genresList"></p>
        </div>
    </div>

    <div class="artist-bio">
        <h3>Биография</h3>
        <p id="artistBio"></p>
    </div>

    <div class="artist-discography">
        <h2>Дискография</h2>
        <div class="discography-grid" id="discographyContainer">
            <p>Загрузка дискографии...</p>
        </div>
    </div>
</div>

<script src="/js/artist.js"></script>

</body>
</html>
