<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły utworu | MelodyRater</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="/css/albums.css">
    <link rel="stylesheet" href="/css/stars.css">
    <link rel="stylesheet" href="/css/comments.css">
    <link rel="stylesheet" href="/css/similar.css">

    <script src="/js/loadnavbar.js"></script>
    <script src="/js/track.js"></script>
    <script src="/js/StarRating.js"></script>
    <script src="/js/comments-core.js"></script>
    <script src="/js/list-app-core.js"></script>
    <script src="/js/list-app-modal.js"></script>
    <script src="/js/similar-loader.js"></script>
</head>
<body>
<div id="navbar-container"></div>
<div id="dynamic-background"></div>

<div class="container">
    <div class="left-panel">
        <div id="album-cover-container"></div>
        <div id="tracklist-container" style="margin-top: 20px;"></div>
    </div>

    <div class="center-panel">
        <div id="track-info-container"></div>

        <div id="comments-module-container"></div>

        <div id="similar-tracks-section" style="margin-top: 30px;">
            <h3 style="font-size: 1.2em; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px;">Fani lubią również</h3>
            <div id="similar-tracks-container">
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="score-block">
            <div id="global-track-score" class="score-value">
                N/A
            </div>
            <div id="global-ratings-count" class="score-ratings">
                na podstawie 0 ocen
            </div>
            <div id="track-star-rating-host"></div>

            <div id="histogram-container"></div>
        </div>

        <div class="user-actions-container">
            <button id="add-track-to-list-btn" class="action-btn-styled">
                <i class="fas fa-list"></i> Dodaj do listy
            </button>
        </div>

        <div id="track-lists-module-container"></div>

        <div id="media-links-container"></div>

    </div>
</div>
</body>
</html>
