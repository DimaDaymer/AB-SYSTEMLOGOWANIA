<div id="language-list-content">
    <h3>All language</h3>
    <a href="#" id="back-to-filters" style="display: block; margin-bottom: 15px; color: #00ffcc;">← Back to filters</a>
    <div className="language-container" id="language-list-grid">
        <p>Loading language...</p>
    </div>
</div>
<style>
    .language-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
    }

    .language-item {
        display: block;
        padding: 8px;
        background-color: #444;
        color: #ccc;
        text-align: center;
        border-radius: 4px;
        text-decoration: none;
        transition: background-color 0.2s, color 0.2s;
    }

    .language-item:hover {
        background-color: #555;
        color: #fff;
    }

    .language-item.active {
        background-color: #00ffcc;
        color: #1a1a1a;
        font-weight: bold;
    }
</style>
<script>
    window.initLanguageList = async function () {
        const languageContainer = document.getElementById('language-list-grid');
        const urlParams = new URLSearchParams(window.location.search);
        const selectedLanguage = urlParams.get('language');
        let selectedLanguageArray = selectedLanguage ? selectedLanguage.split(',').map(g => g.trim()) : [];

        try {
            const response = await fetch('/api/filters/all-language');
            if (!response.ok) throw new Error('Failed to fetch language');
            const language = await response.json();

            languageContainer.innerHTML = '';
            if (language.length > 0) {
                language.forEach(language => {
                    const languageItem = document.createElement('a');
                    languageItem.href = '#';
                    languageItem.className = 'language-item';
                    languageItem.textContent = language;

                    if (selectedLanguageArray.includes(language)) {
                        languageItem.classList.add('active');
                    }

                    languageItem.addEventListener('click', (e) => {
                        e.preventDefault();
                        const isCurrentlyActive = languageItem.classList.contains('active');
                        if (isCurrentlyActive) {
                            languageItem.classList.remove('active');
                            const index = selectedLanguageArray.indexOf(language);
                            if (index > -1) {
                                selectedLanguageArray.splice(index, 1);
                            }
                        } else {
                            languageItem.classList.add('active');
                            selectedLanguageArray.push(language);
                        }

                        const newUrl = new URL(window.location);
                        if (selectedLanguageArray.length > 0) {
                            newUrl.searchParams.set('language', selectedLanguageArray.join(','));
                        } else {
                            newUrl.searchParams.delete('language');
                        }

                        window.history.pushState({}, '', newUrl);

                        if (window.applyFilters) {
                            window.applyFilters();
                        }
                    });
                    languageContainer.appendChild(languageItem);
                });
            } else {
                languageContainer.innerHTML = '<p>No language found.</p>';
            }
        } catch (error) {
            console.error('Error fetching language:', error);
            languageContainer.innerHTML = '<p>Failed to load language.</p>';
        }
    };

    document.getElementById('back-to-filters').addEventListener('click', (e) => {
        e.preventDefault();
        const sidebar = document.getElementById('filter-sidebar-container');
        if (sidebar && typeof window.loadFilterSidebar === 'function') {
            window.loadFilterSidebar();
        } else {
            console.error('loadFilterSidebar function is not defined or container not found.');
        }
    });

    // Added a simple function call to run when the script is loaded
    if (typeof window.initLanguageList === 'function') {
        window.initLanguageList();
    }
</script>
